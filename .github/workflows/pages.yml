# GitHub Pages 改由 Actions 部署（2026-10-03，第二輪路線圖 pages-deploy-via-actions，站主「都可以製作」）
#
# 為什麼：現在 Pages 是「從 main 整包發佈」，建置中間檔（out_data/ 63.6MB、tools/glamour/data/ 22.3MB、
# scripts/、docs/…）前端一個都不讀，卻佔 1GB 發佈上限。這支只上傳 scripts/build-pages-artifact.mjs
# 挑出來的檔（省約 89MB），並在部署後到線上確認真的換版了。
#
# ⚠ **在站主切換設定之前，這支什麼都不做**（每次推送只會出現一筆「略過」）。啟用要兩步，見
#   docs/pages-deploy-sop.md：
#     1. Settings → Pages → Build and deployment → Source 改成「GitHub Actions」
#     2. Settings → Secrets and variables → Actions → Variables 新增 PAGES_VIA_ACTIONS = true
#   回復舊方式：Source 改回「Deploy from a branch（main ／ root）」並刪掉那個變數。
#
# 觸發：推到 main、手動 Run workflow。時尚品鑑週更用 GITHUB_TOKEN 推送，**那種推送不會觸發這支**，
# 所以 fashion-report.yml 在啟用後會自己 dispatch 這支。
name: 部署網站（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# 同時只跑一個部署；後到的排隊，不取消正在跑的（取消到一半的部署比慢一點更糟）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 閘門在腳本裡：必備檔、每一頁、前端寫死的 data/ 路徑、被排除的路徑沒人引用——任一條不過就中止
      - name: 組出要發佈的檔
        run: node scripts/build-pages-artifact.mjs --out _site --stamp "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SITE: https://seagod99.github.io
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # build.json 是組檔時蓋上的 commit sha（--stamp）；線上讀到同一個 sha 才算這一版真的上去了。
      # 另外確認底線開頭的 data/_meta.json 拿得到（§4.94：Jekyll 會吃掉它，回的是 HTML 404）
      - name: 確認線上已是這一版
        run: |
          want="${{ github.sha }}"
          got="?"
          for i in $(seq 1 20); do
            got=$(curl -fsSL "$SITE/build.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha)}catch{console.log("?")}})' || echo "?")
            if [ "$got" = "$want" ]; then echo "✓ 線上 build.json 已是 $want"; break; fi
            echo "  第 $i 次：線上 $got，等 $want"; sleep 30
          done
          [ "$got" = "$want" ] || { echo "::error::部署完成但 10 分鐘內線上仍不是 $want"; exit 1; }
          curl -fsSL "$SITE/data/_meta.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{JSON.parse(s);console.log("✓ data/_meta.json 是有效的 JSON")})'

  # 任何一步失敗都開 issue（同一件事只開一個，之後改成留言）——網站停在舊版而沒人注意，是改用 Actions 部署最大的風險
  report:
    needs: [build, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: 開 issue
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="網站部署失敗（網站可能還停在上一版）：$url"
          n=$(gh issue list --repo "$REPO" --label pages-deploy-bot --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh label create pages-deploy-bot --repo "$REPO" --color B60205 --description "網站部署（GitHub Actions）" --force
            gh issue create --repo "$REPO" --label pages-deploy-bot --title "網站部署失敗" --body "$body"
          fi
