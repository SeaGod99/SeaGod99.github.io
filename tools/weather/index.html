<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天氣預報 — 水神的工具箱</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/tool-header.css">
<link rel="stylesheet" href="../../assets/css/et-bar.css">
<style>
  /* 本頁專屬強調色（天氣藍）。色票／版面 token 見 assets/css/tokens.css。
     亮色值原本放在 theme.css 的 :root[data-theme="light"]，但那是全域選擇器，
     會把其他 13 頁的識別色一起壓成這個藍——所以收回本頁自己宣告。
     本頁 <style> 排在 theme.css 之後，同特定度後載入者勝。 */
  :root {
    --accent:    #4a90d9;
    --accent-dim: rgba(74,144,217,0.15);
  }
  :root[data-theme="light"] {
    /* 4.66:1 是「藍字 vs 純白底」，但本頁的 active 頁籤／目前時段卡是
       「藍字疊在 --accent-dim 藍色淡底」，合成後只剩 3.85。加深＋淡底降 alpha。 */
    --accent:    #2a5f96;
    --accent-dim: rgba(47,111,176,0.10);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-base); color: var(--text); font-family: var(--font-sans); min-height: 100vh; font-size: 18px; }

  /* Header */

  .main { max-width: var(--w-wide); margin: 0 auto; padding: 28px 28px; }

  /* ET 時鐘列見 assets/css/et-bar.css（三頁共用元件） */

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; gap: 0; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 26px; color: var(--text-dim); font-size: 17px; cursor: pointer; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Zone selector */
  .zone-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .grp-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); padding: 7px 18px; font-size: 15px; cursor: pointer; transition: all .15s; }
  .grp-btn:hover { border-color: var(--gold); color: var(--gold); }
  .grp-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 16px; font-size: 16px; cursor: pointer; outline: none; min-width: 240px; }
  select:focus { border-color: var(--gold); }

  /* Section title */
  .sec-title { font-size: 16px; color: var(--gold); font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Forecast grid
     minmax(0,1fr) 而非 1fr：`1fr` 的軌道下限是內容的 min-content，
     「ET 00:00 ⟵ 現在」這行縮不到 108px 以下，於是 375px 手機上
     三欄算成 108×3＋24 gap＝348 > 可用的 319，整頁橫向溢出 15px。
     （同一個坑 common.css 的 .col-grid 已經踩過一次） */
  .forecast-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 32px; }
  .fc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
  .fc-card.now { border-color: var(--accent); background: var(--accent-dim); }
  .fc-time { font-size: 15px; color: var(--text-dim); margin-bottom: 7px; font-variant-numeric: tabular-nums; }
  .fc-card.now .fc-time { color: var(--accent); }
  .fc-weather { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .fc-icon { font-size: 26px; }
  .fc-rt { font-size: 14px; color: var(--text-dim); margin-top: 6px; }

  /* Search panel */
  .search-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .chip { background: var(--bg-hover); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 6px 14px; font-size: 15px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px; color: var(--text); }
  .chip:hover { border-color: var(--gold); color: var(--gold); }
  .chip.on { background: rgba(200,169,110,.2); border-color: var(--gold); color: var(--gold); }
  .results { display: flex; flex-direction: column; gap: 6px; }
  .result-row { background: var(--bg-hover); border-radius: 6px; padding: 11px 18px; display: flex; gap: 18px; align-items: center; font-size: 16px; }
  .r-idx { color: var(--text-dim); min-width: 26px; }
  .r-et { font-weight: 600; color: var(--gold); min-width: 100px; font-variant-numeric: tabular-nums; }
  .r-rt { color: var(--text-dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-dim); font-size: 15px; padding: 8px 0; }
  /* 選中的天氣 → 釣魚紀錄的「天氣」篩選。一行可能好幾個，用真實 padding 撐命中區 */
  .fish-links { font-size: 14px; color: var(--text-dim); margin-top: 10px; line-height: 1.8; }
  .fish-links a { display: inline-block; padding: 3px 0; color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold-dim); }
  .fish-links a:hover { color: var(--gold-light); }

  /* 我的天氣目標。色票一律取自 tokens.css，這裡不開 :root（§3.6） */
  .watch-panel { background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; }
  .wp-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .wp-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .wp-hint { font-size: 13px; color: var(--text-dim); }
  .wp-alarm { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wp-alarm .chip { padding: 4px 11px; font-size: 13px; }
  .wp-alarm select { padding: 4px 8px; font-size: 13px; }
  .chip.active { background: rgba(200,169,110,.2); border-color: var(--gold); color: var(--gold); }
  .w-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .w-row:first-child { border-top: none; }
  .w-zone { color: var(--text); font-weight: 600; }
  .w-what { color: var(--gold); }
  .w-next { color: var(--text-dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .w-next.soon { color: var(--green); font-weight: 600; }
  /* 移除鈕：孤立的小圖示鈕，用真實 min-height 撐到 44（不用 ::after 擴張層，會蓋到上下列） */
  .w-del { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim);
           font: inherit; font-size: 13px; padding: 4px 10px; min-height: var(--tap-min); cursor: pointer; }
  .w-del:hover { border-color: var(--red); color: var(--red); }

  /* Multi-zone */
  .mz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .mz-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 17px 19px; }
  .mz-name { font-size: 15px; color: var(--text-dim); font-weight: 600; margin-bottom: 12px; letter-spacing: .03em; }
  .mz-row { display: flex; gap: 8px; }
  .mz-cell { flex: 1; text-align: center; background: var(--bg-hover); border-radius: 6px; padding: 10px 5px; }
  .mz-cell.now { background: var(--accent-dim); }
  .mz-icon { font-size: 22px; display: block; }
  .mz-wname { font-size: 13px; color: var(--text-dim); margin-top: 4px; line-height: 1.3; }
  .mz-when { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* Chain search */
  .chain-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 24px; }
  .chain-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .chain-arrow { color: var(--text-dim); font-size: 24px; }
  .chain-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; }

  /* ── 手機（2026-08-03 補）──────────────────────────────────────
     本頁原本一條 @media 都沒有：28px 的左右留白、三欄預報卡、
     min-width:240px 的下拉在 375px 上全部擠在一起。 */
  @media (max-width: 600px) {
    .main { padding: 20px 14px 40px; }
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab { padding: 12px 16px; font-size: 16px; white-space: nowrap; }
    .forecast-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .fc-card { padding: 12px 14px; }
    .fc-weather { font-size: 19px; }
    .fc-icon { font-size: 22px; }
    select { min-width: 0; width: 100%; }
    .search-panel, .chain-panel { padding: 16px 14px; }
    .result-row { gap: 10px 14px; padding: 10px 14px; font-size: 15px; flex-wrap: wrap; }
    .r-et { min-width: 0; }
  }

  /* 觸控裝置：本頁的頁籤／地區鈕／天氣籌碼原本只有 35–39px 高 */
  @media (pointer: coarse) {
    .tab, .grp-btn, .chip, select { min-height: var(--tap-min); }
    .grp-btn, .chip { display: inline-flex; align-items: center; }
  }
</style>
  <!-- 鬧鐘引擎（classic script，掛 window.ETAlarm）。下面的 type="module" 是延後執行的，順序天然成立。 -->
  <script src="../../assets/js/et-alarm.js"></script>
  <script src="../../assets/js/theme.js"></script>
</head>
<body>

<div class="tool-header">
  <h1 class="tool-title">⛅ 艾歐澤亞天氣預報</h1>
  <p class="tool-subtitle">即時天氣、多地圖概覽、目標天氣搜尋與天氣鏈搜尋</p>
  <div class="header-divider"></div>
</div>

<main class="main">

  <!-- ET 時鐘列（共用元件 assets/js/et-bar.js） -->
  <div id="etBar"></div>

  <!-- 我的天氣目標：跨分頁的清單，沒有訂閱時整塊不顯示（不要留一塊空框佔位） -->
  <div class="watch-panel" id="watch-panel" style="display:none">
    <div class="wp-head">
      <span class="wp-title">🔔 我的天氣目標</span>
      <span class="wp-hint" id="watch-count"></span>
      <span class="wp-alarm">
        <span class="chip" id="alarmToggle" title="目標天氣出現前提醒">🔔 出現提醒</span>
        <select id="alarmLead" title="提前多久提醒（現實時間）">
          <option value="0">出現時提醒</option>
          <option value="60">提前 1 分鐘</option>
          <option value="180">提前 3 分鐘</option>
          <option value="300">提前 5 分鐘</option>
          <option value="600">提前 10 分鐘</option>
        </select>
        <span class="chip" id="alarmSound" title="提醒音效">🔊 音效</span>
        <button class="chip" id="alarmTest" title="試聽提醒效果">試響</button>
      </span>
    </div>
    <div class="wp-hint" id="alarmHint" style="display:none"></div>
    <div id="watch-list"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('single')">單地圖預報</button>
    <button class="tab" onclick="switchTab('multi')">多地圖概覽</button>
    <button class="tab" onclick="switchTab('chain')">天氣鏈搜尋</button>
  </div>

  <!-- Tab: Single -->
  <div class="tab-content active" id="tab-single">
    <div class="zone-controls">
      <button class="grp-btn active" id="grp-lanoscea" onclick="setGroup('lanoscea')">拉諾西亞</button>
      <button class="grp-btn" id="grp-thanalan"  onclick="setGroup('thanalan')">薩納蘭</button>
      <button class="grp-btn" id="grp-shroud"    onclick="setGroup('shroud')">黑衣森林</button>
      <button class="grp-btn" id="grp-hw"        onclick="setGroup('hw')">3.0 蒼天</button>
      <button class="grp-btn" id="grp-sb"        onclick="setGroup('sb')">4.0 紅蓮</button>
      <button class="grp-btn" id="grp-shb"       onclick="setGroup('shb')">5.0 暗影</button>
      <button class="grp-btn" id="grp-ew"        onclick="setGroup('ew')">6.0 曉月</button>
      <button class="grp-btn" id="grp-dt"        onclick="setGroup('dt')">7.0 金曦</button>
      <button class="grp-btn" id="grp-eureka"    onclick="setGroup('eureka')">優雷卡 ⚠️</button>
      <select id="zone-sel" onchange="onZoneChange()"></select>
    </div>
    <div id="unverified-notice" style="display:none;background:rgba(248,190,0,0.12);border:1px solid rgba(248,190,0,0.4);border-radius:7px;padding:9px 14px;font-size:13px;color:#f8be00;margin-bottom:14px;">
      ⚠️ 優雷卡天氣表為社群推測值（maps.json 無官方資料），可能不完全準確。如發現錯誤歡迎回報。
    </div>
    <div class="sec-title">未來 24 個天氣時段</div>
    <div class="forecast-grid" id="forecast-grid"></div>
    <div class="search-panel">
      <div class="sec-title" style="margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span>🔍 目標天氣搜尋</span>
        <button class="chip" id="watch-add" style="display:none" title="加進「我的天氣目標」，可開啟出現提醒">⭐ 加入提醒</button>
      </div>
      <div class="chips" id="weather-chips"></div>
      <div class="results" id="search-results"><div class="empty">點選上方天氣標籤以搜尋下次出現時間</div></div>
      <div class="fish-links" id="fish-links"></div>
    </div>
  </div>

  <!-- Tab: Multi -->
  <div class="tab-content" id="tab-multi">
    <div class="zone-controls" style="margin-bottom:16px;">
      <button class="grp-btn active" id="mgrp-lanoscea" onclick="setMGroup('lanoscea')">拉諾西亞</button>
      <button class="grp-btn" id="mgrp-thanalan"  onclick="setMGroup('thanalan')">薩納蘭</button>
      <button class="grp-btn" id="mgrp-shroud"    onclick="setMGroup('shroud')">黑衣森林</button>
      <button class="grp-btn" id="mgrp-hw"        onclick="setMGroup('hw')">3.0 蒼天</button>
      <button class="grp-btn" id="mgrp-sb"        onclick="setMGroup('sb')">4.0 紅蓮</button>
      <button class="grp-btn" id="mgrp-shb"       onclick="setMGroup('shb')">5.0 暗影</button>
      <button class="grp-btn" id="mgrp-ew"        onclick="setMGroup('ew')">6.0 曉月</button>
      <button class="grp-btn" id="mgrp-dt"        onclick="setMGroup('dt')">7.0 金曦</button>
      <button class="grp-btn" id="mgrp-eureka"    onclick="setMGroup('eureka')">優雷卡 ⚠️</button>
    </div>
    <div class="mz-grid" id="mz-grid"></div>
  </div>

  <!-- Tab: Chain -->
  <div class="tab-content" id="tab-chain">
    <div class="chain-panel">
      <div class="sec-title" style="margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span>⛓ 天氣鏈搜尋</span>
        <button class="chip" id="chain-watch-add" style="display:none" title="加進「我的天氣目標」，可開啟出現提醒">⭐ 加入提醒</button>
      </div>
      <div class="chain-desc">搜尋「前一天氣 → 目標天氣」連續出現的時間點，適合釣魚王、農場活動。</div>
      <div class="chain-row">
        <span style="font-size:13px;color:var(--text-dim);">地圖：</span>
        <select id="chain-zone" onchange="onChainZoneChange()"></select>
        <span style="font-size:13px;color:var(--text-dim);">前天氣：</span>
        <select id="chain-prev" onchange="renderChain()"></select>
        <span class="chain-arrow">→</span>
        <span style="font-size:13px;color:var(--text-dim);">目標：</span>
        <select id="chain-next" onchange="renderChain()"></select>
      </div>
      <div class="results" id="chain-results"><div class="empty">請選擇天氣組合</div></div>
    </div>
  </div>

</main>

// ============================================================
// State
// ============================================================
let curGroup = 'lanoscea';
let curZone  = 11;
let selWeathers = new Set();
let curMGroup = 'lanoscea';

/* ⚠ **模組一載入就先把原始 query 抓下來**（§3.17）。init 裡的 setGroup('lanoscea')
   會呼叫 syncURL()，那一行當場把網址改寫成 ?zone=11——晚一步讀 location.search
   的人永遠只看得到被洗過的值。2026-09-25 這裡踩過一次：?zone=141 完全沒有作用，
   而畫面正常、主控台乾淨，看起來就像是連結本身壞了。 */
const INITIAL_QUERY = location.search;

// ============================================================
// Single zone tab
// ============================================================
function populateZoneSel(selId, groupKey) {
  const sel = document.getElementById(selId);
  sel.innerHTML = '';
  for (const z of GROUPS[groupKey].zones) {
    const o = document.createElement('option');
    o.value = z.mapId; o.textContent = z.name;
    sel.appendChild(o);
  }
}

function setGroup(g) {
  curGroup = g;
  Object.keys(GROUPS).forEach(k => document.getElementById('grp-'+k)?.classList.toggle('active', k===g));
  populateZoneSel('zone-sel', g);
  curZone = Number(document.getElementById('zone-sel').value);
  selWeathers.clear();
  // 顯示/隱藏未驗證警告
  const notice = document.getElementById('unverified-notice');
  if (notice) notice.style.display = GROUPS[g]?.unverified ? 'block' : 'none';
  renderForecast(); renderChips(); renderSearch();
  // applyURL 會先呼叫 setGroup 再設 zone／w，這時不能寫網址——會把還沒套上的 w 洗掉
  if (!applyingURL) syncURL();
}
let applyingURL = false;
// 網址帶進來的天氣鍵要驗過才用——wi() 查不到會回一個 fallback，
// 直接塞進 selWeathers 的話使用者亂打也會「成功」選到一個不存在的天氣。
const WEATHER_KEYS = new Set(Object.keys(WEATHER_INFO));

function onZoneChange() {
  curZone = Number(document.getElementById('zone-sel').value);
  selWeathers.clear();
  renderForecast(); renderChips(); renderSearch(); syncURL();
}

/* 網址狀態：?zone=<mapId>&w=<天氣鍵,…>（規約見 docs/deep-links.md）。
   「這張圖什麼時候下雨」本來就是會想丟給別人的東西，而釣魚頁的天氣籌碼
   （以及之後的優雷卡 NM、海釣班表）都要能連進來指定圖與天氣。
   **只寫兩件事**：看哪張圖、找哪些天氣。分頁與捲動位置不寫——那是瀏覽狀態不是意圖。 */
function syncURL() {
  try {
    const p = new URLSearchParams();
    if (curZone) p.set('zone', String(curZone));
    if (selWeathers.size) p.set('w', [...selWeathers].join(','));
    /* `prev` 只在天氣鏈那一邊有意義，而它有自己的地圖選單。
       **只有在兩邊的地圖相同時才寫進網址**——不然收到連結的人會拿 zone 去查
       另一張圖的鏈，而畫面上看不出來哪裡錯了。 */
    const chainPrev = document.getElementById('chain-prev');
    if (chainPrev && chainPrev.value && chainZone === curZone) p.set('prev', chainPrev.value);
    const q = p.toString();
    history.replaceState(null, '', q ? '?' + q : location.pathname);
  } catch (e) { /* 無痕視窗等寫不了網址：不影響查詢本身 */ }
}

/* 開頁時把網址帶的狀態套上去。zone 要先找出它屬於哪一組再切過去，
   否則 setGroup 會把 zone-sel 整個重建、剛設好的值當場被蓋掉。 */
function applyURL() {
  const p = new URLSearchParams(INITIAL_QUERY);
  const zone = Number(p.get('zone'));
  if (zone) {
    const grp = Object.keys(GROUPS).find(k => GROUPS[k].zones.some(z => z.mapId === zone));
    if (grp) {
      if (grp !== curGroup) setGroup(grp);
      const sel = document.getElementById('zone-sel');
      if ([...sel.options].some(o => Number(o.value) === zone)) {
        sel.value = String(zone);
        curZone = zone;
      }
    }
  }
  // 只收認得的天氣鍵——網址是使用者可以亂改的，塞進 selWeathers 之前要驗過
  const w = (p.get('w') || '').split(',').map(x => x.trim()).filter(Boolean);
  for (const k of w) if (WEATHER_KEYS.has(k)) selWeathers.add(k);
  renderForecast(); renderChips(); renderSearch();
  /* `?prev=` ——帶著前天氣進來就是要看天氣鏈，所以直接切到那個分頁。
     必須在 initChain() 之後才有選單可填，所以真正套用放在 applyChainURL()。 */
  pendingPrev = WEATHER_KEYS.has(p.get('prev') || '') ? p.get('prev') : null;
}

let pendingPrev = null;

/* initChain() 建好選單之後才呼叫。`w` 的第一個天氣當成鏈的目標天氣——
   單地圖那邊可以多選，鏈只吃一個，取第一個並在畫面上如實反映（選單看得到）。 */
function applyChainURL() {
  if (!pendingPrev) return;
  const sel = document.getElementById('chain-zone');
  if (curZone && [...sel.options].some(o => Number(o.value) === curZone)) {
    sel.value = String(curZone);
    onChainZoneChange();                     // 會重建 prev／next 選單
  }
  document.getElementById('chain-prev').value = pendingPrev;
  const first = [...selWeathers][0];
  if (first) document.getElementById('chain-next').value = first;
  renderChain();
  switchTab('chain');
}

function renderForecast() {
  const now = Date.now();
  const cur = periodStart(now);
  const grid = document.getElementById('forecast-grid');
  grid.innerHTML = Array.from({length:12}, (_,i) => {
    const t = cur + i * WEATHER_PERIOD;
    const w = getWeatherAt(curZone, t);
    const info = wi(w);
    const isNow = i === 0;
    const diff = t - now;
    return `<div class="fc-card${isNow?' now':''}">
      <div class="fc-time">${fmtET(t)}${isNow?' ⟵ 現在':''}</div>
      <div class="fc-weather"><span class="fc-icon">${info.icon}</span>${info.name}</div>
      <div class="fc-rt">${fmtRT(t)} ${isNow?'':`（${fmtCountdown(diff)}）`}</div>
    </div>`;
  }).join('');
}

function renderChips() {
  const weathers = [...new Set(getWeatherTable(curZone)?.map(([,k])=>k) || [])];
  document.getElementById('weather-chips').innerHTML = weathers.map(w => {
    const info = wi(w);
    return `<button class="chip${selWeathers.has(w)?' on':''}" onclick="toggleW('${w}')">${info.icon} ${info.name}</button>`;
  }).join('');
}

function toggleW(w) {
  selWeathers.has(w) ? selWeathers.delete(w) : selWeathers.add(w);
  renderChips(); renderSearch(); syncURL();
}

/* 掃描「下次符合條件的天氣時段」——目標搜尋、天氣鏈、我的天氣目標三處共用。
   `keys` 空＝任意天氣；`prev` 有值時要求**前一個時段**是它（天氣鏈就是這個意思）。
   回傳每一筆的 `{ t, w, wPrev }`，t 是該時段的開始時刻。
   ⚠ 天氣的視窗機制與釣魚／採集不同（8 ET 小時一段、由雜湊決定），
   **不要拿 window-calc 來算**——那支算的是「每天第幾小時到第幾小時」。
   這裡的權威是 eorzea-weather.js 的 getWeatherAt()。 */
function scanWeather(zone, keys, prev, now, limit) {
  const cur = periodStart(now);
  const out = [];
  // prev 有值時從 i=1 起跳（i=0 沒有前一段可比）
  for (let i = prev ? 1 : 0; i < 480 && out.length < limit; i++) {
    const t = cur + i * WEATHER_PERIOD;
    const w = getWeatherAt(zone, t);
    if (keys && keys.length && keys.indexOf(w) < 0) continue;
    const wPrev = prev ? getWeatherAt(zone, t - WEATHER_PERIOD) : null;
    if (prev && wPrev !== prev) continue;
    out.push({ t, w, wPrev });
  }
  return out;
}

/* 天氣 → 釣魚紀錄（2026-10-03）。釣魚頁的「天氣」篩選只列**真的有魚**的天氣（選項由資料長出），
   所以這裡也只對有魚的天氣給連結——否則連過去是一個不存在的選項、等於沒篩。
   fishes.json 約 700KB，**選了天氣才載**，一個分頁只載一次。名稱規則與釣魚頁的版本閘門相同
   （有台服名且不等於英文名；那頁註明這條與 patch 閘門擋掉的是同一批）。 */
let FISH_WX = null;
function loadFishWx() {
  if (!FISH_WX) {
    FISH_WX = fetch('../../data/fishes.json').then(r => (r.ok ? r.json() : null)).then(j => {
      const has = new Set();
      for (const f of (j && j.data) || []) {
        if (!f.name || f.name === f.nameEn) continue;
        weatherKeys(f.weatherSet).concat(weatherKeys(f.previousWeatherSet)).forEach(k => has.add(k));
      }
      return has;
    }).catch(() => new Set());
  }
  return FISH_WX;
}
function renderFishLinks(keys) {
  const box = document.getElementById('fish-links');
  if (!box) return;
  if (!keys.length) { box.innerHTML = ''; return; }
  loadFishWx().then(has => {
    const ok = keys.filter(k => has.has(k));
    box.innerHTML = ok.length
      ? '🎣 釣魚紀錄：' + ok.map(k => `<a href="../fishing/?f_weather=${encodeURIComponent(k)}">天氣條件含「${wi(k).name}」的魚</a>`).join('、')
      : '';
  });
}

function renderSearch() {
  const el = document.getElementById('search-results');
  renderFishLinks([...selWeathers]);
  const addBtn = document.getElementById('watch-add');
  if (!selWeathers.size) {
    el.innerHTML = '<div class="empty">點選上方天氣標籤以搜尋下次出現時間</div>';
    addBtn.style.display = 'none';
    return;
  }
  const now = Date.now();
  const hits = scanWeather(curZone, [...selWeathers], null, now, 12);
  el.innerHTML = hits.length
    ? hits.map(({ t, w }, i) => {
        const info = wi(w), diff = t - now;
        return `<div class="result-row">
        <span class="r-idx">#${i+1}</span>
        <span class="r-et">${fmtET(t)}</span>
        <span>${info.icon} ${info.name}</span>
        <span class="r-rt">${fmtRT(t)} ${diff>0?`（${fmtCountdown(diff)}）`:'（現在）'}</span>
      </div>`;
      }).join('')
    : '<div class="empty">未來 480 個時段內未找到。</div>';
  // 已經訂閱過同一組就不再提供加入（避免一模一樣的兩列）
  addBtn.style.display = hasWatch(curZone, [...selWeathers], null) ? 'none' : '';
}

// ============================================================
// Multi zone tab
// ============================================================
function setMGroup(g) {
  curMGroup = g;
  Object.keys(GROUPS).forEach(k => document.getElementById('mgrp-'+k)?.classList.toggle('active', k===g));
  // 顯示/隱藏未驗證警告（多地圖概覽用同一個 notice 元素）
  const notice = document.getElementById('unverified-notice');
  if (notice) notice.style.display = GROUPS[g]?.unverified ? 'block' : 'none';
  renderMulti();
}

function renderMulti() {
  const now = Date.now();
  const cur = periodStart(now);
  const zones = GROUPS[curMGroup]?.zones || [];
  document.getElementById('mz-grid').innerHTML = zones.map(z => {
    const cells = [0,1,2].map(i => {
      const t = cur + i * WEATHER_PERIOD;
      const w = getWeatherAt(z.mapId, t);
      const info = wi(w);
      const diff = t - now;
      const when = i===0 ? '現在' : '+'+Math.round(diff/60000)+'分';
      return `<div class="mz-cell${i===0?' now':''}">
        <span class="mz-icon">${info.icon}</span>
        <div class="mz-wname">${info.name}</div>
        <div class="mz-when">${when}</div>
      </div>`;
    }).join('');
    return `<div class="mz-card"><div class="mz-name">${z.name}</div><div class="mz-row">${cells}</div></div>`;
  }).join('');
}

// ============================================================
// Chain search tab
// ============================================================
let chainZone = 17; // 東拉諾西亞

function initChain() {
  // 用所有地圖做 chain zone select
  const allZones = Object.values(GROUPS).flatMap(g => g.zones);
  const sel = document.getElementById('chain-zone');
  const seen = new Set();
  allZones.forEach(z => {
    if (!seen.has(z.mapId)) { seen.add(z.mapId); const o=document.createElement('option'); o.value=z.mapId; o.textContent=z.name; sel.appendChild(o); }
  });
  sel.value = chainZone;
  onChainZoneChange();
}

function onChainZoneChange() {
  chainZone = Number(document.getElementById('chain-zone').value);
  const weathers = [...new Set(getWeatherTable(chainZone)?.map(([,k])=>k) || [])];
  const mkOpts = () => '<option value="">（任意）</option>' +
    weathers.map(w => { const i=wi(w); return `<option value="${w}">${i.icon} ${i.name}</option>`; }).join('');
  document.getElementById('chain-prev').innerHTML = mkOpts();
  document.getElementById('chain-next').innerHTML = mkOpts();
  renderChain();
}

function renderChain() {
  const prev = document.getElementById('chain-prev').value;
  const next = document.getElementById('chain-next').value;
  const el   = document.getElementById('chain-results');
  const addBtn = document.getElementById('chain-watch-add');
  if (!prev && !next) {
    el.innerHTML = '<div class="empty">請選擇前天氣或目標天氣</div>';
    addBtn.style.display = 'none';
    return;
  }
  const now = Date.now();
  const hits = scanWeather(chainZone, next ? [next] : null, prev || null, now, 12);
  el.innerHTML = hits.length
    ? hits.map(({ t, w, wPrev }, i) => {
        const iN = wi(w), diff = t - now;
        const iP = wPrev ? wi(wPrev) : wi(getWeatherAt(chainZone, t - WEATHER_PERIOD));
        return `<div class="result-row">
        <span class="r-idx">#${i+1}</span>
        <span class="r-et">${fmtET(t)}</span>
        <span>${iP.icon}${iP.name} → ${iN.icon}${iN.name}</span>
        <span class="r-rt">${fmtRT(t)} ${diff>0?`（${fmtCountdown(diff)}）`:'（現在）'}</span>
      </div>`;
      }).join('')
    : '<div class="empty">未來 480 個時段內未找到。</div>';
  /* 「任意 → 任意」訂閱不起來（每一段都符合），所以目標天氣是必填才給訂閱。
     只選了前天氣的話這頁仍然查得到，只是不讓你訂閱一個永遠在響的東西。 */
  addBtn.style.display = next && !hasWatch(chainZone, [next], prev || null) ? '' : 'none';
}

/* ============================================================
   我的天氣目標（⭐ 訂閱）＋出現提醒
   存 `ffxiv_weather_watch`（key 一律 ffxiv_ 前綴，首頁全站備份才掃得到，§2.3）。
   **存天氣鍵不存顯示字串**——譯名表改過的話存字串會變成查不到的死資料。
   ============================================================ */
const WATCH_KEY = 'ffxiv_weather_watch';
let watches = [];
try {
  const raw = JSON.parse(localStorage.getItem(WATCH_KEY) || '[]');
  if (Array.isArray(raw)) {
    watches = raw.filter(x => x && Number(x.zone) && Array.isArray(x.w) && x.w.length)
      .map(x => ({
        zone: Number(x.zone),
        // 只收認得的天氣鍵：localStorage 是使用者可以亂改的
        w: x.w.filter(k => WEATHER_KEYS.has(k)),
        prev: x.prev && WEATHER_KEYS.has(x.prev) ? x.prev : null,
      }))
      .filter(x => x.w.length);
  }
} catch (e) { /* 壞掉的資料就當沒有，不要讓整頁掛掉 */ }

function saveWatches() {
  try { localStorage.setItem(WATCH_KEY, JSON.stringify(watches)); } catch (e) {}
}
function watchKey(w) { return w.zone + '|' + [...w.w].sort().join(',') + '|' + (w.prev || ''); }
function hasWatch(zone, keys, prev) {
  const k = watchKey({ zone, w: keys, prev });
  return watches.some(x => watchKey(x) === k);
}
function zoneName(mapId) {
  for (const g of Object.values(GROUPS)) {
    const z = g.zones.find(x => x.mapId === mapId);
    if (z) return z.name;
  }
  return '地圖 ' + mapId;           // 訂閱過後才被拿掉的圖：顯示 id 也比整列消失好
}

const alarm = window.ETAlarm.create({
  scope: 'weather',
  baseTitle: document.title,
  onFire: (w, secs) => ({
    title: `${wi(w.w[0]).icon} ${zoneName(w.zone)}：${w.w.map(k => wi(k).name).join('／')} ` +
      (secs <= 5 ? '出現了！' : `約 ${Math.ceil(secs / 60)} 分鐘後出現`),
    body: w.prev ? `前一段天氣：${wi(w.prev).name}` : '',
    tag: 'weather-' + watchKey(w),
  }),
});

function renderWatches() {
  const panel = document.getElementById('watch-panel');
  if (!watches.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  const now = Date.now();
  document.getElementById('watch-count').textContent = watches.length + ' 個目標';
  document.getElementById('watch-list').innerHTML = watches.map((w, i) => {
    const hit = scanWeather(w.zone, w.w, w.prev, now, 1)[0];
    const diff = hit ? hit.t - now : null;
    const what = (w.prev ? wi(w.prev).icon + wi(w.prev).name + ' → ' : '') +
      w.w.map(k => wi(k).icon + wi(k).name).join('／');
    const next = !hit ? '未來 480 段內沒有'
      : diff <= 0 ? '現在就是'
      : `${fmtET(hit.t)}（${fmtCountdown(diff)}）`;
    return `<div class="w-row">
      <span class="w-zone">${zoneName(w.zone)}</span>
      <span class="w-what">${what}</span>
      <span class="w-next${diff != null && diff <= 0 ? ' soon' : ''}">${next}</span>
      <button class="w-del" data-i="${i}" aria-label="移除這個天氣目標">✕ 移除</button>
    </div>`;
  }).join('');
  checkAlarms(now);
}

/* primeOnly=true：只登記目前已在門檻內的窗（不響），
   用於剛開啟提醒／剛加目標／改提前量時，避免對眼前已看得到的狀態突然響鈴 */
function checkAlarms(now, primeOnly) {
  if (!watches.length) return;
  const list = watches.map(w => {
    const hit = scanWeather(w.zone, w.w, w.prev, now, 1)[0];
    if (!hit) return null;
    // openTs＝那一段天氣的起點（已開時是過去的時刻，固定不漂）；只給 secsUntilOpen 的話已開的段每 2 分鐘重響（10-03 修）
    return { key: watchKey(w), item: w, openTs: hit.t, secsUntilOpen: Math.max(0, Math.round((hit.t - now) / 1000)) };
  }).filter(Boolean);
  alarm.check(now, list, primeOnly);
}

function addWatch(zone, keys, prev) {
  if (hasWatch(zone, keys, prev)) return;
  watches.push({ zone, w: [...keys], prev: prev || null });
  saveWatches();
  checkAlarms(Date.now(), true);    // 新目標先登記當前窗，不立即響鈴
  renderWatches(); renderSearch(); renderChain();
}
function removeWatch(i) {
  const w = watches[i];
  if (!w) return;
  alarm.forget(watchKey(w));        // 不清掉去重表的話，再加回來會被當成同一窗而不響
  watches.splice(i, 1);
  saveWatches();
  renderWatches(); renderSearch(); renderChain();
}

function syncAlarmUI() {
  document.getElementById('alarmToggle').classList.toggle('active', alarm.cfg.on);
  document.getElementById('alarmSound').classList.toggle('active', alarm.cfg.sound);
  document.getElementById('alarmLead').value = String(alarm.cfg.lead);
  const hint = document.getElementById('alarmHint');
  if (!alarm.cfg.on) { hint.style.display = 'none'; return; }
  const noNotif = !('Notification' in window) || Notification.permission !== 'granted';
  hint.style.display = '';
  hint.textContent = '🔔 提醒運作中——需保持此分頁開啟' +
    (noNotif ? '；瀏覽器通知未允許，僅以音效與分頁標題提醒' : '，將以系統通知＋音效提醒');
}

function wireWatchUI() {
  document.getElementById('watch-add').addEventListener('click', () => {
    addWatch(curZone, [...selWeathers], null);
  });
  document.getElementById('chain-watch-add').addEventListener('click', () => {
    const prev = document.getElementById('chain-prev').value;
    const next = document.getElementById('chain-next').value;
    if (next) addWatch(chainZone, [next], prev || null);
  });
  document.getElementById('watch-list').addEventListener('click', e => {
    const b = e.target.closest('.w-del');
    if (b) removeWatch(Number(b.dataset.i));
  });
  document.getElementById('alarmToggle').addEventListener('click', () => {
    alarm.cfg.on = !alarm.cfg.on; alarm.save();
    if (alarm.cfg.on) {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().finally(syncAlarmUI);
      }
      checkAlarms(Date.now(), true);
    }
    syncAlarmUI();
  });
  document.getElementById('alarmSound').addEventListener('click', () => {
    alarm.cfg.sound = !alarm.cfg.sound; alarm.save(); syncAlarmUI();
  });
  document.getElementById('alarmLead').addEventListener('change', e => {
    alarm.cfg.lead = Number(e.target.value) || 0; alarm.save();
    checkAlarms(Date.now(), true);
  });
  document.getElementById('alarmTest').addEventListener('click', () => {
    alarm.chime();                  // 引擎的 chime() 不看 sound 設定，試響一定出聲
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('🔔 測試提醒', { body: '提醒功能運作正常。', tag: 'weather-test' }); } catch (e) {}
    }
  });
  syncAlarmUI();
  renderWatches();
}

// ============================================================
// Tab switch
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['single','multi','chain'][i]===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active', c.id==='tab-'+name));
  if (name==='multi') renderMulti();
}

// ============================================================
// Expose handlers used by inline onclick="" (module scope is not global)
// ============================================================
window.switchTab = switchTab;
window.setGroup = setGroup;
window.setMGroup = setMGroup;
window.onZoneChange = onZoneChange;
window.onChainZoneChange = onChainZoneChange;
window.renderChain = renderChain;
window.toggleW = toggleW;

// ============================================================
// Init
// ============================================================
(async function init() {
  // 載入失敗要講出來——原本沒有保護，天氣表抓不到時整頁停住、沒有任何提示（2026-10-03 補）
  try { await initWeatherTables('../../data/maps.json'); }
  catch (e) {
    const box = document.querySelector('.container') || document.body;
    box.insertAdjacentHTML('afterbegin', '<div class="empty-state" role="alert">資料載入失敗（網路中斷，或網站正在更新資料），請重新整理頁面。</div>');
    throw e;
  }
  // 初始化分組按鈕（只顯示對應到 GROUPS 的按鈕）
  Object.keys(GROUPS).forEach(k => {
    const btn = document.getElementById('grp-'+k);
    if (!btn) return;
    btn.textContent = GROUPS[k].label || k;
  });
  setGroup('lanoscea');
  // 先讀網址再套用（§3.17：順序顛倒的話 setGroup 裡的 syncURL 會把 query 當場洗掉）
  applyingURL = true;
  try { applyURL(); } finally { applyingURL = false; }
  syncURL();                       // 套用期間 setGroup 不寫網址，這裡補寫一次正確的
  initChain();
  applyChainURL();                 // ?prev= 要等選單建好才套得上
  wireWatchUI();
  mountEtBar('#etBar', { metric: 'weather' });
  setInterval(() => {
    renderForecast(); renderSearch(); renderChain();
    renderWatches();               // 倒數要跟著走
    if (document.getElementById('tab-multi').classList.contains('active')) renderMulti();
  }, 20000);
  /* 鬧鐘另開一個更密的 timer。畫面每 20 秒重畫就夠了（天氣一段 23 分鐘），
     但提前量選「出現時提醒」的人會晚最多 20 秒才收到通知——
     **鬧鐘的錯誤是該響沒響／響太晚，畫面上看不出來**，所以不跟著畫面的節奏走。 */
  setInterval(() => checkAlarms(Date.now()), 5000);
})();
</script>
