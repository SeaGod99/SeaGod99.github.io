      : e.imgFrom === "ge"
        ? `📖 ${lang === "en" ? "body piece model (gamerescape)" : "上身單件模型圖（gamerescape）"}`
        : `📖 ${lang === "en" ? "official look (consolegameswiki)" : "官方外觀圖（consolegameswiki）"}`;
    imgCol.innerHTML = `<div style="width:100%">` + modalImg(e.img, setDisplayName(e)) +
      `<div class="text-secondary small text-center mt-1 mb-2">${capHtml}</div>` +
      iconRow + `</div>`;
  } else {
    imgCol.innerHTML = iconRow;
  }

  // 右欄：逐件表
  const hSlot = lang === "en" ? "Slot" : "部位";
  const hItem = lang === "en" ? "Item" : "裝備";
  const hInfo = lang === "en" ? "Dye / Trade" : "染色／交易";
  const hPatch = lang === "en" ? "Patch" : "版本";
  const rows = e.pieces.map(p => {
    const nm = lang === "en" ? (p.en || p.ja) : (p.zh || p.ja || p.en);
    const sub = p.zh && p.ja && lang !== "en" ? `<div class="item-en">${esc(p.ja)}</div>`
              : (!p.zh && p.ja && lang !== "en" ? `<div class="item-en">${esc(p.en || "")}</div>` : "");
    const zhMiss = !p.zh ? ` <span class="zh-missing">${lang === "en" ? "not on TW" : "繁中未實裝"}</span>` : "";
    const iconHtml = p.icon ? `<img class="set-modal-icons-img" src="配裝圖片/icons/${p.icon}.png"
        style="width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:#0a0d12;margin-right:8px;vertical-align:middle"
        onerror="this.style.display='none'">` : "";
    // dye 未知（無徽章資料）時留空，不誤標「不可染」；交易欄兩態都明示
    const dyeChip = p.dye === undefined ? ""
      : p.dye > 0 ? `<span class="mini-chip chip-dye">🎨×${p.dye}</span>`
                  : `<span class="mini-chip chip-nodye">${lang === "en" ? "no dye" : "不可染"}</span>`;
    const mbChip = p.mb ? `<span class="mini-chip chip-mb">${lang === "en" ? "tradable" : "可交易"}</span>`
                        : `<span class="mini-chip chip-nodye">${lang === "en" ? "untradable" : "不可交易"}</span>`;
    const lookup = (p.zh || p.ja || "").replace(/'/g, "\\'");
    const nameHtml = nm
      ? `<span class="item-link" title="查看使用此裝備的配裝" onclick="searchInOutfits('${esc(lookup)}')">${esc(nm)}</span>`
      : "";
    // 逐件取得細項（build_sets.py 從 sources.json 算好：貨幣×價格＋NPC＋地點…）
    const srcLine = p.src ? `<div class="item-src">${esc(p.src)}</div>` : "";
    return `<tr>
      <td class="slot-cell">${p.slot ? `<span class="slot-badge">${esc(lang === "en" ? (SLOT_EN[p.slot] || p.slot) : p.slot)}</span>` : ""}</td>
      <td class="item-name">${iconHtml}${nameHtml}${zhMiss}${sub}${srcLine}</td>
      <td data-label="${hInfo}">${dyeChip} ${mbChip}</td>
      <td class="patch-cell" data-label="${hPatch}">${p.patch ? `<span class="patch-tag">${esc(p.patch)}</span>` : ""}</td>
    </tr>`;
  }).join("");
  const wearBtn = nWear
    ? `<button type="button" class="btn btn-sm btn-outline-info wearers-btn"
         onclick="viewWearers('${String(e.id).replace(/'/g, "\\'")}')">👗 ${lang === "en"
           ? `See ${nWear} player outfits using these pieces`
           : `看玩家怎麼配這套（${nWear} 套用到）`}</button>`
    : "";
  document.getElementById("modal-info-col").innerHTML =
    `<table class="equip-table">
      <thead><tr><th>${hSlot}</th><th>${hItem}</th><th>${hInfo}</th><th>${hPatch}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` + wearBtn + sourceOverview(e);

  const counter = document.getElementById("nav-counter");
  counter.textContent = (idx + 1) + " / " + filtered.length;
  document.getElementById("prev-btn").onclick = () => navModal(-1);
  document.getElementById("next-btn").onclick = () => navModal(1);
  document.getElementById("close-btn").onclick = closeModal;
  document.getElementById("copy-btn").onclick = () => copyOutfit(e);
  syncModalFav();
}

// ── 取得方式總覽（彈窗底部）──
// 逐件那行只寫得下一種取法，這裡反過來以「來源 → 這套哪幾件」分組，
// 直接回答「跑一趟哪裡能湊幾件」。點來源即以該來源篩選。
function sourceOverview(e) {
  const lang = currentLang;
  const byKey = new Map();   // 來源鍵 → [部位…]
  for (const p of outfitPieces(e)) {
    if (!p || typeof p !== "object") continue;
    const slot = p.slot || (lang === "en" ? "?" : "？");
    for (const k of pieceSrcKeys(p)) {
      if (!byKey.has(k)) byKey.set(k, []);
      const arr = byKey.get(k);
      if (!arr.includes(slot)) arr.push(slot);
    }
  }
  if (e.type === "set") {
    const k = srcKeyOf(e.source);
    if (k && !byKey.has(k)) byKey.set(k, [lang === "en" ? "whole set" : "整套"]);
  }
  if (!byKey.size) return "";
  const rows = [...byKey.entries()]
    .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "zh-Hant"))
    .map(([k, slots]) => {
      const slotHtml = slots.map(s =>
        `<span class="slot-badge">${esc(lang === "en" ? (SLOT_EN[s] || s) : s)}</span>`).join("");
      return `<div class="src-ov-row">
        <span class="src-ov-key" title="${lang === "en" ? "Filter by this source" : "以此來源篩選"}"
              onclick="filterBySource('${esc(k).replace(/'/g, "\\'")}')">${esc(k)}</span>
        <span class="src-ov-slots">${slotHtml}<span class="src-ov-n">${slots.length}</span></span>
      </div>`;
    }).join("");
  return `<div class="src-overview">
    <div class="src-ov-title">📍 ${lang === "en" ? "Where to get it" : "取得方式總覽"}
      <span class="src-ov-note">${lang === "en" ? "click a source to filter" : "點來源即以它篩選"}</span></div>
    ${rows}</div>`;
}

// 彈窗點來源 → 關窗並套用該來源篩選
function filterBySource(key) {
  closeModal();
  srcTags.clear();
  document.querySelectorAll('.filter-btn[data-group="src"].active')
          .forEach(b => b.classList.remove("active"));
  srcDetail = key;
  populateSrcDetail();
  applyFilters();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 從官方套裝的裝備名跳回「配裝」檢視搜尋（看誰穿過它）
function searchInOutfits(name) {
  closeModal();
  setView("outfits");
  const input = document.getElementById("search-input");
  input.value = name;
  q = name;
  applyFilters();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ════════════════════════════════════════════════════════
// MIRAPRI MODAL RENDER
// ════════════════════════════════════════════════════════
function renderMiraModal(e, idx) {
  // 標題：投稿名稱
  document.getElementById("modal-title").textContent = e.name;

  // 副標題：性別 · 種族 · 日期 · by 投稿者
  const genderText = e.gender === "female" ? "♀ 女性" : e.gender === "male" ? "♂ 男性" : "? 未指定";
  const gCls  = `tag-${e.gender || "unk"}`;
  const rMap2    = currentLang === "en" ? RACE_LABEL : RACE_ZH;
  const raceText = e.race ? (rMap2[e.race] || e.race) : (currentLang === "en" ? "Unknown" : "未知種族");
  const ts = e.timestamp
    ? (isNaN(e.timestamp) ? String(e.timestamp).split(" ")[0]
                          : new Date(e.timestamp * 1000).toLocaleDateString("zh-TW"))
    : "";
  // 投稿者可點：1,335 位投稿者的作品原本只能靠手打名字才找得到同一人的其他配裝
  const byUser = e.color
    ? `by <span class="link-user" role="button" tabindex="0"
         title="${currentLang === "en" ? "See this user's other outfits" : "看這位投稿者的其他配裝"}"
         onclick="searchItem('${esc(e.color).replace(/'/g, "\\'")}')">${esc(e.color)}</span>`
    : "";
  const parts = [ts, byUser].filter(Boolean).join("  ·  ");
  document.getElementById("modal-subtitle").innerHTML =
    `<span class="${gCls}">${genderText}</span> · <span class="tag-race">${raceText}</span>` +
    (parts ? `  <span style="margin-left:6px">${parts}</span>` : "");

  // 圖片
  const imgCol = document.getElementById("modal-img-col");
  imgCol.innerHTML = modalImg(e.image, e.name);

  // 裝備表格（6 欄，與精選相同）
  const equips = e.equipments || [];
  const lang   = currentLang;
  const hSlot  = lang === "en" ? "Slot"     : "部位";
  const hItem  = lang === "en" ? "Item"     : "裝備";
  const hDye   = lang === "en" ? "Dye"      : "染色";
  const hPatch = lang === "en" ? "Patch"    : "版本";
  const hSrc   = lang === "en" ? "Source"   : "取得方式";
  const hRestr = lang === "en" ? "Restrict" : "限制";
  let rows = "";
  if (equips.length) {
    rows = equips.map(eq => {
      if (typeof eq === "string") {
        return `<tr><td colspan="6" class="item-name">${esc(eq)}</td></tr>`;
      }
      const slot     = eq.slot || "";
      const slotLbl  = lang === "en" ? (SLOT_EN[slot] || slot) : slot;
      const zhName   = eq.zh   || "";
      const jaName   = eq.name || "";
      const dispName = lang === "en" ? (jaName || zhName) : (zhName || jaName);
      const subName  = dispName !== jaName && jaName ? `<div class="item-en">${esc(jaName)}</div>` : "";
      const nameClass = "item-name";
      const lookupName = (zhName || jaName).replace(/'/g, "\\'");
      const dispHtml = dispName
        ? `<span class="item-link" title="查看使用此裝備的其他套裝" onclick="searchItem('${esc(lookupName)}')">${esc(dispName)}</span>`
        : "";
      // 染色（v2 逐件；無逐件資料時為 — —，改由套裝層級 dyeLine fallback 顯示）
      const dye = `${dyeHtml(eq.dye1)} ${dyeHtml(eq.dye2)}`;
      // 版本
      const patchHtml = eq.patch ? `<span class="patch-tag">${esc(eq.patch)}</span>` : "";
      // 取得方式
      const st     = eq.st || "other";
      const stCls  = SRC_CLASS[st] || "src-other";
      const src    = eq.source || "";
      const srcHtml = src ? `<span class="source-tag ${stCls}">${esc(src)}</span>` : "—";
      // 限制
      const lvHtml  = eq.lv && eq.lv !== "1" ? `<span class="restrict-level">Lv.${eq.lv}</span>` : "";
      const jobHtml = eq.job && eq.job !== "全職業" ? `<span class="restrict-job">${esc(eq.job)}</span>` : "";
      return `<tr>
        <td class="slot-cell">${slotLbl ? `<span class="slot-badge">${esc(slotLbl)}</span>` : ""}</td>
        <td class="${nameClass}">${dispHtml}${subName}${badgeChips(eq, true)}</td>
        <td class="dye-cell" data-label="${hDye}">${dye}</td>
        <td class="patch-cell" data-label="${hPatch}">${patchHtml}</td>
        <td class="src-cell" data-label="${hSrc}">${srcHtml}</td>
        <td class="restrict-cell" data-label="${hRestr}">${lvHtml}${jobHtml}</td>
      </tr>`;
    }).join("");
  } else {
    rows = `<tr><td colspan="6" style="color:var(--muted)">無裝備資料</td></tr>`;
  }
  // 整套染色 fallback：僅在「沒有逐件染色資料」時顯示（尚未重跑 v2 的社群套裝）
  const dyeLine = (!e.hasPieceDyes && Array.isArray(e.dyes) && e.dyes.length)
    ? `<div class="mirapri-dye-line">${lang === "en" ? "Dyes used" : "使用染色"}：` +
      e.dyes.map(d => dyeHtml(d)).join(" ") + `</div>`
    : "";
  document.getElementById("modal-info-col").innerHTML =
    `<table class="equip-table">
      <thead><tr>
        <th>${hSlot}</th><th>${hItem}</th><th>${hDye}</th>
        <th>${hPatch}</th><th>${hSrc}</th><th>${hRestr}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>` + dyeLine + sourceOverview(e);

  // 導航
  const counter = document.getElementById("nav-counter");
  counter.textContent = (idx + 1) + " / " + filtered.length;
  document.getElementById("prev-btn").onclick = () => navModal(-1);
  document.getElementById("next-btn").onclick = () => navModal(1);
  document.getElementById("close-btn").onclick = closeModal;
  document.getElementById("copy-btn").onclick = () => copyOutfit(e);
  syncModalFav();
}

// ════════════════════════════════════════════════════════
// BUILD EQUIPMENT TABLE (curated modal)
// ════════════════════════════════════════════════════════
function buildTable(pieces, lang) {
  if (!pieces || pieces.length === 0) return '<p style="color:var(--muted);padding:12px">無裝備資料</p>';

  const dlDye   = lang === "en" ? "Dye"      : "染色";
  const dlPatch = lang === "en" ? "Patch"    : "版本";
  const dlSrc   = lang === "en" ? "Source"   : "取得方式";
  const dlRestr = lang === "en" ? "Restrict" : "限制";

  const rows = pieces.map(p => {
    const slotEn  = SLOT_EN[p.slot] || p.slot;
    const slotLabel = lang === "en" ? slotEn : p.slot;
    const itemName = lang === "en" ? p.en : (p.zh || p.en);
    const nameClass = (!p.zh || p.zh.includes("待確認") || p.zh.includes("尚未")) ? "item-name unconfirmed" : "item-name";

    // Dye cells（含色票）
    const d1 = dyeHtml(p.dye1);
    const d2 = dyeHtml(p.dye2);

    // Source tag
    const stClass = SRC_CLASS[p.st] || "src-other";
    const srcHtml = p.source
      ? `<span class="source-tag ${stClass}">${esc(p.source)}</span>` : "—";

    // Restriction
    const lvHtml  = p.lv && p.lv !== "1"  ? `<span class="restrict-level">Lv.${p.lv}</span>` : "";
    const jobHtml = p.job && p.job !== "全職業" ? `<span class="restrict-job">${esc(p.job)}</span>` : "";
    const gHtml   = p.gender ? `<span class="restrict-gender">${p.gender==="female"?"♀":"♂"}</span>` : "";
    const rHtml   = p.race   ? `<span class="restrict-race">${(lang==="en"?RACE_LABEL:RACE_ZH)[p.race]||p.race}</span>` : "";
    const patchHtml = p.patch ? `<span class="patch-tag">${esc(p.patch)}</span>` : "";

    const lookupName = p.zh || p.en;
    const nameHtml = itemName
      ? `<span class="item-link" title="查看使用此裝備的其他套裝" onclick="searchItem('${esc(lookupName).replace(/'/g,"\\'")}')">${esc(itemName)}</span>`
      : "";
    return `<tr>
      <td class="slot-cell"><span class="slot-badge">${esc(slotLabel)}</span></td>
      <td class="${nameClass}">${nameHtml}${badgeChips(p, true)}</td>
      <td class="dye-cell" data-label="${dlDye}">${d1} ${d2}</td>
      <td class="patch-cell" data-label="${dlPatch}">${patchHtml}</td>
      <td class="src-cell" data-label="${dlSrc}">${srcHtml}</td>
      <td class="restrict-cell" data-label="${dlRestr}">${lvHtml}${jobHtml}${gHtml}${rHtml}</td>
    </tr>`;
  }).join("");

  const hSlot  = lang === "en" ? "Slot"   : "部位";
  const hItem  = lang === "en" ? "Item"   : "裝備";
  const hDye   = lang === "en" ? "Dye"    : "染色";
  const hPatch = lang === "en" ? "Patch"  : "版本";
  const hSrc   = lang === "en" ? "Source" : "取得方式";
  const hRestr = lang === "en" ? "Restrict" : "限制";

  return `<table class="equip-table">
    <thead><tr>
      <th>${hSlot}</th><th>${hItem}</th><th>${hDye}</th>
      <th>${hPatch}</th><th>${hSrc}</th><th>${hRestr}</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ════════════════════════════════════════════════════════
// 複製裝備清單
// ════════════════════════════════════════════════════════
function copyOutfit(e) {
  const ps = e.type === "mirapri" ? (e.equipments || []) : (e.pieces || []);
  const lines = [`#${e.id || ""} ${e.name}${e.color ? "（" + e.color + "）" : ""}`.trim()];
  ps.forEach(p => {
    if (typeof p === "string") { lines.push(p); return; }
    const name = p.zh || p.en || p.name || "";
    if (!name) return;
    const dyes = [p.dye1, p.dye2].filter(d => d && d !== "—").join("／");
    lines.push(`${p.slot || "－"}：${name}${dyes ? "（染：" + dyes + "）" : ""}`);
  });
  const text = lines.join("\n");
  const done = () => {
    const btn = document.getElementById("copy-btn");
    const orig = btn.textContent;
    btn.textContent = "✅ 已複製";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

// ════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════
function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function updateSubtitle() {
  const el = document.getElementById("site-subtitle");
  if (viewMode === "sets") {
    const loading = setsLoaded ? "" : (currentLang === "en" ? " · loading…" : " · 官方套裝載入中…");
    el.textContent = currentLang === "en"
      ? `${filtered.length} gear sets${loading}`
      : `官方套裝 ${filtered.length} 套${loading}`;
  } else {
    const curated = filtered.filter(e => e.type === "curated").length;
    const mira    = filtered.filter(e => e.type === "mirapri").length;
    const loading = miraLoaded ? "" : (currentLang === "en" ? " · loading community…" : " · 社群配裝載入中…");
    if (currentLang === "en") {
      el.textContent = `${filtered.length} outfits (⭐ ${curated} curated · ${mira} community)${loading}`;
    } else {
      el.textContent = `共 ${filtered.length} 套（⭐ 精選 ${curated} 套 · 社群 ${mira} 套）${loading}`;
    }
  }
  document.getElementById("result-count").textContent =
    currentLang === "en" ? filtered.length + " results" : filtered.length + " 件";
  // 有任何篩選啟用時才顯示「清除篩選」
  const anyFilter = srcTags.size || srcDetail || jobTags.size || dyeTags.size || favOnly ||
                    twOnly || q || itemFilter || miraFilters.gender || miraFilters.race;
  document.getElementById("clear-filters-btn").classList.toggle("d-none", !anyFilter);
  // 收合狀態下也要看得出「現在有幾個條件生效」，否則使用者會以為篩選沒套用。
  // 搜尋字不算——搜尋框本來就一直看得見。
  const nCond = srcTags.size + jobTags.size + dyeTags.size + (srcDetail ? 1 : 0) +
                (favOnly ? 1 : 0) + (twOnly ? 1 : 0) + (itemFilter ? 1 : 0) +
                (miraFilters.gender ? 1 : 0) + (miraFilters.race ? 1 : 0);
  const badge = document.getElementById("filter-active-count");
  badge.textContent = nCond;
  badge.classList.toggle("d-none", nCond === 0);
}

// ── 檢視切換（配裝 / 官方套裝）──
function setView(mode) {
  if (viewMode === mode) return;
  viewMode = mode;
  document.getElementById("view-outfits-btn").classList.toggle("view-active", mode === "outfits");
  document.getElementById("view-sets-btn").classList.toggle("view-active", mode === "sets");
  const isSets = mode === "sets";
  // 官方套裝沒有性別/種族欄位 → 隱藏該兩列
  document.getElementById("row-gender").classList.toggle("d-none", isSets);
  document.getElementById("row-race").classList.toggle("d-none", isSets);
  document.getElementById("row-dye").classList.toggle("d-none", isSets);
  // 切到還沒載完的檢視時插隊：別讓使用者等另一份他現在不看的資料載完
  if (isSets) loadSets(() => loadItemSources());
  else loadMirapri(() => loadItemSources());
  populateSrcDetail();   // 兩個檢視的來源字串不同（整套 vs 逐件）→ 重建選項
  applyFilters();
  syncURL(true);
  window.scrollTo({ top: 0 });
}

function resetFilters() {
  srcTags.clear(); jobTags.clear(); dyeTags.clear();
  srcDetail = "";
  favOnly = twOnly = false;
  q = "";
  itemFilter = null; pendingSetId = null;
  syncItemFilterChip();
  miraFilters = { gender: "", race: "" };
  document.getElementById("search-input").value = "";
  document.querySelectorAll(".filter-btn.active").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".filter-btn.filter-reset").forEach(b => b.classList.add("active"));
  populateSrcDetail();
  applyFilters();
  syncURL(true);
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("lang-active"));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add("lang-active");
  // Update static labels
  document.querySelectorAll("[data-zh]").forEach(el => {
    if (el.dataset.zh) el.textContent = lang === "en" ? (el.dataset.en || el.dataset.zh) : el.dataset.zh;
  });
  document.querySelectorAll("[data-zh-placeholder]").forEach(el => {
    el.placeholder = lang === "en" ? el.dataset.enPlaceholder : el.dataset.zhPlaceholder;
  });
  populateSrcDetail();   // 「全部」那列的字要跟著語言走
  renderGrid();
  updateSubtitle();
  syncURL(true);
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", () => {
  ALL_OUTFITS = (typeof _CURATED_RAW !== "undefined" ? _CURATED_RAW : []).map(annotate);
  filtered = [...ALL_OUTFITS];
  populateSrcDetail();
  renderGrid();
  updateSubtitle();
  // 延遲載入在 applyURLState() 之後才開始——載入順序要看使用者要的是哪個檢視，
  // 而 viewMode 是在那裡才從網址讀出來的（見 startLoading）。

  // Filter buttons (source/job，可複選)
  document.querySelectorAll(".filter-btn[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      const tag = btn.dataset.filter;
      const set = btn.dataset.group === "src" ? srcTags : jobTags;
      if (set.has(tag)) { set.delete(tag); btn.classList.remove("active"); }
      else              { set.add(tag);    btn.classList.add("active"); }
      if (btn.dataset.group === "src") populateSrcDetail();   // 細項只列選中的分類
      applyFilters();
      syncURL(true);
    });
  });

  // 我的收藏
  document.getElementById("fav-filter-btn").addEventListener("click", function () {
    favOnly = !favOnly;
    this.classList.toggle("active", favOnly);
    applyFilters();
    syncURL(true);
  });

  // 繁中版可幻化
  document.getElementById("tw-btn").addEventListener("click", function () {
    twOnly = !twOnly;
    this.classList.toggle("active", twOnly);
    applyFilters();
    syncURL(true);
  });

  // 色系（可複選）
  document.querySelectorAll(".dye-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = btn.dataset.dye;
      if (dyeTags.has(f)) { dyeTags.delete(f); btn.classList.remove("active"); }
      else                { dyeTags.add(f);    btn.classList.add("active"); }
      applyFilters();
      syncURL(true);
    });
  });

  // 熱門單品
  document.getElementById("hot-items-btn").addEventListener("click", openHotItems);

  // 「有穿某官方套裝」的 chip：點掉即清除
  document.getElementById("item-filter-chip").addEventListener("click", clearItemFilter);

  // 取得方式細項（可打字過濾的挑選器）
  document.getElementById("src-detail-btn").addEventListener("click", () => {
    if (document.getElementById("src-detail-pop").hidden) openSrcPick();
    else closeSrcPick(true);
  });
  document.getElementById("src-detail-q").addEventListener("input", renderSrcPickList);
  document.getElementById("src-detail-list").addEventListener("click", ev => {
    const opt = ev.target.closest(".srcpick-opt");
    if (opt) pickSrcDetail(opt.dataset.key || "");
  });
  document.getElementById("src-detail").addEventListener("keydown", ev => {
    if (ev.key === "Escape") { ev.stopPropagation(); closeSrcPick(true); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); moveSrcPickCursor(1); }
    else if (ev.key === "ArrowUp")   { ev.preventDefault(); moveSrcPickCursor(-1); }
    else if (ev.key === "Enter" && srcPickCursor >= 0) {
      ev.preventDefault();
      const opts = document.querySelectorAll("#src-detail-list .srcpick-opt");
      if (opts[srcPickCursor]) pickSrcDetail(opts[srcPickCursor].dataset.key || "");
    }
  });
  document.addEventListener("click", ev => {
    if (!ev.target.closest("#src-detail")) closeSrcPick(false);
  });

  // 窄螢幕預設收起篩選條件（桌機的 summary 由 CSS 隱藏，維持全開）。
  // 斷點要與上面 CSS 的 767.98px 一致，否則會出現「收起來了但沒有把手可以打開」。
  if (window.matchMedia && window.matchMedia("(max-width: 767.98px)").matches)
    document.getElementById("filter-more").open = false;

  // 排序
  document.getElementById("sort-select").addEventListener("change", function () {
    sortMode = this.value;
    applyFilters();
    syncURL(true);
  });

  // 清除篩選
  document.getElementById("clear-filters-btn").addEventListener("click", resetFilters);

  // Gender / Race filter buttons
  document.querySelectorAll(".filter-btn[data-mf]").forEach(btn => {
    btn.addEventListener("click", () => {
      const field = btn.dataset.mf;
      const val   = btn.dataset.val;
      miraFilters[field] = (miraFilters[field] === val && val !== "") ? "" : val;
      document.querySelectorAll(`.filter-btn[data-mf="${field}"]`).forEach(b => b.classList.remove("active"));
      const activeBtn = document.querySelector(`.filter-btn[data-mf="${field}"][data-val="${miraFilters[field]}"]`);
      if (activeBtn) activeBtn.classList.add("active");
      applyFilters();
      syncURL(true);
    });
  });

  // Search
  // 打字不要每一鍵都重跑全表：連打時只在停手 160ms 後算一次。
  // 160ms 是「打完一個中文字」的空檔，體感仍是即時的。
  let searchTimer = null;
  document.getElementById("search-input").addEventListener("input", ev => {
    const val = ev.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (val === q) return;
      q = val;
      applyFilters();
      syncURL(false);   // 打字用 replace，否則每按一鍵就多一筆歷史
    }, 160);
  });

  // 上一頁／下一頁：把網址狀態套回來
  window.addEventListener("popstate", applyURLState);

  // 彈窗被關掉（X／Esc／點背景／程式呼叫）→ 網址去掉 id，
  // 用 replace 而不是新增歷史，免得「關掉後按上一頁」又把它開回來
  document.getElementById("modal").addEventListener("shown.bs.modal", () => {
    modalShowing = false;
    if (closeAfterShown) { closeAfterShown = false; closeModal(silentClose); }
  });
  document.getElementById("modal").addEventListener("hidden.bs.modal", () => {
    modalShowing = false;
    openModalId = null;
    if (silentClose) { silentClose = false; return; }
    syncURL(false);
  });

  // 進站先套用網址狀態（分享連結／重新整理都能回到原畫面）
  applyURLState();

  // 網址狀態套完（viewMode 已定）才開始背景載入，順序才會對
  startLoading();

  // Lightbox 開啟時，Esc 先關放大圖（攔截，避免一起把彈窗也關掉）
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && document.getElementById("img-lightbox").classList.contains("show")) {
      ev.stopImmediatePropagation();
      closeLightbox();
    }
  }, true);

  // Lightbox 縮放／平移：滾輪縮放、拖曳平移、雙擊還原
  const lb = document.getElementById("img-lightbox");
  const lbImg = document.getElementById("img-lightbox-img");
  lb.addEventListener("wheel", ev => { ev.preventDefault(); lbZoom(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
  lbImg.addEventListener("dblclick", ev => {
    ev.preventDefault();
    if (lbScale > 1) lbReset(); else { lbScale = 2.5; lbApply(); }
  });
  lbImg.addEventListener("pointerdown", ev => {
    if (lbScale <= 1) return;
    lbDrag = true; lbSX = ev.clientX - lbX; lbSY = ev.clientY - lbY;
    lbImg.setPointerCapture(ev.pointerId); lbImg.style.cursor = "grabbing";
  });
  lbImg.addEventListener("pointermove", ev => {
    if (!lbDrag) return;
    lbX = ev.clientX - lbSX; lbY = ev.clientY - lbSY; lbApply();
  });
  lbImg.addEventListener("pointerup", () => { lbDrag = false; lbApply(); });

  // Keyboard nav（Bootstrap 已處理 Esc，這裡補方向鍵）
  document.addEventListener("keydown", ev => {
    const modalOpen = document.getElementById("modal").classList.contains("show");
    if (modalOpen) {
      if (ev.key === "ArrowLeft")  navModal(-1);
      if (ev.key === "ArrowRight") navModal(1);
    }
  });

  // Set initial active gender button (全部)
  const allGenderBtn = document.querySelector('.filter-btn[data-mf="gender"][data-val=""]');
  if (allGenderBtn) allGenderBtn.classList.add("active");
  const allRaceBtn = document.querySelector('.filter-btn[data-mf="race"][data-val=""]');
  if (allRaceBtn) allRaceBtn.classList.add("active");
});
</script>
