<!DOCTYPE html>
<html lang="zh-Hant" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻化配裝圖鑑 | 水神的工具箱</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<script src="../../assets/js/theme.js"></script>
<script src="curated_outfits.js"></script>
<style>
/* ===== 站內共用設計語彙 → 映射到 Bootstrap 5 變數 =====
   色票／字體／圓角 token 一律來自 assets/css/tokens.css（暗色基準）
   ＋ assets/css/theme.css（亮色覆蓋）。本頁 2026-08-01 前是全站唯一
   沒接主題系統的頁（切亮色仍是純暗底），也沒有全站頂列——theme.js
   同時負責注入 #sgt-topbar 與主題鈕，補上這支就一起回來了。
   本頁只留 Bootstrap 對接與自己的 --accent2／--tag-other。 */
:root{
  --accent:  var(--gold);                  /* 本頁識別色（本頁不載 common.css，要自己給）*/
  --accent2: var(--blue);                  /* 次強調 */
  --tag-other:#374151;
}
/* Bootstrap 的變數改吃共用 token，兩個主題各一組。
   data-bs-theme 由 theme.js 跟著 data-theme 一起設。 */
[data-bs-theme="dark"], [data-bs-theme="light"]{
  --bs-body-bg:var(--bg-base); --bs-body-color:var(--text-primary);
  --bs-tertiary-bg:var(--bg-card); --bs-secondary-bg:var(--bg-surface);
  --bs-border-color:var(--border); --bs-border-color-translucent:var(--border);
  --bs-primary:var(--accent2);
  --bs-link-color:var(--accent2);
}
[data-bs-theme="dark"]{
  --bs-primary-rgb:79,195,247;
  --bs-emphasis-color:#fff; --bs-emphasis-color-rgb:255,255,255;
  --bs-link-color-rgb:79,195,247;
  --bs-link-hover-color:#8ad8fa;
}
[data-bs-theme="light"]{
  --bs-primary-rgb:12,111,166;
  --bs-emphasis-color:#16181d; --bs-emphasis-color-rgb:22,24,29;
  --bs-link-color-rgb:12,111,166;
  --bs-link-hover-color:#09517a;
}
/* .btn-outline-light 是「白字白框」，亮底等於隱形（檢視切換與語言切換的
   未選中那顆會整顆消失）。Bootstrap 5 的按鈕吃 --bs-btn-* 變數，改導到
   共用色票即可，不必改 HTML 的 class。 */
[data-bs-theme="light"] .btn-outline-light{
  --bs-btn-color:var(--text-secondary);
  --bs-btn-border-color:var(--border-hover);
  --bs-btn-hover-color:var(--bg-card);
  --bs-btn-hover-bg:var(--text-secondary);
  --bs-btn-hover-border-color:var(--text-secondary);
  --bs-btn-active-color:var(--bg-card);
  --bs-btn-active-bg:var(--text-secondary);
  --bs-btn-active-border-color:var(--text-secondary);
}
/* 鍵盤焦點環：Bootstrap 的 `.btn:focus-visible{outline:0;box-shadow:…}` 與
   tokens.css 的全站規則同特定度 (0,2,0)，而 bootstrap.min.css 後載入會勝出，
   它換上的 box-shadow 光暈在 btn-outline-light 上幾乎看不見。這裡補一條
   讓本頁跟全站一致。 */
.btn:focus-visible, .form-control:focus-visible, .form-select:focus-visible{
  outline:2px solid var(--focus-ring); outline-offset:2px; box-shadow:none;
}

/* 根字級：與其他 rem 制的頁一致（faux-hollows／fishing／gardening／
   gc-exchange／market／squadron）。本頁原為 17px，同一句 .8rem 在這裡是
   13.6px、在那六頁是 14px。
   109.375% = 16 × 1.09375 = 17.5px：預設瀏覽器下渲染尺寸與原本的 17.5px 完全相同，
   但**用 px 寫死 root font-size 會蓋掉使用者在瀏覽器設定的字級**（放大字體對本頁無效），
   用 % 才會跟著放大。2026-08-03 七頁一起改完。 */
html{ font-size:109.375%; }
body{ font-family:var(--font-sans); }
/* 站內共通背景光暈 */
body::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:radial-gradient(ellipse 80% 50% at 20% 0%, rgba(200,169,110,.05) 0%, transparent 60%),
             radial-gradient(ellipse 60% 40% at 80% 100%, rgba(79,195,247,.04) 0%, transparent 60%); }

/* ── Navbar ── */
/* top:46px ＝ nav.js 注入的全站頂列 #sgt-topbar 高度。兩者都是 sticky top:0 時
   會疊在同一位置，而頂列 z-index 9997 高過這裡的 1030，捲動時本頁的 navbar
   會被蓋掉——所以往下讓一個頂列的高度。 */
.app-navbar{ background:color-mix(in srgb, var(--bg-surface) 92%, transparent);
  border-bottom:1px solid var(--border); backdrop-filter:blur(12px); z-index:1030; top:46px; }
@media (max-width:600px){ .app-navbar{ top:46px; } }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; white-space:nowrap;
  color:var(--muted); padding:6px 12px; border:1px solid var(--border); border-radius:6px;
  text-decoration:none; transition:all .18s; }
.back-link:hover{ color:var(--accent); border-color:var(--border-hover); }
.app-title{ font-size:1.35rem; font-weight:700; margin:0; color:var(--accent-light); }
.app-subtitle{ color:var(--muted); font-size:.85rem; }
.lang-btn.lang-active{ background:var(--accent)!important; border-color:var(--accent)!important; color:var(--bg-base)!important; }

/* ── Filter bar ── */
.filter-bar{ background:var(--card-bg); border-bottom:1px solid var(--border); }
.filter-group-label{ font-size:.8rem; color:var(--muted); white-space:nowrap;
  background:var(--raise); border:1px solid var(--border); border-radius:4px; padding:2px 8px; }
.filter-sep{ width:1px; height:20px; background:var(--border); }
/* .btn-outline-secondary 用的是 Bootstrap 預設灰，在本站深底上只有 2.0:1——
   35 顆篩選鈕全數踩到。與上面 .btn-outline-light 同一招，改導到共用色票。 */
.filter-btn{ --bs-btn-padding-y:.28rem; --bs-btn-padding-x:.85rem; --bs-btn-font-size:.875rem; border-radius:20px; }
.filter-btn.btn-outline-secondary{
  --bs-btn-color:var(--text-secondary);
  --bs-btn-border-color:var(--border);
  --bs-btn-hover-color:var(--bg-card);
  --bs-btn-hover-bg:var(--text-secondary);
  --bs-btn-hover-border-color:var(--text-secondary);
}
/* Bootstrap 的 .text-secondary 在兩個主題都偏淡（3.79／4.19），導到站內 token */
.text-secondary{ --bs-secondary-color:var(--text-secondary); color:var(--text-secondary) !important; }
/* 選中的篩選鈕：底色是 token（亮/暗兩套），文字硬寫 #fff 就只有暗色那邊對——
   --unknown（＝--text-muted）配白字在暗色只有 3.85:1。統一改 --bg-base，
   底色亮時字就深、底色深時字就亮，兩個主題都成立。 */
.filter-btn.active{ background:var(--accent2); border-color:var(--accent2); color:var(--bg-base); }
.filter-btn.female-btn.active{ background:var(--female); border-color:var(--female); color:var(--bg-base); }
.filter-btn.male-btn.active{ background:var(--male); border-color:var(--male); color:var(--bg-base); }
.filter-btn.unk-btn.active,.filter-btn.filter-reset.active{ background:var(--unknown); border-color:var(--unknown); color:var(--bg-base); }
.tw-btn.active{ background:#16a34a; border-color:#16a34a; color:#fff; }
.fav-filter.active{ background:#b45309; border-color:#b45309; color:#fff; }
.search-input{ width:240px; border-radius:20px; }
.sort-select{ width:auto; border-radius:20px; }
/* ── 篩選條件的收合（窄螢幕）──
   條件用寬度不用 pointer：這裡的問題是**垂直空間**（375px 實測篩選列 764px、
   視窗才 812px），不是手指粗細——觸控筆電有 1920px 高度，不需要收。
   767.98px ＝ Bootstrap md 斷點，也正是卡片網格掉到 2 欄的那一階。
   桌機端 summary 整個隱藏、details 保持 open，版面與收合前完全相同；
   HTML 預設就帶 open，所以 JS 沒跑到也不會把篩選鎖住。 */
#filter-more > summary{ display:none; }
@media (max-width: 767.98px){
  #filter-more > summary{
    display:flex; align-items:center; gap:.5rem; cursor:pointer; list-style:none;
    min-height:var(--tap-min, 44px); margin-bottom:.35rem;
    font-size:.85rem; color:var(--text-secondary);
  }
  #filter-more > summary::-webkit-details-marker{ display:none; }
  #filter-more > summary::after{ content:"▾"; margin-left:auto; transition:transform .18s; }
  #filter-more[open] > summary::after{ transform:rotate(180deg); }
}
.filter-active-count{
  background:var(--accent2); color:var(--bg-base); border-radius:20px;
  padding:1px 8px; font-size:.75rem; font-weight:600;
}

/* ── 取得方式細項挑選器 ──
   原本是 828 個 <option> 的原生 <select>。選項只在展開時才建 DOM。
   max-width 不能寫死 22rem＝385px（本頁 root 是 17.5px），那比 375px 手機還寬，
   加上容器左緣 18px 會整頁橫向溢出 30px；min() 讓它在窄螢幕退回容器寬。 */
.srcpick{ position:relative; max-width:min(22rem, 100%); }
.srcpick-btn{
  display:flex; align-items:center; gap:.5rem; width:100%;
  background:var(--raise); color:var(--text); border:1px solid var(--border);
  border-radius:20px; padding:.28rem .85rem; font-size:.875rem; text-align:left;
}
.srcpick-btn:hover{ border-color:var(--accent2); }
.srcpick-btn.on{ background:var(--accent2); border-color:var(--accent2); color:var(--bg-base); }
.srcpick-btn > span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srcpick-caret{ margin-left:auto; flex:none; }
.srcpick-pop{
  position:absolute; z-index:1030; top:calc(100% + 4px); left:0;
  width:min(24rem, calc(100vw - 2rem));
  background:var(--card-bg); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.35); padding:.5rem;
}
.srcpick-q{
  width:100%; background:var(--raise); color:var(--text);
  border:1px solid var(--border); border-radius:8px; padding:.35rem .6rem; font-size:.875rem;
}
.srcpick-list{ max-height:min(50vh, 22rem); overflow-y:auto; margin-top:.4rem; }
.srcpick-group{ font-size:.75rem; color:var(--muted); padding:.35rem .5rem .15rem; position:sticky; top:0;
  background:var(--card-bg); }
.srcpick-opt{
  display:flex; align-items:center; gap:.5rem; width:100%; text-align:left;
  background:none; border:0; color:var(--text); border-radius:6px;
  padding:.35rem .5rem; font-size:.875rem; min-height:var(--tap-min, 44px);
}
.srcpick-opt:hover,.srcpick-opt.cursor{ background:var(--raise); }
.srcpick-opt[aria-selected="true"]{ color:var(--accent2); font-weight:600; }
.srcpick-opt .n{ margin-left:auto; color:var(--muted); font-size:.78rem; flex:none; }
.srcpick-more{ color:var(--muted); font-size:.78rem; padding:.4rem .5rem; }
/* 色系鈕：選中時直接用該色系的代表色當底，比文字更快辨認 */
.dye-btn.active{ color:var(--bg-base); }
.dye-btn[data-dye="white"].active { background:#ECECE8; border-color:#ECECE8; color:#1a1a1a; }
.dye-btn[data-dye="black"].active { background:#2B2B2B; border-color:#2B2B2B; color:#f2f2f2; }
.dye-btn[data-dye="grey"].active  { background:#9aa0a6; border-color:#9aa0a6; }
.dye-btn[data-dye="red"].active   { background:#a01e32; border-color:#a01e32; color:#fff; }
.dye-btn[data-dye="pink"].active  { background:#e8a2ad; border-color:#e8a2ad; color:#1a1a1a; }
.dye-btn[data-dye="orange"].active{ background:#d2762e; border-color:#d2762e; color:#1a1a1a; }
.dye-btn[data-dye="yellow"].active{ background:#c8a84b; border-color:#c8a84b; color:#1a1a1a; }
.dye-btn[data-dye="green"].active { background:#4f7d3c; border-color:#4f7d3c; color:#fff; }
.dye-btn[data-dye="blue"].active  { background:#2e6e8e; border-color:#2e6e8e; color:#fff; }
.dye-btn[data-dye="purple"].active{ background:#6e4a8e; border-color:#6e4a8e; color:#fff; }
.dye-btn[data-dye="brown"].active { background:#5c4f42; border-color:#5c4f42; color:#fff; }
/* 「來自某官方套裝」的結果狀態：可點掉的 chip */
.item-filter-chip{ background:var(--accent); border-color:var(--accent); color:var(--bg-base); }
.item-filter-chip::after{ content:" ✕"; }

/* 熱門單品清單 */
.hot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(15rem, 1fr)); gap:.4rem; }
.hot-row{ display:flex; align-items:center; gap:.6rem; width:100%; text-align:left;
  background:var(--raise); border:1px solid var(--border); border-radius:8px;
  color:var(--text); padding:.4rem .6rem; min-height:var(--tap-min, 44px); }
.hot-row:hover{ border-color:var(--accent2); }
.hot-row img{ width:32px; height:32px; flex:none; image-rendering:auto; }
.hot-row .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.875rem; }
.hot-row .ct{ margin-left:auto; flex:none; color:var(--muted); font-size:.78rem; }
.hot-rank{ flex:none; width:1.6rem; text-align:right; color:var(--muted); font-size:.78rem; }

/* 窄螢幕：挑選器自己佔一整列，彈出層貼齊左右兩邊。
   不這樣做的話彈出層（24rem＝420px）會從按鈕左緣往右長出容器外，
   整頁跟著多出橫向捲軸。 */
@media (max-width: 767.98px){
  .srcpick{ width:100%; max-width:100%; }
  .srcpick-pop{ left:0; right:0; width:auto; }
}

/* ── Cards ── */
.outfit-card{ cursor:pointer; overflow:hidden; background:var(--card-bg);
  transition:transform .2s, box-shadow .2s, border-color .2s; }
.outfit-card:hover{ transform:translateY(-4px); border-color:var(--border-hover)!important;
  box-shadow:var(--shadow-card); }
.card-img-top{ aspect-ratio:3/4; object-fit:cover; object-position:top; background:var(--panel-bg); }
.card-noimg{ aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:.7rem; background:var(--panel-bg); }
.card-name{ font-size:1.1rem; line-height:1.3; }
.star-badge{ position:absolute; top:8px; left:8px; background:var(--accent); color:var(--bg-base);
  border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  font-size:.7rem; font-weight:700; z-index:2; }
.fav-btn{ position:absolute; top:8px; right:8px; z-index:2; width:30px; height:30px; border-radius:50%;
  background:color-mix(in srgb, var(--bg-base) 55%, transparent); border:1px solid var(--border); color:var(--text-muted); line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; }
.fav-btn:hover{ color:var(--yellow); border-color:var(--yellow); }
.fav-btn.faved{ color:var(--yellow); border-color:color-mix(in srgb, var(--yellow) 50%, transparent); background:var(--yellow-dim); }

/* card meta / tags */
.tag-female,.tag-male,.tag-unk,.tag-race{ font-size:.72rem; padding:2px 8px; border-radius:10px; white-space:nowrap; }
.tag-female{ background:color-mix(in srgb, var(--female) 15%, transparent); color:var(--female); border:1px solid color-mix(in srgb, var(--female) 40%, transparent); }
.tag-male{ background:color-mix(in srgb, var(--male) 15%, transparent); color:var(--male); border:1px solid color-mix(in srgb, var(--male) 40%, transparent); }
.tag-unk{ background:color-mix(in srgb, var(--unknown) 15%, transparent); color:var(--unknown); border:1px solid color-mix(in srgb, var(--unknown) 40%, transparent); }
.tag-race{ background:var(--raise); color:var(--muted); border:1px solid var(--border); }
/* 卡片標籤：職能／來源那組 .badge-* 是「深色實心底＋淺色字」的色票晶片
   （#065f46 綠、#7f1d1d 紅…），兩個主題都維持深底才讀得到，所以文字色
   固定淺色、--tag-other 也不隨主題變淺。別改成 var(--text-primary)：
   亮色模式會變成深字配深底。 */
.card-tag{ font-size:.72rem; padding:2px 8px; border-radius:10px; color:#e5e7eb; background:var(--tag-other); }
.badge-healer{background:#065f46}.badge-tank{background:#1e3a5f}.badge-caster{background:#4c1d95}
.badge-melee{background:#7f1d1d}.badge-pranged{background:#713f12}.badge-crafter{background:#1f2937;border:1px solid #4b5563}
/* 2026-08-03：這一排原本混了 Tailwind 500/600 的**亮**色（#16a34a／#dc2626／
   #d97706／#7c3aed／#0891b2／#ca8a04），跟上面那排 800/900 的深色不同層級。
   淺字 #e5e7eb 疊上去只有 2.57–3.9:1。統一降到與上排同深度的 800 級。 */
.badge-event{background:#166534}.badge-pvp{background:#991b1b}.badge-store{background:#854d0e}.badge-raid{background:#5b21b6}
.badge-viera{background:#5b21b6}.badge-scrip{background:#155e75}.badge-gs{background:#854d0e}

/* ── Modal (Bootstrap base + FF14 skin) ── */
.modal-content{ background:var(--card-bg); border:1px solid var(--border); }
.modal-header,.modal-footer{ background:var(--panel-bg); border-color:var(--border); }
.modal-title{ font-size:1.3rem; font-weight:700; }
.modal-subtitle{ font-size:.88rem; color:var(--muted); margin-top:2px; }
#modal-img-col{ background:var(--panel-bg); display:flex; align-items:flex-start; justify-content:center; padding:20px; }
#modal-img-col img{ width:100%; border-radius:10px; max-height:78vh; object-fit:contain; object-position:top; box-shadow:0 6px 22px rgba(0,0,0,.4); }
#modal-img-col .no-img{ width:100%; height:480px; background:var(--bg); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.8rem; }
#modal-info-col{ padding:22px 28px; }
@media (min-width:768px){ #modal-img-col{ position:sticky; top:0; align-self:flex-start; } }
/* 詳情：放寬彈窗與欄寬，避免裝備名被擠成一字一行 */
.modal-xl{ --bs-modal-width:1280px; }
#modal-info-col{ overflow-x:auto; }
.equip-table td.item-name{ min-width:7em; }
.equip-table td.src-cell{ min-width:9em; max-width:20em; }
/* 圖片可點擊放大 */
.modal-zoom-img{ cursor:zoom-in; }
.img-lightbox{ position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.92);
  display:none; align-items:center; justify-content:center; padding:24px; overflow:hidden; touch-action:none; }
.img-lightbox.show{ display:flex; }
.img-lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.6); user-select:none; -webkit-user-drag:none;
  transform-origin:center center; transition:transform .06s ease-out; will-change:transform; cursor:zoom-in; }
.lb-toolbar{ position:fixed; top:14px; right:16px; display:flex; gap:8px; z-index:2001; }
.lb-toolbar button{ width:38px; height:38px; border-radius:8px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.55); color:#fff; font-size:1.05rem; line-height:1; cursor:pointer; transition:background .15s; }
.lb-toolbar button:hover{ background:rgba(255,255,255,.18); }
.lb-hint{ position:fixed; bottom:16px; left:0; right:0; text-align:center; color:#9ca3af; font-size:.8rem; pointer-events:none; }

/* ── Equipment table (custom, themed) ── */
.equip-table{ width:100%; border-collapse:collapse; font-size:.92rem; }
.equip-table th{ background:var(--panel-bg); padding:9px 12px; text-align:left; color:var(--muted);
  font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; z-index:2; }
.equip-table td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
.equip-table tr:last-child td{ border-bottom:none; }
.equip-table tr:hover td{ background:var(--raise); }
.slot-badge{ display:inline-block; min-width:3.2em; padding:2px 8px; border-radius:4px; font-size:.78rem;
  font-weight:600; text-align:center; background:var(--panel-bg); color:var(--accent); white-space:nowrap; }
.item-name{ font-weight:600; }
.item-en{ font-size:.78rem; color:var(--muted); margin-top:2px; }

.src-ov-note{ font-size:.72rem; font-weight:400; color:var(--muted); margin-left:6px; }
.src-ov-row{ display:flex; align-items:center; gap:10px; padding:4px 0;
  border-top:1px solid var(--border); }

.src-ov-key{ flex:1 1 auto; font-size:.82rem; color:var(--accent2); cursor:pointer;
  overflow-wrap:anywhere; }
.src-ov-key:hover{ text-decoration:underline; }

  justify-content:flex-end; }
.src-ov-n{ font-size:.72rem; color:var(--muted); margin-left:4px; }
.unconfirmed{ color:var(--orange); }
.item-link{ cursor:pointer; border-bottom:1px dotted var(--muted); }
.link-user{ cursor:pointer; color:var(--accent2); border-bottom:1px dotted var(--accent2); }
.wearers-btn{ margin-top:.6rem; }
.item-link:hover{ color:var(--accent2); border-bottom-color:var(--accent2); }
.dye-cell{ white-space:nowrap; }
.dye-dash{ color:var(--muted); }
.dye-dot{ display:inline-block; width:11px; height:11px; border-radius:50%; border:1px solid color-mix(in srgb, var(--text-primary) 35%, transparent); vertical-align:-1px; margin-right:4px; }
.mirapri-dye-line{ margin-top:10px; font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.mirapri-dye-line .dye-cell{ color:var(--text); }
.modal-note{ background:var(--panel-bg); border-left:3px solid var(--accent); padding:8px 14px;
  border-radius:0 6px 6px 0; font-size:.88rem; color:var(--muted); margin-bottom:16px; }
.patch-tag{ display:inline-block; background:var(--raise); color:var(--text-secondary); border:1px solid var(--border);

.patch-cell{ text-align:center; white-space:nowrap; }
.source-tag{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:12px;
  font-size:.78rem; font-weight:500; white-space:normal; margin:1px 0; }
.src-raid{ background:color-mix(in srgb, var(--purple) 22%, transparent); color:var(--purple); border:1px solid color-mix(in srgb, var(--purple) 40%, transparent); }
.src-pvp{ background:color-mix(in srgb, var(--red) 20%, transparent); color:var(--red); border:1px solid color-mix(in srgb, var(--red) 40%, transparent); }
.src-store{ background:color-mix(in srgb, var(--orange) 20%, transparent); color:var(--orange); border:1px solid color-mix(in srgb, var(--orange) 40%, transparent); }
.src-event{ background:color-mix(in srgb, var(--green) 20%, transparent); color:var(--green); border:1px solid color-mix(in srgb, var(--green) 40%, transparent); }
.src-craft{ background:color-mix(in srgb, var(--blue) 20%, transparent); color:var(--blue); border:1px solid color-mix(in srgb, var(--blue) 40%, transparent); }

.src-gs{ background:var(--yellow-dim); color:var(--yellow); border:1px solid color-mix(in srgb, var(--yellow) 40%, transparent); }
.src-npc{ background:var(--raise); color:var(--text-secondary); border:1px solid var(--border); }
.src-ceremony{ background:color-mix(in srgb, var(--pink) 20%, transparent); color:var(--pink); border:1px solid color-mix(in srgb, var(--pink) 40%, transparent); }
.src-other{ background:var(--raise); color:var(--text-secondary); border:1px solid var(--border); }
.restrict-level,.restrict-job,.restrict-gender,.restrict-race{ display:inline-block; margin:0 4px 4px 0;
  padding:2px 8px; border-radius:10px; font-size:.7rem; background:var(--panel-bg);
  border:1px solid var(--border); color:var(--text); white-space:nowrap; }
.restrict-level{ border-color:var(--border-hover); }
.restrict-job{ border-color:#2563eb; color:var(--accent2); }
.restrict-gender{ border-color:color-mix(in srgb, var(--pink) 55%, transparent); color:var(--pink); }
.restrict-race{ border-color:color-mix(in srgb, var(--purple) 55%, transparent); color:var(--purple); }

/* ── Mobile: equipment table → stacked cards ── */
@media (max-width:640px){
  #modal-img-col{ padding:14px; }
  #modal-info-col{ padding:16px 14px; }
  .equip-table thead{ display:none; }
  .equip-table,.equip-table tbody{ display:block; width:100%; }
  .equip-table tr{ display:block; border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; padding:8px 12px 10px; background:var(--raise); }
  .equip-table tr:hover td{ background:none; }
  .equip-table td{ display:flex; gap:12px; justify-content:space-between; align-items:baseline; border:none; padding:5px 0; }
  .equip-table td::before{ content:attr(data-label); flex:0 0 auto; color:var(--muted); font-size:.7rem; font-weight:600; }
  .equip-table td:empty{ display:none; }
  .equip-table td.dye-cell{ white-space:normal; text-align:right; }
  .equip-table td.slot-cell{ display:block; padding:0 0 4px; }
  .equip-table td.slot-cell::before{ content:none; }
  .equip-table td.item-name{ display:block; font-size:.96rem; padding:2px 0 6px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .equip-table td.item-name::before{ content:none; }
}

/* ── 官方套裝分頁 ── */
/* color:#fff 疊在 --accent2（暗色是亮藍 #4fc3f7）上只有 2.0:1。改用 --bg-base：
   暗色＝深底色配亮藍(9.7)、亮色＝米白配深藍(5.5)，兩個主題都成立。
   這與站內 .ct-card.owned > .ct-check 用的是同一招（common.css）。 */
.view-btn.view-active{ background:var(--accent2)!important; border-color:var(--accent2)!important; color:var(--bg-base)!important; }
.set-icons{ min-height:120px; background:var(--panel-bg); display:flex; flex-wrap:wrap; gap:6px;
  align-items:center; justify-content:center; padding:14px 10px; }
.set-photo-note{ position:absolute; left:8px; bottom:8px; z-index:2; font-size:.68rem;
  background:rgba(0,0,0,.62); color:#d1d5db; border:1px solid rgba(255,255,255,.18);
  border-radius:10px; padding:2px 8px; pointer-events:none; max-width:85%; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.set-card-imgwrap{ position:relative; }
.set-icons img{ width:44px; height:44px; border-radius:6px; border:1px solid var(--border); background:var(--bg-base); }
.set-modal-icons img{ width:40px; height:40px; border-radius:6px; border:1px solid var(--border); background:var(--bg-base); vertical-align:middle; }
.mini-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.mini-chip{ display:inline-block; font-size:.68rem; padding:1px 7px; border-radius:9px;
  background:var(--panel-bg); border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
.chip-dye{ color:var(--purple); border-color:color-mix(in srgb, var(--purple) 40%, transparent); }
.chip-nodye{ color:var(--text-muted); }
.chip-mb{ color:var(--green); border-color:color-mix(in srgb, var(--green) 35%, transparent); }
.chip-set{ color:var(--accent2); border-color:rgba(110,159,212,.4); cursor:pointer; }
.chip-set:hover{ background:rgba(110,159,212,.15); }
.zh-missing{ color:var(--orange); font-size:.68rem; border:1px solid color-mix(in srgb, var(--orange) 40%, transparent); border-radius:9px; padding:1px 7px; white-space:nowrap; }
.empty-state{ text-align:center; color:var(--muted); padding:60px 20px; font-size:.95rem; }

/* ── 站內共用頁尾 ── */
.page-footer{ border-top:1px solid var(--border); padding:24px 16px 32px; text-align:center; margin-top:48px; }
.page-footer p{ font-size:.78rem; color:var(--muted); margin:0; }
.page-footer p + p{ margin-top:4px; }
.page-footer a{ color:var(--muted); text-decoration:none; transition:color .18s; }
.page-footer a:hover{ color:var(--accent); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>

function dyeHtml(name) {

// ── 圖片的兩層 ────────────────────────────────────────────────
// 以前卡片與彈窗共用同一份 619×1100／平均 90.6KB 的 JPEG，等於用彈窗規格去餵
// 桌機只有 230 CSS px 寬的格子——一頁 60 張卡要載 5.3MB 圖，比整份社群資料還重。
// 現在分兩層（產生方式見 scripts/build_image_tiers.py）：
//   卡片層 配裝圖片/卡片/…  .webp  寬 320px　約 23KB　→ 一頁 60 張只剩 1.4MB
//   彈窗層 配裝圖片/縮圖/…  .avif  原尺寸　　約 43KB　（同畫質比 WebP 再小三成）
// 官方套裝的 wiki 照本身就是 640px／32KB，沒有多做一層的價值，兩個函式都原檔直出。
function _thumbRel(img) {
  const rest = img.slice("配裝圖片/".length);
  return rest.toLowerCase().endsWith(".jpg") ? rest : rest + ".jpg";
}
function thumbOf(img) {
  if (!img || !img.startsWith("配裝圖片/")) return img;
  if (img.startsWith("配裝圖片/官方套裝/")) return img;
  return "配裝圖片/縮圖/" + _thumbRel(img).replace(/\.jpg$/i, ".avif");
}
function cardOf(img) {
  if (!img || !img.startsWith("配裝圖片/")) return img;
  if (img.startsWith("配裝圖片/官方套裝/")) return img;
  return "配裝圖片/卡片/" + _thumbRel(img).replace(/\.jpg$/i, ".webp");
}

// 卡片圖的退路鏈：卡片層 → 彈窗層 → 原圖 → No Image
function cardImgError(el, orig) {
  const s = el.getAttribute("src") || "";
  if (s.indexOf("配裝圖片/卡片/") === 0) { el.src = thumbOf(orig); return; }
  if (s.indexOf("配裝圖片/縮圖/") === 0) { el.src = orig; return; }
  const wrap = el.closest(".set-card-imgwrap");
  if (wrap) wrap.innerHTML = '<div class="card-noimg">No Image</div>';
  else el.outerHTML = '<div class="card-noimg">No Image</div>';
}

// 彈窗圖的退路鏈：原圖 → 彈窗層(AVIF) → 卡片層(WebP) → No Image
// mirapri 原圖 693MB 不進版控（會破 Pages 1GB 上限），線上一定走第二層；
// 第三層是給不支援 AVIF 的舊瀏覽器的——比較糊但看得到，總比破圖好。
function modalImgError(el, orig) {
  const s = el.getAttribute("src") || "";
  if (s.indexOf("配裝圖片/縮圖/") === -1 && s.indexOf("配裝圖片/卡片/") === -1) {
    el.src = thumbOf(orig); return;
  }
  if (s.indexOf("配裝圖片/縮圖/") === 0) { el.src = cardOf(orig); return; }
  el.parentElement.innerHTML = '<div class="no-img">No Image</div>';
}

function modalImg(img, alt) {
  if (!img) return '<div class="no-img">No Image</div>';
  return `<img class="modal-zoom-img" src="${esc(img)}" alt="${esc(alt)}" title="點擊放大"
    onclick="openLightbox(this.src)" style="width:100%;border-radius:8px;display:block"
    onerror="modalImgError(this,'${esc(img).replace(/'/g, "\\'")}')">`;
}

// 圖片放大（lightbox）＋ 縮放／平移
let lbScale = 1, lbX = 0, lbY = 0, lbDrag = false, lbSX = 0, lbSY = 0;
function lbApply() {
  const im = document.getElementById("img-lightbox-img");
  im.style.transform = `translate(${lbX}px, ${lbY}px) scale(${lbScale})`;
  im.style.cursor = lbScale > 1 ? "grab" : "zoom-in";
}
function lbReset() { lbScale = 1; lbX = 0; lbY = 0; lbApply(); }
function lbZoom(dir) {
  const f = dir > 0 ? 1.25 : 0.8;
  lbScale = Math.min(6, Math.max(1, lbScale * f));
  if (lbScale === 1) { lbX = 0; lbY = 0; }
  lbApply();
}
function openLightbox(src) {
  if (!src) return;
  document.getElementById("img-lightbox-img").src = src;
  lbReset();
  document.getElementById("img-lightbox").classList.add("show");
}
function closeLightbox() {
  document.getElementById("img-lightbox").classList.remove("show");
}
function lbBackdrop(ev) {
  if (ev.target === document.getElementById("img-lightbox")) closeLightbox();
}

// ── localStorage key（全站慣例：一律 ffxiv_ 開頭）────────────────
// 首頁的「全站進度備份」只打包 ffxiv_* 開頭的 key（見根 index.html 的 exportAll）。
// 本頁原本用 ff14_favs，等於使用者按了匯出、收藏卻整包沒被帶走，而且不會有任何提示。
// 2026-08-28 改名並補一次性搬遷，做法比照市場頁 tools/market/market.js 的 migrateLegacyKeys()：
// **只搬一次、舊 key 不刪**（使用者可能還開著舊分頁，刪了會兩邊互相蓋掉）。
const LS_FAVS = "ffxiv_favs";
const LS_FAVS_MIGRATED = "ffxiv_favs_migrated";
const LS_FAVS_LEGACY = "ff14_favs";

(function migrateFavStorage() {
  try {
    // ① 舊 key → 新 key（只在新 key 還沒有東西時搬，避免蓋掉新資料）
    if (localStorage.getItem(LS_FAVS) === null) {
      const legacy = localStorage.getItem(LS_FAVS_LEGACY);
      if (legacy !== null) localStorage.setItem(LS_FAVS, legacy);
    }
    // ② 官方套裝 id 改版的一次性換 id（原本記在 ff14_favs_migrated，沿用該旗標免得重跑）
    if (localStorage.getItem(LS_FAVS_MIGRATED) !== FAV_MIGRATION_TAG &&
        localStorage.getItem("ff14_favs_migrated") !== FAV_MIGRATION_TAG) {
      const raw = JSON.parse(localStorage.getItem(LS_FAVS) || "[]");
      let moved = 0;
      const next = raw.map(id => {
        const to = FAV_ID_MIGRATION[id];
        if (to) { moved++; return to; }
        return id;
      });
      if (moved) localStorage.setItem(LS_FAVS, JSON.stringify([...new Set(next)]));
    }
    localStorage.setItem(LS_FAVS_MIGRATED, FAV_MIGRATION_TAG);
  } catch (e) { /* localStorage 不可用就跳過，不影響其他功能 */ }
})();

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(LS_FAVS) || "[]")); } catch (e) {}

function saveFavs() {
  const val = JSON.stringify([...favs]);
  try { localStorage.setItem(LS_FAVS, val); } catch (e) {}
  // 舊 key 一併寫，讓還停在舊版快取（SW）的分頁不會看到收藏倒退。
  // 下一次改版可以拿掉這行，屆時舊快取早已過期。
  try { localStorage.setItem(LS_FAVS_LEGACY, val); } catch (e) {}
}

// 徽章 chips（可染/可交易/所屬套裝）——建置期已把 iid/dye/mb 蓋進裝備
function badgeChips(p, withSet) {
  if (p.iid === undefined && p.id === undefined) return "";
  const iid = p.iid !== undefined ? p.iid : p.id;
  const chips = [];
  if (p.dye !== undefined)
    chips.push(p.dye > 0
      ? `<span class="mini-chip chip-dye">🎨×${p.dye}</span>`
      : `<span class="mini-chip chip-nodye">${currentLang === "en" ? "no dye" : "不可染"}</span>`);
  if (p.mb) chips.push(`<span class="mini-chip chip-mb">${currentLang === "en" ? "tradable" : "可交易"}</span>`);
  if (withSet) {
    const s = ITEM_SETS_BY_ID.get(Number(iid)) ||
              ITEM_SETS_BY_NAME.get(p.zh || "") || ITEM_SETS_BY_NAME.get(p.ja || p.name || "");
    if (s) chips.push(`<span class="mini-chip chip-set" title="查看官方套裝"
      onclick="event.stopPropagation();viewSet('${s.id}')">📖 ${esc(setDisplayName(s))}</span>`);
  }
  return chips.length ? `<div class="mini-chips">${chips.join("")}</div>` : "";
}

function setDisplayName(s) {
  return (currentLang === "en" ? (s.name_en || s.name_ja) : (s.name_zh || s.name_ja || s.name_en)) || s.id;
}
function setVisibleIcons(s) {
  const VIS = ["頭部", "上身", "手部", "腿部", "腳部"];
  return s.pieces.filter(p => VIS.includes(p.slot) && p.icon);
}
function toggleFav(id, ev) {
  if (ev) ev.stopPropagation();
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
  if (favOnly) applyFilters(); else renderGrid();
  syncModalFav();
}
function syncModalFav() {
  const btn = document.getElementById("modal-fav-btn");
  const e = filtered[currentIdx];
  if (!btn || !e) return;
  const on = favs.has(e.id);
  btn.textContent = on ? "⭐ 已收藏" : "☆ 收藏";
  btn.classList.toggle("active", on);
}

// 單件 job 欄位（繁中群組／單一職業／工匠，或 mirapri 的英文代碼）→ 職業代碼集合。
// 無法判定（空／未知）回傳 null＝不設限，避免資料缺漏造成誤判。
function jobCodes(raw){
  const s = (raw||"").replace(/[Ll][Vv]\.?\s*[\d?]+/g,"").trim();
  if(!s || s==="(none)") return null;
  const out = new Set();
  s.split(/[、,，\/\s]+/).forEach(tok=>{
    tok = tok.trim(); if(!tok) return;
    if(tok==="待確認" || tok==="—") return;            // 佔位字＝資料未填，不當成職業限制
    if(JOB_CODES[tok]) JOB_CODES[tok].split(" ").forEach(c=>out.add(c));
    else if(/^[A-Z]{2,3}$/.test(tok)) out.add(tok);   // mirapri 英文職業代碼
    else out.add("?"+tok);                             // 未知工匠等 → 不透明 token（同名才相容）
  });
  return out.size ? out : null;
}
// 需存在單一職業可同時穿戴整套（所有件的職業代碼交集非空）＝繁中版可實際幻化
function jobCompatOK(ps){
  let compat = null;
  for(const p of ps){
    const s = jobCodes(p.job);
    if(!s) continue;
    compat = compat===null ? s : new Set([...compat].filter(x=>s.has(x)));
  }
  return compat===null || compat.size>0;
}

// 整套沒有任何職業限制＝每件都是「全職業」（job 空白＝資料未填，不當限制但也不能單獨成立）
function isAllJob(ps) {
  const jobs = ps.map(p => (p.job || "").trim());
  return jobs.some(j => j === ALL_JOB) && jobs.every(j => j === "" || j === ALL_JOB);
}

function piecesOf(e) {
  const arr = e.type === "mirapri" ? (e.equipments || []) : (e.pieces || []);
  return arr.filter(p => p && typeof p !== "string");
}

// 為每套計算：tags（職業＋取得方式）、tw（繁中版全件可得）、maxPatch（排序用）
function annotate(e) {
  const ps = piecesOf(e);
  if (!e.tags || !e.tags.length) {
    const tags = new Set();
    ps.forEach(p => {
      const job = p.job || "";
      for (const [tag, jobs] of Object.entries(JOB_TAG_MAP))
        if (jobs.some(j => job.includes(j))) tags.add(tag);
      if (ST_TAG_SET.has(p.st)) tags.add(p.st);
    });
    if (isAllJob(ps)) tags.add("alljob");
    e.tags = [...tags];
  }
  e.tw = ps.length > 0 && ps.every(p => (p.zh || "").trim() !== "") && jobCompatOK(ps);
  e.maxPatch = ps.reduce((mx, p) => {
    const v = parseFloat(p.patch); return isNaN(v) ? mx : Math.max(mx, v);
  }, 0);
  return e;
}

// ── 延遲載入的三份資料檔 ───────────────────────────────────────
// 順序由「使用者現在在看哪個檢視」決定，不是寫死的。深連結 ?v=sets 進來時，
// 先載 3.7MB 的官方套裝，別讓使用者乾等他根本沒要看的 11.9MB 社群資料。
// item_sources 永遠排最後——篩選與彈窗都吃它，但沒有它時前端會退回單一來源，
// 不會壞掉，所以它可以最後到。
function startLoading() {
  const chain = viewMode === "sets"
    ? () => loadSets(() => loadItemDb(() => loadMirapri(() => loadItemSources())))
    : () => loadItemDb(() => loadMirapri(() => loadSets(() => loadItemSources())));
  chain();
}

// ── 社群配裝的裝備字典（item_db.js）───────────────────────────
// 6,860 套用到的 35,249 件裝備其實只有 6,347 個不重複道具，而 zh／日文名／部位／
// 版本／等級／職業／取得方式／可染／可交易全都是**道具的屬性、不是這一套的屬性**。
// 以前每件抄一份，mirapri_outfits.js 因此有 11.9MB（gzip 1.95MB）、光編譯就 235ms。
// 現在共通屬性放這份字典，配裝那份只留 [iid, 染色1, 染色2, 旗標, 例外]。
// 格式與編碼端的定義在 scripts/mira_codec.py，**欄位順序兩邊必須一致**。
let ITEM_DB = null;
function loadItemDb(next) {
  if (ITEM_DB) { next && next(); return; }
  if (_inflight.has("db")) return;
  _inflight.add("db");
  const s = document.createElement("script");
  s.src = "item_db.js";
  s.onload = () => {
    if (typeof _ITEM_DB !== "undefined") ITEM_DB = _ITEM_DB;
    next && next();
  };
  s.onerror = () => { next && next(); };   // 沒有字典時 rehydrate 會退回只有 iid 的資料
  document.head.appendChild(s);
}

const _DB_POOLED = new Set(["slot", "patch", "lv", "job", "source", "st"]);

// 把 item_db.js ＋ 緊湊編碼解回原本每件一個完整物件的形狀。
// 刻意還原成**和以前一模一樣的結構**，這樣渲染、篩選、搜尋那 1,400 行完全不用動。
// 解碼規則必須與 scripts/mira_codec.py 的 rehydrate_mirapri() 一致。
function rehydrateMirapri(compact, db) {
  const fields = (db && db.f) || [];
  const pools = (db && db.p) || {};
  const dyes = compact.dy || [];
  const decDye = i => (i ? dyes[i - 1] : "—");

  const items = new Map();
  for (const iid in (db && db.d) || {}) {
    const row = db.d[iid], rec = {};
    for (let k = 0; k < fields.length; k++) {
      const f = fields[k], v = row[k];
      rec[f] = _DB_POOLED.has(f) ? (v ? pools[f][v - 1] : "")
             : f === "mb" ? !!v : v;
    }
    items.set(Number(iid), rec);
  }

  return (compact.o || []).map(row => {
    const m = row.m || "";
    const equips = (row.q || []).map(p => {
      if (!Array.isArray(p)) return p;          // 極少數是純字串，原樣保留
      const iid = p[0] || 0;
      const base = iid ? items.get(iid) : null;
      const e = base ? Object.assign({}, base) : {};
      const ovr = (p.length > 4 && p[4] && typeof p[4] === "object") ? p[4] : null;
      if (ovr) for (const k in ovr) {
        if (ovr[k] === null) delete e[k];       // null ＝ 這件沒有這個欄位
        else e[k] = ovr[k];
      }
      e.dye1 = decDye(p.length > 1 ? p[1] : 0);
      e.dye2 = decDye(p.length > 2 ? p[2] : 0);
      if (p.length > 3 && ((p[3] || 0) & 1)) e.recon = true;
      if (iid) e.iid = iid;
      return e;
    });
    return {
      type: "mirapri", id: row.i || "", name: row.n || "", color: row.c || "",
      gender: row.g || "", race: row.r || "",
      image: (m.indexOf("/") >= 0 || !m) ? m : "配裝圖片/mirapri/" + m,
      tags: [], note: "", timestamp: row.t || "",
      equipments: equips,
      dyes: (row.d || []).map(decDye),
      hasPieceDyes: !!row.h,
    };
  });
}

// 已經在飛的請求不要再送一次（切檢視時會插隊要求優先載入，見 setView）
const _inflight = new Set();

function loadMirapri(next) {
  if (miraLoaded) { next && next(); return; }
  if (_inflight.has("mira")) return;
  _inflight.add("mira");
  const s = document.createElement("script");
  s.src = "mirapri_outfits.js";
  s.onload = () => {
    miraLoaded = true;
    if (typeof _MIRAPRI_RAW !== "undefined") {
      // v2＝item_db.js 共用字典＋緊湊編碼（見 rehydrateMirapri）；
      // 陣列＝舊格式，直接用（讓還沒重跑 build_site.py 的環境不會突然壞掉）
      const raw = Array.isArray(_MIRAPRI_RAW)
        ? _MIRAPRI_RAW : rehydrateMirapri(_MIRAPRI_RAW, ITEM_DB);
      // ALL_OUTFITS 的排法＝精選在前、社群**新→舊**，這是「⭐ 精選優先」那個
      // 排序模式直接用的順序（sortFiltered 對它不做任何 sort）。
      // 資料檔本身是投稿時間遞增（最舊的在最前面），不先排一次的話「精選優先」
      // 會變成「精選 → 2024 年的舊投稿」。排序鍵是 timestamp 字串
      //（YYYY-MM-DD hh:mm:ss，定長可直接字串比大小），不會因為重新篩選而變動。
      const mira = raw.map(annotate);
      mira.sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
      ALL_OUTFITS = ALL_OUTFITS.concat(mira);
    }
    populateSrcDetail();
    applyFilters();
    restorePage();          // 網址指定的頁碼／套裝（資料延遲載入，載完才回得去）
    next && next();
  };
  s.onerror = () => { miraLoaded = true; updateSubtitle(); next && next(); };
  document.head.appendChild(s);
}

function loadSets(next) {
  if (setsLoaded) { next && next(); return; }
  if (_inflight.has("sets")) return;
  _inflight.add("sets");
  const s = document.createElement("script");
  s.src = "official_sets.js";
  s.onload = () => {
    setsLoaded = true;
    if (typeof _SETS_RAW !== "undefined") {
      SETS = _SETS_RAW.map(e => {
        e.maxPatch = parseFloat(e.patch) || 0;
        return e;
      });
      // 反查索引：mirage 層優先（同件同屬多套時以官方箱為準）
      for (const st of SETS) {
        for (const p of st.pieces) {
          const cur = ITEM_SETS_BY_ID.get(p.id);
          if (!cur || (cur.layer !== "mirage" && st.layer === "mirage"))
            ITEM_SETS_BY_ID.set(p.id, st);
          for (const nm of [p.zh, p.ja]) {
            if (!nm) continue;
            const c2 = ITEM_SETS_BY_NAME.get(nm);
            if (!c2 || (c2.layer !== "mirage" && st.layer === "mirage"))
              ITEM_SETS_BY_NAME.set(nm, st);
          }
        }
      }
    }
    if (viewMode === "sets") { populateSrcDetail(); applyFilters(); restorePage(); }
    next && next();
  };
  s.onerror = () => { setsLoaded = true; next && next(); };
  document.head.appendChild(s);
}

// 從彈窗的「所屬套裝」chip 跳到官方套裝
// Bootstrap modal 關閉有動畫：hide 進行中呼叫 show 會被忽略，須等 hidden 事件再開
function viewSet(setId) {
  const open = () => {
    setView("sets");
    resetFilters();
    const idx = filtered.findIndex(e => e.id === setId);
    if (idx >= 0) openModal(idx);
  };
  const modalEl = document.getElementById("modal");
  if (modalEl.classList.contains("show")) {
    modalEl.addEventListener("hidden.bs.modal", open, { once: true });
    closeModal();
  } else {
    open();
  }
}

// ════════════════════════════════════════════════════════
// FILTER
// ════════════════════════════════════════════════════════
// ── 取得方式細項（副本名／商人名／兌換貨幣…）──
// 一件裝備常有多種取法，但三份資料檔每件只留一種（pipeline.py `_best()`／
// build_sets.py `fmt_piece_source()` 的截斷），照那個篩會「拿得到卻找不到」。
// 完整清單放在 item_sources.js（裝備 ID → 正規化來源鍵），以 ID 外連，
// 三份資料共用同一個鍵空間——同一個副本不會再因為兩種寫法變成兩個選項。
let ITEM_SRC = null;   // Map<裝備ID, string[]>
let SK_GEN   = 0;      // item_sources 載入後 +1，讓已快取的 _sk 重算

function loadItemSources(next) {
  if (ITEM_SRC) { next && next(); return; }
  if (_inflight.has("src")) return;
  _inflight.add("src");
  const s = document.createElement("script");
  s.src = "item_sources.js";
  s.onload = () => {
    if (typeof _ITEM_SOURCES !== "undefined") {
      const keys = _ITEM_SOURCES.k;
      ITEM_SRC = new Map();
      for (const [id, arr] of Object.entries(_ITEM_SOURCES.i))
        ITEM_SRC.set(Number(id), arr.map(i => keys[i]));
    }
    SK_GEN++;
    populateSrcDetail();
    applyFilters();       // 分類與細項都依賴這份表，載入後一律重算
    restorePage();
    next && next();
  };
  s.onerror = () => { next && next(); };
  document.head.appendChild(s);
}

function outfitPieces(e) {
  return e.type === "mirapri" ? (e.equipments || []) : (e.pieces || []);
}

// 顯示字串 →（近似的）來源鍵。只在 item_sources 查不到該裝備時當退路
// （幻化套裝箱、商城／活動套等 sources.json 沒有的東西）。
function srcKeyOf(s) {
  if (!s) return "";
  const m = /^([\p{Extended_Pictographic}️]+)\s*([\s\S]*)$/u.exec(String(s).trim());
  const emoji = m ? m[1] : "";
  let rest = (m ? m[2] : String(s)).trim();
  rest = rest.replace(/^(副本掉落|兌換|任務獎勵)\s*[:：]\s*/, "")
             .replace(/\s*等\d+處.*$/, "")
             .replace(/[（(][\s\S]*$/, "")
             .replace(/[×x]\s*[\d,]+[\s\S]*$/i, "")
             .replace(/\s+[\d,]+\s*Gil$/i, "")
             .trim();
  return (emoji + rest).trim();
}

// 一件裝備的全部來源鍵：優先查 item_sources（完整），查不到才退回顯示字串
function pieceSrcKeys(p) {
  if (!p || typeof p !== "object") return [];
  const id = p.iid !== undefined ? p.iid : p.id;
  const full = ITEM_SRC && id !== undefined ? ITEM_SRC.get(Number(id)) : null;
  if (full && full.length) return full;
  const k = srcKeyOf(p.source || p.src || "");
  return k ? [k] : [];
}

// 一套（配裝／官方套裝）的全部來源鍵，結果快取在 _sk
function entrySrcKeys(e) {
  if (e._sk && e._skGen === SK_GEN) return e._sk;
  const set = new Set();
  for (const p of outfitPieces(e)) for (const k of pieceSrcKeys(p)) set.add(k);
  // 官方套裝整套層級的來源（💎商城、🗓️活動名…）在逐件資料裡查不到，補上
  if (e.type === "set") {
    const k = srcKeyOf(e.source);
    if (k) set.add(k);
  }
  e._sk = [...set];
  e._skGen = SK_GEN;
  return e._sk;
}

// 來源鍵 → st 分類（與 build_site.py 的 ST_KEYWORDS／EMOJI_ST 同一套規則，改這裡要同步後端）
// 關鍵字優先於 emoji，順序即優先序——「寶圖」必須排第一（箱名會帶別的玩法字眼）
const KEY_ST_KEYWORDS = [["寶圖","other"],
  ["伊修加德重建","special"],["無人島","special"],["宇宙探索","special"],
  ["友好部族","special"],["友好部落","special"],
  ["成就","other"],
  ["橙票","scrip"],["紫票","scrip"],["白票","scrip"],["黃票","scrip"],["綠票","scrip"],
  ["幻化套裝箱","other"]];
const KEY_EMOJI_ST = [["🗡️","raid"],["🗺️","raid"],["🎯","raid"],["📋","quest"],
  ["🛒","npc"],["🪙","token"],["🔶","scrip"],["🟣","scrip"],["🔨","craft"],
  ["🎲","gs"],["⚔️","pvp"],["💎","store"],["🗓️","event"],["💒","event"],
  ["🛡️","other"],["🚢","other"],["🎁","other"],["🏆","other"]];
function stOfKey(k) {
  for (const [kw, st] of KEY_ST_KEYWORDS) if (k.includes(kw)) return st;
  for (const [emo, st] of KEY_EMOJI_ST) if (k.startsWith(emo)) return st;
  return "other";
}

// 一套涵蓋的全部 st 分類。**分類按鈕與細項下拉必須吃同一份來源**，否則會互斥：
// 「夢幻套裝」整套來源是 🗓️Starlight Celebration（st=event），但它的件是用
// 🪙夢幻帽布料 兌換——舊版分類只看整套那一種 st，選「🪙代幣兌換」＋細項
// 「🪙夢幻帽布料」會篩出 0 筆（2026-07-19 使用者回報）。
function entryStSet(e) {
  if (e._st && e._stGen === SK_GEN) return e._st;
  const set = new Set(entrySrcKeys(e).map(stOfKey));
  // 退路：item_sources 沒收錄的裝備，保留原本由單一 source 推得的分類
  if (e.type === "set") { if (e.st) set.add(e.st); }
  else for (const t of (e.tags || [])) if (ST_TAG_SET.has(t)) set.add(t);
  e._st = set;
  e._stGen = SK_GEN;
  return e._st;
}

function matchSrcTags(e) {
  if (!srcTags.size) return true;
  const sts = entryStSet(e);
  return [...srcTags].some(t => sts.has(t));
}

function collectSources() {
  const cnt = new Map();   // 來源鍵 → {n, st}
  const list = viewMode === "sets" ? SETS : ALL_OUTFITS;
  for (const e of list) {
    for (const k of entrySrcKeys(e)) {
      const rec = cnt.get(k) || { n: 0, st: stOfKey(k) };
      rec.n++;
      cnt.set(k, rec);
    }
  }
  return cnt;
}

// ── 取得方式細項挑選器 ────────────────────────────────────────
// 資料放在 SRC_OPTIONS，**選項只有展開時才進 DOM**（原本 828 個 <option> 常駐，
// 而且原生 select 在手機上只能一路捲，等於找不到東西）。
let SRC_OPTIONS = [];          // [{key, n, st}]，已依 ST_ORDER 分組、組內依套數排序
const SRC_PICK_LIMIT = 120;    // 一次最多畫這麼多列，其餘請使用者再打關鍵字
let srcPickCursor = -1;        // 鍵盤選取位置（對應目前畫出來的列）

function populateSrcDetail() {
  const groups = new Map();
  for (const [src, rec] of collectSources()) {
    if (srcTags.size && !srcTags.has(rec.st)) continue;
    if (!groups.has(rec.st)) groups.set(rec.st, []);
    groups.get(rec.st).push([src, rec.n]);
  }
  SRC_OPTIONS = [];
  for (const st of ST_ORDER) {
    const items = groups.get(st);
    if (!items) continue;
    items.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"));
    for (const [key, n] of items) SRC_OPTIONS.push({ key, n, st });
  }
  // 選中的細項不在清單裡（換了檢視／分類，或資料還在載入）→ 補一筆撐著，
  // 不要把 srcDetail 清掉：分享連結進站時資料尚未載完，清掉就還原不回來了
  if (srcDetail && !SRC_OPTIONS.some(o => o.key === srcDetail))
    SRC_OPTIONS.unshift({ key: srcDetail, n: 0, st: "_cur" });
  renderSrcPickBtn();
  if (!document.getElementById("src-detail-pop").hidden) renderSrcPickList();
}

function renderSrcPickBtn() {
  const btn = document.getElementById("src-detail-btn");
  const label = document.getElementById("src-detail-label");
  label.textContent = srcDetail ||
    (currentLang === "en" ? "Source detail: all" : "取得方式細項：全部");
  btn.classList.toggle("on", !!srcDetail);
  btn.title = srcDetail
    ? (currentLang === "en" ? "Source detail: " : "取得方式細項：") + srcDetail
    : "細分到單一取得方式（副本名、商人、兌換貨幣…）；隨上方分類與檢視自動更新";
}

function renderSrcPickList() {
  const list = document.getElementById("src-detail-list");
  const kw = document.getElementById("src-detail-q").value.trim().toLowerCase();
  const hits = kw ? SRC_OPTIONS.filter(o => o.key.toLowerCase().indexOf(kw) >= 0) : SRC_OPTIONS;
  const shown = hits.slice(0, SRC_PICK_LIMIT);
  let html = `<button type="button" class="srcpick-opt" role="option" data-key=""
    aria-selected="${srcDetail ? "false" : "true"}">${currentLang === "en" ? "All sources" : "全部取得方式"}</button>`;
  let lastSt = null;
  for (const o of shown) {
    if (o.st !== lastSt) {
      lastSt = o.st;
      const gl = o.st === "_cur"
        ? (currentLang === "en" ? "current" : "目前選擇")
        : (ST_GROUP_LABEL[o.st] || o.st);
      html += `<div class="srcpick-group">${esc(gl)}</div>`;
    }
    html += `<button type="button" class="srcpick-opt" role="option" data-key="${esc(o.key)}"
      aria-selected="${o.key === srcDetail ? "true" : "false"}">${esc(o.key)}${
      o.n ? `<span class="n">${o.n}</span>` : ""}</button>`;
  }
  if (hits.length > shown.length)
    html += `<div class="srcpick-more">${currentLang === "en"
      ? `+${hits.length - shown.length} more — type to narrow`
      : `還有 ${hits.length - shown.length} 項，再打幾個字縮小範圍`}</div>`;
  if (!hits.length)
    html += `<div class="srcpick-more">${currentLang === "en" ? "no match" : "沒有符合的取得方式"}</div>`;
  list.innerHTML = html;
  srcPickCursor = -1;
}

function openSrcPick() {
  const pop = document.getElementById("src-detail-pop");
  if (!pop.hidden) return;
  pop.hidden = false;
  document.getElementById("src-detail-btn").setAttribute("aria-expanded", "true");
  document.getElementById("src-detail-q").value = "";
  renderSrcPickList();
  document.getElementById("src-detail-q").focus();
}

function closeSrcPick(refocus) {
  const pop = document.getElementById("src-detail-pop");
  if (pop.hidden) return;
  pop.hidden = true;
  document.getElementById("src-detail-btn").setAttribute("aria-expanded", "false");
  if (refocus) document.getElementById("src-detail-btn").focus();
}

function pickSrcDetail(key) {
  srcDetail = key;
  closeSrcPick(true);
  renderSrcPickBtn();
  applyFilters();
  syncURL(true);
}

function moveSrcPickCursor(d) {
  const opts = [...document.querySelectorAll("#src-detail-list .srcpick-opt")];
  if (!opts.length) return;
  if (srcPickCursor >= 0) opts[srcPickCursor].classList.remove("cursor");
  srcPickCursor = (srcPickCursor + d + opts.length) % opts.length;
  opts[srcPickCursor].classList.add("cursor");
  opts[srcPickCursor].scrollIntoView({ block: "nearest" });
}

function matchSrcDetail(e) {
  return !srcDetail || entrySrcKeys(e).includes(srcDetail);
}

// ── 色系 ───────────────────────────────────────────────────────
// 站上實際用到 150 種染色名。繁中染色名是有規律的複合詞（{修飾}{色}），
// **用最後一個字判色系**就能對上絕大多數；對不上的列在 DYE_FAMILY_FIX。
// 這張表只用來分類，不是顯示用的權威名稱——顯示一律用原本的染色名。
const DYE_TAIL_FAMILY = {
  白:"white", 黑:"black", 灰:"grey", 銀:"grey",
  紅:"red", 粉:"pink", 橙:"orange", 黃:"yellow", 金:"yellow",
  綠:"green", 藍:"blue", 紫:"purple", 莓:"purple",
  棕:"brown", 銅:"brown", 褐:"brown",
};
const DYE_FAMILY_FIX = {
  "哥布林":"green", "薰衣草":"purple", "巧克力":"brown", "仙人掌怪":"green",
  "仙子梅":"purple", "金屬靛":"blue", "金屬紅寶石":"red", "金屬寶石紅":"red",
};
const DYE_FAMILY_LABEL = {
  white:"白", black:"黑", grey:"灰銀", red:"紅", pink:"粉", orange:"橙",
  yellow:"黃金", green:"綠", blue:"藍", purple:"紫", brown:"棕",
};
function dyeFamily(name) {
  if (!name || name === "—") return "";
  if (DYE_FAMILY_FIX[name]) return DYE_FAMILY_FIX[name];
  return DYE_TAIL_FAMILY[name.slice(-1)] || "";
}
// 一套用到的色系（逐件 dye1/dye2 ＋ 整套 dyes fallback）。官方套裝沒有染色資料。
function entryDyeFamilies(e) {
  if (e._df) return e._df;
  const fam = new Set();
  for (const p of outfitPieces(e)) {
    if (!p || typeof p !== "object") continue;
    for (const d of [p.dye1, p.dye2]) { const f = dyeFamily(d); if (f) fam.add(f); }
  }
  for (const d of (e.dyes || [])) { const f = dyeFamily(d); if (f) fam.add(f); }
  e._df = fam;
  return fam;
}

// ── 「這套官方套裝有哪些玩家配法」──────────────────────────────
// 官方套裝的每件裝備 id ↔ 社群/精選配裝的 iid 是同一個鍵空間（62% 的社群用件
// 屬於某個官方套裝）。反查就是「這套配裝有沒有用到該套裝的任一件」。
let itemFilter = null;   // {label, setId, ids:Set<number>}
function matchItemFilter(e) {
  if (!itemFilter) return true;
  for (const p of outfitPieces(e)) {
    if (!p || typeof p !== "object") continue;
    const id = p.iid !== undefined ? p.iid : p.id;
    if (id !== undefined && itemFilter.ids.has(Number(id))) return true;
  }
  return false;
}
function syncItemFilterChip() {
  const chip = document.getElementById("item-filter-chip");
  chip.classList.toggle("d-none", !itemFilter);
  if (itemFilter) chip.textContent = itemFilter.label;
}
// 從官方套裝彈窗跳去看玩家配法
function viewWearers(setId) {
  const st = SETS.find(s => s.id === setId);
  if (!st) return;
  const open = () => {
    itemFilter = {
      setId,
      label: (currentLang === "en" ? "wearing: " : "有穿：") + setDisplayName(st),
      ids: new Set(st.pieces.map(p => Number(p.id))),
    };
    setView("outfits");   // 已在配裝檢視時它會提早返回，下面自己補一次即可
    syncItemFilterChip();
    applyFilters();
    syncURL(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const modalEl = document.getElementById("modal");
  if (modalEl.classList.contains("show")) {
    modalEl.addEventListener("hidden.bs.modal", open, { once: true });
    closeModal();
  } else open();
}
function clearItemFilter() {
  itemFilter = null;
  syncItemFilterChip();
  applyFilters();
  syncURL(true);
}

// 裝備 id → 用到它的配裝索引（建一次）。給「幾套用到」的計數用，
// 直接掃 6,955 套也不會慢，但這個數字每開一次官方套裝彈窗就要算一遍。
let ITEM_TO_OUTFITS = null;
function itemOutfitIndex() {
  if (ITEM_TO_OUTFITS && ITEM_TO_OUTFITS._gen === ALL_OUTFITS.length) return ITEM_TO_OUTFITS;
  const idx = new Map();
  ALL_OUTFITS.forEach((e, i) => {
    const seen = new Set();
    for (const p of outfitPieces(e)) {
      if (!p || typeof p !== "object") continue;
      const id = Number(p.iid !== undefined ? p.iid : p.id);
      if (!id || seen.has(id)) continue;
      seen.add(id);
      let arr = idx.get(id);
      if (!arr) { arr = []; idx.set(id, arr); }
      arr.push(i);
    }
  });
  idx._gen = ALL_OUTFITS.length;
  ITEM_TO_OUTFITS = idx;
  return idx;
}
function countWearers(st) {
  if (!st || !st.pieces) return 0;
  const idx = itemOutfitIndex();
  const seen = new Set();
  for (const p of st.pieces) for (const i of (idx.get(Number(p.id)) || [])) seen.add(i);
  return seen.size;
}

// ── 熱門單品 ───────────────────────────────────────────────────
// 6,347 件不重複裝備裡有 44% 只被 1 套用過，長尾極長；反過來說前幾十件就代表了
// 「大家都在用什麼」。這是進站沒有目標時最好用的入口，資料現成、算一次即可。
let HOT_ITEMS = null;
function computeHotItems() {
  const cnt = new Map();   // iid → {n, zh, ja, icon}
  for (const e of ALL_OUTFITS) {
    const seen = new Set();          // 同一套用到同一件只算一次
    for (const p of outfitPieces(e)) {
      if (!p || typeof p !== "object") continue;
      const id = p.iid !== undefined ? p.iid : p.id;
      if (id === undefined || seen.has(id)) continue;
      seen.add(id);
      const rec = cnt.get(id) || { n: 0, zh: "", ja: "", id: Number(id) };
      rec.n++;
      if (!rec.zh && p.zh) rec.zh = p.zh;
      if (!rec.ja && (p.ja || p.name)) rec.ja = p.ja || p.name;
      cnt.set(id, rec);
    }
  }
  // icon 只有官方套裝那份帶得到；載完才補得齊，所以在這裡查而不是預先存
  for (const rec of cnt.values()) {
    const st = ITEM_SETS_BY_ID.get(rec.id);
    if (st) { const p = st.pieces.find(x => Number(x.id) === rec.id); if (p && p.icon) rec.icon = p.icon; }
  }
  return [...cnt.values()].sort((a, b) => b.n - a.n).slice(0, 60);
}
function openHotItems() {
  if (!HOT_ITEMS || HOT_ITEMS._gen !== ALL_OUTFITS.length) {
    HOT_ITEMS = computeHotItems();
    HOT_ITEMS._gen = ALL_OUTFITS.length;
  }
  const total = ALL_OUTFITS.length;
  document.getElementById("hot-modal-sub").textContent = currentLang === "en"
    ? `Most-used pieces across ${total} outfits — click one to find every outfit using it`
    : `${total} 套配裝裡最常被用到的單品，點一件即以它反查所有配裝`;
  document.getElementById("hot-modal-body").innerHTML =
    `<div class="hot-grid">` + HOT_ITEMS.map((r, i) => {
      const nm = currentLang === "en" ? (r.ja || r.zh) : (r.zh || r.ja);
      const icon = r.icon
        ? `<img src="配裝圖片/icons/${r.icon}.png" alt="" loading="lazy" onerror="this.style.display='none'">`
        : "";
      return `<button type="button" class="hot-row" onclick="searchItem('${esc(nm).replace(/'/g, "\\'")}')">
        <span class="hot-rank">${i + 1}</span>${icon}
        <span class="nm">${esc(nm)}</span><span class="ct">${r.n}</span></button>`;
    }).join("") + `</div>`;
  bootstrap.Modal.getOrCreateInstance(document.getElementById("hot-modal")).show();
}

// ── 搜尋比對 ───────────────────────────────────────────────────
// haystack 只算一次並快取在該筆上。原本每個按鍵都對 6,860 套重新組一次小寫字串
// （含 35,249 件裝備名），實測 18ms／鍵；快取後 1.3ms／鍵。
// 取得方式那半段依賴延遲載入的 item_sources.js，所以跟著 SK_GEN 走，載完會重算。
function hayMatch(e, qLow) {
  if (e._hay === undefined) {
    let parts;
    if (e.type === "set") {
      parts = [e.name_zh, e.name_ja, e.name_en, e.source,
               ...(e.pieces || []).map(p => (p.zh || "") + " " + (p.ja || "") + " " + (p.en || ""))];
    } else if (e.type === "mirapri") {
      parts = [e.name, e.color,
               ...(e.equipments || []).map(x => typeof x === "string" ? x : ((x.zh || "") + " " + (x.name || "")))];
    } else {
      // 精選：日文名也納入，與社群檢視一致（社群的 x.name 就是日文名）
      parts = [e.name, e.color,
               ...(e.pieces || []).map(p => (p.zh || "") + " " + (p.en || "") + " " + (p.ja || ""))];
    }
    e._hay = parts.filter(Boolean).join(" ").toLowerCase();
  }
  if (e._haySrcGen !== SK_GEN) {
    e._haySrc = entrySrcKeys(e).join(" ").toLowerCase();
    e._haySrcGen = SK_GEN;
  }
  return e._hay.indexOf(qLow) >= 0 || e._haySrc.indexOf(qLow) >= 0;
}

function applyFilters() {
  const qLow = q.toLowerCase();
  if (viewMode === "sets") {
    filtered = SETS.filter(e => {
      if (favOnly && !favs.has(e.id)) return false;
      if (twOnly && !e.tw) return false;
      if (!matchSrcTags(e)) return false;
      if (!matchSrcDetail(e)) return false;
      if (jobTags.size && ![...jobTags].some(t => (e.tags || []).includes(t))) return false;
      if (qLow && !hayMatch(e, qLow)) return false;
      return true;
    });
    sortFiltered();
    currentPage = 1;
    renderGrid();
    updateSubtitle();
    return;
  }
  filtered = ALL_OUTFITS.filter(e => {
    // Gender filter（精選 + 社群都套用）
    if (miraFilters.gender) {
      if (miraFilters.gender === "unknown") {
        if (e.gender) return false;
      } else {
        // "both" 套裝（e.gender==="both"）在任何性別篩選下都顯示
        if (e.gender !== miraFilters.gender && e.gender !== "both") return false;
      }
    }
    // Race filter（精選 + 社群都套用）
    if (miraFilters.race) {
      // "all" 套裝在任何種族篩選下都顯示
      if (e.race !== miraFilters.race && e.race !== "all") return false;
    }
    // 我的收藏
    if (favOnly && !favs.has(e.id)) return false;
    // 繁中版可幻化
    if (twOnly && !e.tw) return false;
    // 色系（群組內 OR）
    if (dyeTags.size) {
      const fam = entryDyeFamilies(e);
      if (![...dyeTags].some(f => fam.has(f))) return false;
    }
    // 「有穿某官方套裝的件」
    if (!matchItemFilter(e)) return false;
    // 取得方式／職業（可複選；群組內 OR、群組間 AND，精選＋社群都適用）
    if (!matchSrcTags(e)) return false;
    if (!matchSrcDetail(e)) return false;
    if (jobTags.size && ![...jobTags].some(t => e.tags.includes(t))) return false;
    // Search（名稱／投稿者／裝備名／取得方式，含全部副本名不只顯示的那一種）
    if (qLow && !hayMatch(e, qLow)) return false;
    return true;
  });
  sortFiltered();
  currentPage = 1;
  renderGrid();
  updateSubtitle();
}

function sortFiltered() {
  const nameOf = e => e.type === "set" ? setDisplayName(e) : (e.name || "");
  // 時間排序鍵。三種資料的來源不同：
  //   社群 timestamp（"YYYY-MM-DD hh:mm:ss"）＞ 精選 added（只到日，見下）＞ 官方套裝（無）
  // 精選沒有投稿時間（它們不是投稿、是站方自選），改用 data/curated_outfits.json 的
  // `added`＝收錄日期，補上 " 00:00:00" 之後就能跟社群的時間戳直接比字串大小，
  // 於是精選會**排進社群的時間軸**而不是整批堆在某一端。
  // 同一天內再用編號分先後（`#0091`），排序才穩定；⚠ 只補**開頭的數字**——
  // 有 33a–33f 這種子套裝編號，整串 padStart 會把「33f」變成「033f」而排到
  // 「0091」之上（3 > 0），變成 33f 比 91 新。
  // 沒有 added 的精選（新增時忘了填）→ 退回「0000-」＝最舊，排在最後面；
  // 這是刻意讓它顯眼的，health_check.py 也會把缺值報出來。
  // 官方套裝檢視全部無鍵＝值相同，sort 是穩定的，會維持資料檔的版本新→舊。
  const idKey = e => String(e.id).replace(/^\d+/, m => m.padStart(4, "0"));
  const tsOf = e => {
    if (e.timestamp) return e.timestamp;
    if (e.added) return e.added + " 00:00:00#" + idKey(e);
    if (e.type === "curated") return "0000-" + idKey(e);
    return "";
  };
  if (sortMode === "patch-desc")      filtered.sort((a,b) => (b.maxPatch||0) - (a.maxPatch||0));
  else if (sortMode === "patch-asc")  filtered.sort((a,b) => (a.maxPatch||0) - (b.maxPatch||0));
  else if (sortMode === "name")       filtered.sort((a,b) => nameOf(a).localeCompare(nameOf(b), "zh-Hant"));
  else if (sortMode === "old")        filtered.sort((a,b) => tsOf(a).localeCompare(tsOf(b)));
  else if (sortMode === "default")    { /* ⭐ 精選優先：維持 ALL_OUTFITS 的原順序 */ }
  // 其餘（含未指定）＝預設的「投稿新→舊」
  else                                filtered.sort((a,b) => tsOf(b).localeCompare(tsOf(a)));
}

// GRID RENDER
// ════════════════════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById("outfit-grid");
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  if (pageItems.length === 0) {
    grid.innerHTML = '<div class="col-12"><div class="empty-state">沒有符合條件的配裝</div></div>';
    renderPager();
    return;
  }

  grid.innerHTML = pageItems.map((e, i) => buildCard(e, start + i)).join("");

  renderPager();
}

const TAG_LABEL = {
  healer:"💚治療", tank:"🛡️盾衛", caster:"🔮法系",
  melee:"⚔️近戰", pranged:"🏹遠距", crafter:"🔨製作",
  event:"🗓️活動", pvp:"⚔️PvP", store:"💎Mog", raid:"🗡️副本",
  scrip:"🔶神典", gs:"🎲金碟"
};

function buildSetCard(e, idx) {
  const icons = setVisibleIcons(e).slice(0, 6);
  let iconsHtml = icons.length
    ? `<div class="set-icons">` + icons.map(p =>
        `<img src="配裝圖片/icons/${p.icon}.png" alt="" loading="lazy"
          onerror="this.style.display='none'">`).join("") + `</div>`
    : `<div class="set-icons"><span class="text-secondary small">No Icons</span></div>`;
  // 有示意照 → 用照片呈現整體外觀（wiki 官方模特照優先，其次站內配裝照）
  if (e.img) {
    const isWiki = e.imgSrc === "wiki";
    const note = isWiki
      ? (currentLang === "en" ? "official look" : "官方外觀")
      : (currentLang === "en" ? "community look" : (e.imgLabel || "示意"));
    iconsHtml = `<div class="set-card-imgwrap">
      <img class="card-img-top" src="${cardOf(e.img)}" alt="${esc(setDisplayName(e))}" loading="lazy"
        onerror="cardImgError(this,'${esc(e.img).replace(/'/g, "\\'")}')">
      <div class="set-photo-note">${isWiki ? "📖" : "👤"} ${esc(note)}</div>
    </div>`;
  }
  const name = setDisplayName(e);
  const zhMiss = !e.name_zh && !e.tw
    ? `<span class="zh-missing">${currentLang === "en" ? "not on TW" : "繁中未實裝"}</span>` : "";
  const patchTag = e.patch ? `<span class="patch-tag">${esc(e.patch)}</span>` : "";
  const jobTag = e.job && e.job !== "全職業" ? `<span class="restrict-job">${esc(e.job)}</span>` : "";
  const tot = e.pieces.length;
  const favCls = favs.has(e.id) ? " faved" : "";
  // alljob 等僅供篩選的 tag 不上卡（與配裝卡 CARD_TAGS 規則一致）
  const tagBadges = (e.tags || []).filter(t => CARD_TAGS.has(t)).map(t => `<span class="card-tag badge-${t}">${TAG_LABEL[t] || t}</span>`).join("");
  return `<div class="col">
    <div class="card outfit-card h-100 position-relative" onclick="openModal(${idx})">
      <button class="fav-btn${favCls}" title="加入／移除我的收藏" onclick="toggleFav('${String(e.id).replace(/'/g, "\\'")}', event)">★</button>
      ${iconsHtml}
      <div class="card-body p-3">
        <div class="small text-secondary d-flex align-items-center gap-1 flex-wrap">${patchTag}${jobTag}${zhMiss}</div>
        <div class="card-name fw-semibold mt-1 mb-1">${esc(name)}</div>
        <div class="text-secondary small">${esc(e.source || "")}<span class="ms-2">${tot} 件</span></div>
        <div class="d-flex flex-wrap gap-1 mt-2">${tagBadges}</div>
      </div>
    </div>
  </div>`;
}

function buildCard(e, idx) {
  if (e.type === "set") return buildSetCard(e, idx);
  const isCurated = e.type === "curated";

  const imgHtml = e.image
    ? `<img class="card-img-top" src="${cardOf(e.image)}" alt="${esc(e.name)}" loading="lazy"
        onerror="cardImgError(this,'${esc(e.image).replace(/'/g, "\\'")}')">`
    : `<div class="card-noimg">No Image</div>`;

  // 第一行 meta（精選顯示編號，社群顯示性別種族）
  let metaHtml;
  if (isCurated) {
    const gSym = e.gender === "female" ? "♀" : e.gender === "male" ? "♂" : "";
    const gCls = e.gender === "female" ? "tag-female" : e.gender === "male" ? "tag-male" : "tag-unk";
    const rMap = currentLang === "en" ? RACE_LABEL : RACE_ZH;
    const rName = (e.race && e.race !== "all") ? (rMap[e.race] || e.race) : "";
    const raceTag = rName ? `<span class="tag-race">${rName}</span>` : "";
    const genderTag = gSym ? `<span class="${gCls}">${gSym}</span>` : "";
    metaHtml = `<div class="small text-secondary d-flex align-items-center gap-1 flex-wrap">#${e.id}${genderTag ? " " + genderTag : ""}${raceTag ? " " + raceTag : ""}</div>`;
  } else {
    const gSym  = e.gender === "female" ? "♀" : e.gender === "male" ? "♂" : "?";
    const gCls  = e.gender === "female" ? "tag-female" : e.gender === "male" ? "tag-male" : "tag-unk";
    const rMap  = currentLang === "en" ? RACE_LABEL : RACE_ZH;
    const race  = e.race ? ` ${rMap[e.race] || e.race}` : "";
    metaHtml = `<div class="small text-secondary d-flex align-items-center gap-1 flex-wrap"><span class="${gCls}">${gSym}${race}</span></div>`;
  }

  // 標籤列（craft/npc/other 等太常見的 st 只用於篩選，不上卡片，避免每張卡都一排小標）
  const rMapTag = currentLang === "en" ? RACE_LABEL : RACE_ZH;
  const tagBadges = isCurated
    ? (e.tags || []).filter(t => CARD_TAGS.has(t)).map(t => `<span class="card-tag badge-${t}">${TAG_LABEL[t] || t}</span>`).join("")
    : (e.gender === "female" ? `<span class="tag-female">♀</span>`
       : e.gender === "male" ? `<span class="tag-male">♂</span>`
       : `<span class="tag-unk">?</span>`)
      + (e.race && e.race !== "all" ? `<span class="tag-race">${rMapTag[e.race] || e.race}</span>` : "");

  const favCls = favs.has(e.id) ? " faved" : "";
  return `<div class="col">
    <div class="card outfit-card h-100 position-relative" onclick="openModal(${idx})">
      ${isCurated ? '<div class="star-badge">⭐</div>' : ""}
      <button class="fav-btn${favCls}" title="加入／移除我的收藏" onclick="toggleFav('${String(e.id).replace(/'/g, "\\'")}', event)">★</button>
      ${imgHtml}
      <div class="card-body p-3">
        ${metaHtml}
        <div class="card-name fw-semibold mt-1 mb-1">${esc(e.name)}</div>
        <div class="text-secondary small">${esc(e.color || "")}</div>
        <div class="d-flex flex-wrap gap-1 mt-2">${tagBadges}</div>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════
// PAGER（Bootstrap pagination）
// ════════════════════════════════════════════════════════
function renderPager() {
  const pager = document.getElementById("pager");
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (totalPages <= 1) { pager.innerHTML = ""; return; }

  const pg = (label, page, opts = {}) => {
    const cls = "page-item" + (opts.active ? " active" : "") + (opts.disabled ? " disabled" : "");
    return `<li class="${cls}"><button class="page-link" onclick="goPage(${page})">${label}</button></li>`;
  };

  let html = '<ul class="pagination pagination-sm mb-0">';
  html += pg("‹", currentPage - 1, { disabled: currentPage === 1 });
  let lo = Math.max(1, currentPage - 3);
  let hi = Math.min(totalPages, currentPage + 3);
  if (lo > 1) {
    html += pg("1", 1);
    if (lo > 2) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
  }
  for (let p = lo; p <= hi; p++) html += pg(p, p, { active: p === currentPage });
  if (hi < totalPages) {
    if (hi < totalPages - 1) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
    html += pg(totalPages, totalPages);
  }
  html += pg("›", currentPage + 1, { disabled: currentPage === totalPages });
  html += "</ul>";

  html += `<span class="text-secondary small">${filtered.length} 件 / 第 ${currentPage}/${totalPages} 頁</span>`;
  html += `<input class="form-control form-control-sm" style="width:80px" type="number" min="1" max="${totalPages}" placeholder="跳頁"
            onkeydown="if(event.key==='Enter'){goPage(parseInt(this.value)||1);}">`;
  pager.innerHTML = html;
}

function goPage(p) {
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderGrid();
  syncURL(true);
  window.scrollTo({top:0, behavior:"smooth"});
}

// ════════════════════════════════════════════════════════
// 瀏覽器上一頁／下一頁（History API）
// ════════════════════════════════════════════════════════
// 檢視、篩選、頁碼、開啟的套裝全部同步到網址列，瀏覽器的上一頁才有東西可回，
// 網址也就能直接分享／加書籤。
// 規則：使用者動作 → pushState（可回上一步）；打字搜尋、彈窗內上下套、關彈窗
//       → replaceState（否則每按一鍵就多一筆歷史，上一頁要按 20 次才回得去）。
const URL_KEYS = [
  ["v",   () => viewMode,          "outfits"],
  ["p",   () => currentPage,       1],
  ["src", () => [...srcTags].sort().join(","), ""],
  ["job", () => [...jobTags].sort().join(","), ""],
  ["dye", () => [...dyeTags].sort().join(","), ""],
  ["set", () => (itemFilter ? itemFilter.setId : ""), ""],
  ["d",   () => srcDetail,         ""],
  ["q",   () => q,                 ""],
  ["g",   () => miraFilters.gender, ""],
  ["r",   () => miraFilters.race,  ""],
  ["fav", () => (favOnly ? "1" : ""), ""],
  ["tw",  () => (twOnly ? "1" : ""),  ""],
  ["s",   () => sortMode,          "new"],      // 預設值不入網址；改預設要一起改
  ["lang", () => currentLang,      "zh"],
];
let restoring = false;        // 正在套用網址狀態：期間一律不寫歷史
let silentClose = false;      // 這次關彈窗是還原造成的，不要寫歷史
let pendingModalId = null;    // 網址指定的套裝還沒載入（社群/官方套裝延遲載入）
let pendingSetId = null;      // 網址 ?set= 指定的官方套裝還沒載入（同上）
let openModalId = null;       // 目前開著的套裝 id（Bootstrap 的 .show class 是非同步加的，不能用來判斷）
let modalShowing = false;     // 開啟動畫進行中——Bootstrap 此時會忽略 hide()
let closeAfterShown = false;  // 動畫還沒跑完就被要求關（點開後馬上按上一頁）→ 等 shown 再關

function currentQuery() {
  const u = new URLSearchParams();
  for (const [k, get, dflt] of URL_KEYS) {
    const v = String(get());
    if (v && v !== String(dflt)) u.set(k, v);
  }
  if (openModalId) u.set("id", openModalId);
  const s = u.toString();
  return s ? "?" + s : location.pathname;
}

function syncURL(push) {
  if (restoring) return;
  const url = currentQuery();
  if (!push && url === location.search + (location.search ? "" : location.pathname)) return;
  try {
    history[push ? "pushState" : "replaceState"]({ url }, "", url);
  } catch (e) { /* file:// 下部分瀏覽器不給 pushState，忽略 */ }
}

function applyURLState() {
  const u = new URLSearchParams(location.search);
  restoring = true;
  try {
    viewMode = u.get("v") === "sets" ? "sets" : "outfits";
    srcTags = new Set((u.get("src") || "").split(",").filter(Boolean));
    jobTags = new Set((u.get("job") || "").split(",").filter(Boolean));
    dyeTags = new Set((u.get("dye") || "").split(",").filter(Boolean));
    srcDetail = u.get("d") || "";
    // ?set= 的套裝要等 official_sets.js 載完才查得到件；載完由 restorePage() 補上
    const setId = u.get("set") || "";
    itemFilter = null;
    if (setId) {
      const st = SETS.find(s => s.id === setId);
      if (st) itemFilter = {
        setId,
        label: (currentLang === "en" ? "wearing: " : "有穿：") + setDisplayName(st),
        ids: new Set(st.pieces.map(p => Number(p.id))),
      };
      else pendingSetId = setId;
    }
    q = u.get("q") || "";
    miraFilters = { gender: u.get("g") || "", race: u.get("r") || "" };
    favOnly = u.get("fav") === "1";
    twOnly = u.get("tw") === "1";
    sortMode = u.get("s") || "new";
    const lang = u.get("lang") === "en" ? "en" : "zh";
    if (lang !== currentLang) setLang(lang);

    syncControls();
    populateSrcDetail();
    applyFilters();                       // 會把 currentPage 歸 1
    const p = parseInt(u.get("p"), 10) || 1;
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, p), totalPages);
    renderGrid();

    // 彈窗：網址有 id 就開，沒有就關（＝上一頁關掉彈窗）
    const id = u.get("id") || "";
    if (id) {
      const idx = filtered.findIndex(e => String(e.id) === id);
      if (idx >= 0) { pendingModalId = null; openModal(idx, "none"); }
      else pendingModalId = id;          // 資料還沒載完，載完再試
    } else if (openModalId) {
      closeModal(true);
    }
  } finally {
    restoring = false;
  }
}

// 社群／官方套裝資料是延遲載入的，載完 applyFilters() 會把頁碼歸 1，
// 這裡依網址把頁碼與待開的套裝補回來。
function restorePage() {
  retryPendingSet();
  const p = parseInt(new URLSearchParams(location.search).get("p"), 10) || 1;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const want = Math.min(Math.max(1, p), totalPages);
  if (want !== currentPage) { currentPage = want; renderGrid(); }
  retryPendingModal();
}

// 資料延遲載入完成後，補開網址指定的套裝
// ?set= 進站時官方套裝還沒載完 → 載完後把「有穿這套」的條件補上
function retryPendingSet() {
  if (!pendingSetId || !setsLoaded) return;
  const st = SETS.find(s => s.id === pendingSetId);
  pendingSetId = null;
  if (!st) return;
  itemFilter = {
    setId: st.id,
    label: (currentLang === "en" ? "wearing: " : "有穿：") + setDisplayName(st),
    ids: new Set(st.pieces.map(p => Number(p.id))),
  };
  syncItemFilterChip();
  applyFilters();
}

function retryPendingModal() {
  if (!pendingModalId) return;
  const idx = filtered.findIndex(e => String(e.id) === pendingModalId);
  if (idx < 0) return;
  pendingModalId = null;
  restoring = true;
  try { openModal(idx, "none"); } finally { restoring = false; }
}

// 把目前狀態反映回篩選列的按鈕／輸入框（上一頁回來時 UI 要跟著變）
function syncControls() {
  document.querySelectorAll(".filter-btn[data-filter]").forEach(b => {
    const set = b.dataset.group === "src" ? srcTags : jobTags;
    b.classList.toggle("active", set.has(b.dataset.filter));
  });
  for (const f of ["gender", "race"]) {
    document.querySelectorAll(`.filter-btn[data-mf="${f}"]`).forEach(b => b.classList.remove("active"));
    const b = document.querySelector(`.filter-btn[data-mf="${f}"][data-val="${miraFilters[f]}"]`);
    if (b) b.classList.add("active");
  }
  document.querySelectorAll(".dye-btn").forEach(b => b.classList.toggle("active", dyeTags.has(b.dataset.dye)));
  document.getElementById("fav-filter-btn").classList.toggle("active", favOnly);
  document.getElementById("tw-btn").classList.toggle("active", twOnly);
  document.getElementById("search-input").value = q;
  document.getElementById("sort-select").value = sortMode;
  document.getElementById("view-outfits-btn").classList.toggle("view-active", viewMode === "outfits");
  document.getElementById("view-sets-btn").classList.toggle("view-active", viewMode === "sets");
  const isSets = viewMode === "sets";
  document.getElementById("row-gender").classList.toggle("d-none", isSets);
  document.getElementById("row-race").classList.toggle("d-none", isSets);
  // 官方套裝沒有染色資料，色系列在該檢視沒有意義
  document.getElementById("row-dye").classList.toggle("d-none", isSets);
  syncItemFilterChip();
}

// ════════════════════════════════════════════════════════
// MODAL — OPEN / CLOSE / NAV（Bootstrap Modal API）
// ════════════════════════════════════════════════════════
let bsModal = null;
function getModal() {
  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById("modal"), { focus: true });
  return bsModal;
}
// hist：push＝可用上一頁關掉（卡片點擊）｜replace＝不新增歷史（彈窗內上下套）｜none＝還原中
function openModal(globalIdx, hist) {
  currentIdx = globalIdx;
  const e = filtered[globalIdx];
  if (!e) return;
  if (e.type === "curated") {
    renderCuratedModal(e, globalIdx);
  } else if (e.type === "set") {
    renderSetModal(e, globalIdx);
  } else {
    renderMiraModal(e, globalIdx);
  }
  openModalId = String(e.id);
  modalShowing = true;
  closeAfterShown = false;
  getModal().show();
  // 切換套裝時把內容捲回頂端
  const body = document.querySelector("#modal .modal-body");
  if (body) body.scrollTop = 0;
  const ic = document.getElementById("modal-info-col"); if (ic) ic.scrollTop = 0;
  if (hist !== "none") syncURL(hist !== "replace");
}

function closeModal(silent) {
  if (silent) silentClose = true;
  // 開啟動畫進行中呼叫 hide() 會被 Bootstrap 吃掉 → 記下來，等 shown 事件再關
  if (modalShowing) { closeAfterShown = true; return; }
  if (bsModal) bsModal.hide();
}
// 保留相容性（舊呼叫路徑）
function closeMiraModal() { closeModal(); }

function navModal(dir) {
  const next = currentIdx + dir;
  // replace：彈窗內翻套裝不堆歷史，上一頁一次就關掉彈窗回到列表
  if (next >= 0 && next < filtered.length) openModal(next, "replace");
}

// SET MODAL RENDER（官方套裝）
// ════════════════════════════════════════════════════════
function renderSetModal(e, idx) {

  // 「這套官方套裝有哪些玩家配法」——社群用到的裝備有 62% 屬於某個官方套裝，
  // 但這個方向的反查原本只能一件一件手動搜尋裝備名。
  const nWear = countWearers(e);

  // 左欄：示意照（wiki 官方模特照優先，其次站內配裝照），icon 陣列殿後

           style="width:64px;height:64px;border-radius:8px;border:1px solid var(--border);background:#0a0d12"
           onerror="this.style.display='none'">` : "").join("") + `</div>`;
  if (e.img) {
    const capHtml = e.imgSrc !== "wiki"
