<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FF14 園藝配種計算 — 選一個目標作物就算出完整配種路徑、總工期與收成時刻；花卉查油粕配色；含土壤、鄰接順序等機制速查">
<title>園藝配種計算 | 水神的工具箱</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/tool-header.css">
<style>
  /* 本頁識別色＝綠。指向 token（不是寫死字面值），亮/暗兩套自動跟著走——
     見 tokens.css 的「強調色 --accent 的規則」。 */
  :root { --accent: var(--green); --accent-dim: var(--green-dim); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* 109.375% = 16 × 1.09375 = 17.5px。用 % 而非 px，使用者在瀏覽器放大字級時本頁才會跟著放大。 */
  html { font-size: 109.375%; }
  body { background: var(--bg-base); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }

  .main { max-width: var(--w-content); margin: 0 auto; padding: 0 1.25rem 3.5rem; }

  /* 時數、天數、時刻一律等寬數字，換算時不會左右跳動；數字本身不斷行 */
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 只給螢幕閱讀器的即時播報區。結果整塊換掉時，讀屏使用者本來完全不知道發生了什麼。 */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ── 頁籤 ───────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 0 0 auto; padding: 0.6rem 1.15rem; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; border: none; background: none; color: var(--text-dim);
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--transition), border-color var(--transition);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .panel[hidden] { display: none; }

  /* ── 通用區塊 ───────────────────────────────────────────────────── */
  h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent);
       margin: 1.5rem 0 0.6rem; display: flex; align-items: center; gap: 0.55rem; }
  /* 只有「面板最上緣」的小標不留上距。結果區（#planResult／#flowerResult）是另一個容器，
     它裡面的第一個 h2 仍需要間距，否則會黏在上一區的卡片上。 */
  .panel > h2:first-child { margin-top: 0; }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  h3 { font-size: 0.95rem; font-weight: 700; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.05rem; }
  .note { font-size: 0.8rem; color: var(--text-dim); line-height: 1.65; }
  .note strong { color: var(--text); }
  /* 整段說明文限寬，1440px 下不會拉成一條 130 字的長行 */
  p.note { max-width: 72ch; }
  .empty { color: var(--text-muted); text-align: center; padding: 2.25rem 1rem; font-size: 0.88rem; line-height: 1.7; }

  /* 物品圖示。固定尺寸避免載入時版面位移（CLS）。 */
  .ico { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 4px; background: var(--raise); object-fit: contain; }
  .ico.sm { width: 20px; height: 20px; flex-basis: 20px; }
  .ico.lg { width: 40px; height: 40px; flex-basis: 40px; }

  /* 籌碼：一律「圖示＋文字」，不靠顏色單獨表意。
     **不可以設 white-space: nowrap**——取得方式那顆會塞進「塔妮（格里達尼亞新街 X:11.07 Y:11.2）」，
     375px 下不斷行就整頁水平溢出 56px（2026-08-12 量到）。要不斷行的只有 .num。 */
  .chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.16rem 0.5rem;
          border-radius: 999px; font-size: 0.72rem; line-height: 1.5; border: 1px solid var(--border);
          background: var(--raise); color: var(--text-dim); max-width: 100%; overflow-wrap: anywhere; }
  .chip.ok   { color: var(--green);  background: var(--green-dim);  border-color: var(--green-dim); }
  .chip.warn { color: var(--orange); background: var(--orange-dim); border-color: var(--orange-dim); }
  .chip.info { color: var(--blue);   background: var(--blue-dim);   border-color: var(--blue-dim); }
  .chip.gold { color: var(--gold);   background: var(--gold-dim);   border-color: var(--gold-dim); }

  /* ── 目標選擇 ───────────────────────────────────────────────────── */
  .picker { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: flex-end; margin-bottom: 0.9rem; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
  .field.grow { flex: 1 1 18rem; }
  .field label { font-size: 0.76rem; color: var(--text-dim); }
  .field input, .field select {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 0.5rem 0.65rem; font-size: 0.88rem; font-family: inherit;
    outline: none; transition: border-color var(--transition);
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field .hint { font-size: 0.72rem; color: var(--text-muted); }

  .quick { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.1rem; }
  .quick-btn {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.65rem;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px;
    color: var(--text-dim); font-size: 0.78rem; font-family: inherit; cursor: pointer;
    transition: color var(--transition), border-color var(--transition);
  }
  .quick-btn:hover { color: var(--text); border-color: var(--border-hover); }

  /* ── 計畫摘要 ───────────────────────────────────────────────────── */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr)); gap: 1px;
             background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .summary > div { background: var(--bg-card); padding: 0.8rem 1rem; }
  .summary dt { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.2rem; }
  .summary dd { font-size: 1.15rem; font-weight: 700; color: var(--text); line-height: 1.25; }
  .summary dd small { font-size: 0.75rem; font-weight: 400; color: var(--text-dim); }
  .summary dd.hl { color: var(--accent); }

  /* ── 步驟時間軸 ─────────────────────────────────────────────────── */
  .stage { margin-top: 0.75rem; }
  .stage-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; margin-bottom: 0.4rem; }
  .stage-no { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); }
  .stage-time { font-size: 0.72rem; color: var(--text-muted); }

  .step { display: flex; gap: 0.75rem; padding: 0.75rem 0.9rem; background: var(--bg-card);
          border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.4rem; }
  .step-body { flex: 1; min-width: 0; }
  .step-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.4rem; font-size: 0.85rem; line-height: 1.6; }
  .step-meta { margin-top: 0.35rem; display: flex; flex-wrap: wrap; gap: 0.3rem 0.45rem; }
  .seed-ref { display: inline-flex; align-items: center; gap: 0.28rem; padding: 0.1rem 0.4rem 0.1rem 0.16rem;
              border-radius: 5px; background: var(--raise); border: 1px solid var(--border); font-size: 0.8rem; }
  .seed-ref.base { border-color: var(--accent-dim); }
  .seed-ref.adj  { border-color: var(--purple-dim); }
  .role { font-size: 0.68rem; color: var(--text-muted); }
  .arrow { color: var(--text-muted); }

  details.alts { margin-top: 0.45rem; }
  details.alts > summary { font-size: 0.74rem; color: var(--text-dim); cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 0.3rem; }
  details.alts > summary::-webkit-details-marker { display: none; }
  details.alts > summary::before { content: '▸'; font-size: 0.7rem; transition: transform var(--transition); }
  details.alts[open] > summary::before { transform: rotate(90deg); }
  .alt-list { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.45rem; list-style: none; }
  .alt-btn { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.4rem; width: 100%; text-align: left;
             padding: 0.4rem 0.55rem; background: var(--bg-surface); border: 1px solid var(--border);
             border-radius: var(--radius-sm); color: var(--text-dim); font-size: 0.78rem; font-family: inherit; cursor: pointer; }
  .alt-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .alt-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }

  /* ── 用途 / 照料時程 ─────────────────────────────────────────────── */
  .use-list { display: flex; flex-direction: column; gap: 0.45rem; }
  .use-row { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.82rem; line-height: 1.6; }
  .use-tag { flex: 0 0 auto; font-size: 0.7rem; color: var(--text-muted); min-width: 4.5rem; }
  .use-row a { color: var(--accent); }

  /* 照料時程：時刻是重點，用等寬數字排成一欄才掃得快 */
  .care-list { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.5rem; }
  .care-row { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: baseline; font-size: 0.8rem; }
  .care-when { color: var(--orange); font-weight: 600; }
  .care-what { color: var(--text-dim); }

  .copy-btn {
    background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-dim); font-size: 0.72rem; font-family: inherit; padding: 0.14rem 0.45rem;
    cursor: pointer; transition: color var(--transition), border-color var(--transition);
  }
  .copy-btn:hover { color: var(--text); border-color: var(--border-hover); }

  /* ── 花色 ───────────────────────────────────────────────────────── */
  .species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(9.5rem, 100%), 1fr)); gap: 0.45rem; }
  .species-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; background: var(--bg-card);
                 border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
                 font-size: 0.83rem; font-family: inherit; cursor: pointer; text-align: left;
                 transition: border-color var(--transition); }
  .species-btn:hover { border-color: var(--border-hover); }
  .species-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); }

  .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(11.5rem, 100%), 1fr)); gap: 0.5rem; }
  .color-card { display: flex; gap: 0.6rem; padding: 0.6rem 0.7rem; background: var(--bg-card);
                border: 1px solid var(--border); border-radius: var(--radius); }
  /* 色塊只是輔助——顏色名稱與油粕配方一律以文字呈現，不靠顏色本身表意。
     內描邊讓白色在亮底、黑色在暗底都還看得出邊界。 */
  .swatch { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 6px;
            box-shadow: inset 0 0 0 1px rgba(128,128,128,0.55); }
  .color-name { font-size: 0.84rem; font-weight: 600; }
  .pomace-row { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.3rem; }
  .pom { display: inline-flex; align-items: center; gap: 0.22rem; padding: 0.1rem 0.4rem; border-radius: 999px;
         font-size: 0.7rem; border: 1px solid var(--border); background: var(--raise); color: var(--text-dim); }
  .pom i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }

  /* ── 全部作物 ───────────────────────────────────────────────────── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; margin-bottom: 0.9rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .filter-btn { padding: 0.32rem 0.7rem; background: var(--bg-card); border: 1px solid var(--border);
                border-radius: 999px; color: var(--text-dim); font-size: 0.78rem; font-family: inherit; cursor: pointer;
                transition: color var(--transition), border-color var(--transition); }
  .filter-btn:hover { color: var(--text); }
  .filter-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  .plant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(16rem, 100%), 1fr)); gap: 0.5rem; }
  .plant-card { display: flex; gap: 0.6rem; padding: 0.7rem 0.85rem; background: var(--bg-card);
                border: 1px solid var(--border); border-radius: var(--radius); }
  .plant-name { font-size: 0.88rem; font-weight: 600; }
  .plant-meta { margin-top: 0.25rem; display: flex; flex-wrap: wrap; gap: 0.25rem 0.4rem; }
  .plant-link { margin-top: 0.4rem; background: none; border: none; padding: 0; color: var(--accent);
                font-size: 0.76rem; font-family: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* ── 機制速查 ───────────────────────────────────────────────────── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  caption { caption-side: top; text-align: left; padding: 0.6rem 0.85rem 0; font-size: 0.76rem; color: var(--text-muted); }
  th, td { padding: 0.5rem 0.85rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  thead th { background: var(--bg-surface); color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }

  .beds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem; max-width: 15rem; margin-top: 0.6rem; }
  .bed { aspect-ratio: 1; display: grid; place-items: center; border: 1px dashed var(--border);
         border-radius: var(--radius-sm); font-size: 0.72rem; color: var(--text-muted); }
  .bed.here { border-style: solid; border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .bed.p1 { border-style: solid; border-color: var(--gold); color: var(--gold); }

  /* ── 園圃格位 ─────────────────────────────────────────────────────
     只畫「編號 × 交替樣式」，不畫實體形狀——各款園圃的實際排列查不到可信來源，
     而配種判定本來就只看鄰接方向的優先序，畫錯形狀反而會誤導。 */
  .patch { margin-top: 0.9rem; }
  .patch:first-of-type { margin-top: 0.4rem; }
  .patch-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.6rem; margin-bottom: 0.4rem; }
  .patch-name { font-size: 0.85rem; font-weight: 600; }
  .patch-note { font-size: 0.74rem; color: var(--text-muted); }
  .patch-beds { display: grid; gap: 0.3rem; }
  .pbed {
    display: grid; place-items: center; gap: 0.1rem; padding: 0.4rem 0.2rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 0.72rem; line-height: 1.25; text-align: center; min-width: 0;
  }
  /* 本株／鄰株除了底色，一定要有「本」「鄰」的字——不能只靠顏色分辨 */
  .pbed.base { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .pbed.adj  { border-color: var(--purple); background: var(--purple-dim); color: var(--purple); }
  .pbed b { font-size: 0.8rem; font-weight: 700; }
  .pbed span { font-size: 0.66rem; opacity: 0.85; }

  .srcs { font-size: 0.76rem; color: var(--text-muted); line-height: 1.8; margin-top: 0.6rem; }
  .srcs a { color: var(--text-dim); }

  /* 375px 下四個頁籤原本要橫向捲才看得到第四個「機制速查」。收窄左右內距讓它們一次排得下。 */
  @media (max-width: 420px) {
    .tab-btn { padding: 0.6rem 0.55rem; font-size: 0.84rem; }
  }

  /* 觸控裝置：tokens.css 已把 button／summary／input 撐到 44px 高，但**間距沒跟著加**。
     44px 高的鈕彼此只隔 5–7px 會變成一片按鈕牆，更容易按錯（HIG touch-spacing 要 8px）。
     common.css 對收藏頁的 .filter-tags 已有同樣處置，這裡比照。 */
  @media (pointer: coarse) {
    .quick, .filters, .alt-list, .species-grid, .color-grid { gap: 8px; }
    .plant-link { min-height: var(--tap-min, 44px); }
  }

  @media (max-width: 640px) {
    .main { padding: 0 0.9rem 3rem; }
    .summary dd { font-size: 1rem; }
    .step { padding: 0.65rem 0.7rem; }
  }
</style>
<script src="../../assets/js/theme.js"></script>
</head>
<body>

<div class="tool-header">
  <h1 class="tool-title">🌱 園藝配種計算</h1>
  <p class="tool-subtitle">選一個目標作物，直接算出完整配種路徑、總工期與收成時刻。花卉另查油粕配色。</p>
  <div class="header-divider"></div>
</div>

<main class="main" id="main">
  <div class="tabs" role="tablist" aria-label="檢視切換">
    <button class="tab-btn" role="tab" id="t-plan"   aria-controls="p-plan"   aria-selected="true"  data-tab="plan">配種路徑</button>
    <button class="tab-btn" role="tab" id="t-flower" aria-controls="p-flower" aria-selected="false" data-tab="flower" tabindex="-1">花色配方</button>
    <button class="tab-btn" role="tab" id="t-all"    aria-controls="p-all"    aria-selected="false" data-tab="all"    tabindex="-1">全部作物</button>
    <button class="tab-btn" role="tab" id="t-rules"  aria-controls="p-rules"  aria-selected="false" data-tab="rules"  tabindex="-1">機制速查</button>
  </div>

  <!-- ── 配種路徑 ─────────────────────────────────────────────── -->
  <section class="panel" id="p-plan" role="tabpanel" aria-labelledby="t-plan" tabindex="0">
    <div class="picker">
      <div class="field grow" style="max-width:26rem">
        <label for="planTarget">目標作物</label>
        <input id="planTarget" list="planList" autocomplete="off" placeholder="輸入或選擇作物，例如「薩維奈圓蔥」">
        <datalist id="planList"></datalist>
      </div>
      <div class="field">
        <label for="startAt">開始種的時間</label>
        <input id="startAt" type="datetime-local">
        <span class="hint">用來推算每一階段的收成時刻</span>
      </div>
    </div>
    <div class="quick" id="planQuick"></div>
    <p class="sr-only" id="planStatus" role="status" aria-live="polite"></p>
    <div id="planResult"><p class="empty">選一個目標作物，這裡會算出要先配哪些父本、每階段等多久、總共幾天，以及至少要幾格園圃。</p></div>
  </section>

  <!-- ── 花色配方 ─────────────────────────────────────────────── -->
  <section class="panel" id="p-flower" role="tabpanel" aria-labelledby="t-flower" tabindex="0" hidden>
    <p class="note" id="flowerIntro"></p>
    <h2>選擇花種</h2>
    <div class="species-grid" id="speciesGrid"></div>
    <p class="sr-only" id="flowerStatus" role="status" aria-live="polite"></p>
    <div id="flowerResult"></div>
  </section>

  <!-- ── 全部作物 ─────────────────────────────────────────────── -->
  <section class="panel" id="p-all" role="tabpanel" aria-labelledby="t-all" tabindex="0" hidden>
    <div class="toolbar">
      <div class="field grow">
        <label for="allSearch">搜尋</label>
        <input id="allSearch" type="search" autocomplete="off" placeholder="作物、種子或英文名…">
      </div>
      <div class="field">
        <label for="allSort">排序</label>
        <select id="allSort">
          <option value="name">依名稱</option>
          <option value="duration">依培育時數</option>
          <option value="effort">依取得難度（總工期）</option>
        </select>
      </div>
    </div>
    <div class="filters" id="allFilters" role="group" aria-label="類別篩選"></div>
    <p class="note" id="allCount" role="status" aria-live="polite" style="margin:0.75rem 0 0.6rem"></p>
    <div class="plant-grid" id="allGrid"></div>
  </section>

  <!-- ── 機制速查 ─────────────────────────────────────────────── -->
  <section class="panel" id="p-rules" role="tabpanel" aria-labelledby="t-rules" tabindex="0" hidden>
    <div id="rulesBody"></div>
  </section>
</main>

<script src="../../assets/js/patch-gate.js"></script>
<script src="gardening.js" defer></script>
</body>
</html>
