<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FF14 時尚品鑑週更推薦 — 每週固定版型的完整配裝表，含裝備與染劑的真實成本、部族聲望等隱形門檻，以及完整接受裝備清單">
<title>時尚品鑑推薦 — 水神的工具箱</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/tool-header.css">
<style>
  /* 本頁專屬強調色（時尚粉）。色票／版面 token 見 assets/css/tokens.css；
     --ok／--warn／--danger 現在是 tokens.css 內 --green／--orange／--red 的別名，
     兩個主題都有對應值，不必也不要在這裡重新寫死。 */
  :root {
    --accent:    #d97ab0;
    --accent-dim: rgba(217,122,176,0.14);
  }
  :root[data-theme="light"] {
    --accent:    #ad3a78;                    /* 亮底 5.13:1 */
    --accent-dim: rgba(173,58,120,0.14);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-base); color: var(--text); font-family: var(--font-sans); min-height: 100vh; font-size: 17px; }
  .main { max-width: var(--w-content); margin: 0 auto; padding: 26px 28px 60px; }
  b { color: var(--text); }

  /* ── 週狀態列：任何狀態下版型都一樣，只有徽章／文案／行動不同 ── */
  .state { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 24px; margin-bottom: 22px; }
  .state.alert { border-color: var(--gold); }
  .state-top { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .state-main { flex: 1 1 320px; min-width: 0; }
  .week-no { font-size: 13.5px; color: var(--text-dim); }
  .week-theme { font-size: 27px; font-weight: 700; color: var(--gold); line-height: 1.25; margin-top: 2px; }
  .week-theme small { font-size: 14px; color: var(--text-dim); font-weight: 400; margin-left: 9px; }
  .state-side { text-align: right; margin-left: auto; }
  .badge { display: inline-block; border-radius: 20px; padding: 4px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .badge.prep { background: rgba(200,169,110,.15); color: var(--gold); border: 1px solid var(--gold); }
  .badge.judge { background: rgba(111,191,115,.13); color: var(--ok); border: 1px solid var(--ok); }
  .badge.miss { background: rgba(224,122,122,.12); color: var(--danger); border: 1px solid var(--danger); }
  .countdown { font-size: 14px; color: var(--text-dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--text); }
  .state-say { font-size: 15px; color: var(--text-dim); margin-top: 12px; line-height: 1.65; }
  .state-say .verified { color: var(--ok); }
  .state-say .predicted { color: var(--warn); }
  .cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .cta-row a { color: var(--accent); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 14.5px; transition: border-color .15s; }
  .cta-row a:hover { border-color: var(--accent); }
  .cta-row a.primary { background: var(--gold); border-color: var(--gold); color: #14161c; font-weight: 600; }
  .cta-row a.primary:hover { filter: brightness(1.08); }
  .archive-note { font-size: 13.5px; color: var(--text-dim); margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border); }

  /* ── 方案切換 ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); border-radius: 9px; padding: 10px 18px; font-size: 15.5px; cursor: pointer; font-family: inherit; transition: .15s; }
  .tab:hover { color: var(--text); }
  .tab.on { border-color: var(--gold); color: var(--gold); background: rgba(200,169,110,.08); font-weight: 600; }
  .tab .t-sub { font-size: 12.5px; color: var(--text-dim); display: block; margin-top: 2px; font-weight: 400; }

  /* ── 方案卡 ── */
  .plan { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; }
  .plan-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .plan-title { font-size: 19px; font-weight: 700; color: var(--gold); }
  .plan-score { background: var(--accent-dim); color: var(--accent); border-radius: 8px; padding: 2px 12px; font-size: 15.5px; font-variant-numeric: tabular-nums; }
  .plan-sub { font-size: 14.5px; color: var(--text-dim); margin-bottom: 16px; }

  /* 成本摘要：使用者最想先知道的「代價」 */
  .cost { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .cost-cell { background: var(--bg-hover); border-radius: 9px; padding: 10px 16px; min-width: 118px; }
  .cost-k { font-size: 12.5px; color: var(--text-dim); }
  .cost-v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .cost-v small { font-size: 13px; font-weight: 400; color: var(--text-dim); margin-left: 3px; }
  .cost-cell.good .cost-v { color: var(--ok); }
  .cost-cell.bad .cost-v { color: var(--warn); font-size: 16px; }

  /* 門檻警示：這是本次改版的重點——標價之外的代價 */
  .gates { border: 1px solid rgba(224,169,92,.4); background: rgba(224,169,92,.07); border-radius: 9px; padding: 12px 16px; margin-bottom: 16px; font-size: 14.5px; line-height: 1.7; }
  .gates .g-title { color: var(--warn); font-weight: 600; margin-bottom: 4px; }
  .gates li { margin-left: 18px; }
  .gates b { color: var(--warn); }

  /* 配裝表：每個計分部位一列，每週結構完全相同 */
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--bg-hover); border-radius: 9px; padding: 11px 16px; display: grid; grid-template-columns: 108px minmax(210px,1.4fr) minmax(170px,1fr) 54px; gap: 14px; align-items: center; }
  .row.dim { opacity: .55; }
  .r-slot { font-size: 14.5px; }
  .r-slot b { display: block; font-size: 15.5px; }
  .r-hint { font-size: 12.5px; color: var(--gold); }
  .r-gear, .r-dye { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
  .r-none { color: var(--text-dim); font-size: 14px; }
  .r-pts { text-align: right; font-variant-numeric: tabular-nums; color: var(--ok); font-weight: 600; font-size: 15px; }
  .r-pts.zero { color: var(--text-dim); font-weight: 400; }
  .ico { width: 26px; height: 26px; border-radius: 5px; flex-shrink: 0; background: rgba(255,255,255,.04); }
  .nm { font-weight: 600; }
  /* 底色原本寫死「白色微透」，亮色模式下等於比卡片更白、籌碼看不出是籌碼；
     改用 --raise（暗色＝白微透、亮色＝黑微透，見 theme.css）。 */
  .chip { font-size: 12.5px; border-radius: 11px; padding: 2px 9px; background: var(--raise); color: var(--text-dim); white-space: nowrap; }
  .chip.gil { background: rgba(200,169,110,.14); color: var(--gold); }
  .chip.mk { background: var(--green-dim); color: var(--ok); }
  .chip.gate { background: var(--orange-dim); color: var(--warn); }
  .chip.craft { background: rgba(127,182,232,.12); color: var(--blue); }
  .swatch { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); flex-shrink: 0; }
  .where { font-size: 12.5px; color: var(--text-dim); background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; text-decoration: underline dotted; }
  .where:hover { color: var(--gold); }
  .filler-hint { font-size: 12.5px; color: var(--text-dim); }

  details { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 22px; margin-bottom: 16px; }
  details[open] { padding-bottom: 20px; }
  summary { cursor: pointer; font-size: 16px; color: var(--text-dim); }
  summary:hover { color: var(--gold); }
  summary b { color: var(--text); }

  /* 染色表 */
  .dye-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px,1fr)); gap: 10px; margin-top: 14px; }
  .dye-cell { background: var(--bg-hover); border-radius: 9px; padding: 12px 15px; }
  .dye-top { display: flex; align-items: center; gap: 9px; }
  .dye-slot { font-size: 12.5px; color: var(--text-dim); }
  .dye-name { font-size: 16px; font-weight: 600; }
  .dye-how { font-size: 13px; color: var(--text-dim); margin-top: 7px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  /* 完整清單 */
  .fl-tools { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin: 14px 0 6px; }
  .fl-tools select, .fl-tools input { background: var(--bg-hover); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 11px; font-size: 14px; font-family: inherit; }
  .fl-tools input { flex: 1 1 180px; min-width: 130px; }
  .fl-count { font-size: 13px; color: var(--text-dim); margin-left: auto; }
  .fl-legend { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.7; }
  .fl-slot-title { font-size: 15.5px; font-weight: 600; margin: 18px 0 8px; }
  .fl-slot-title span { font-size: 12.5px; color: var(--text-dim); font-weight: 400; margin-left: 7px; }
  .fl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px,1fr)); gap: 7px; }
  .fl-row { background: var(--bg-hover); border-radius: 9px; padding: 9px 14px; display: grid; grid-template-columns: 30px 1fr auto; gap: 11px; align-items: start; }
  .fl-l2 { grid-column: 2 / -1; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .fl-name { cursor: pointer; font-weight: 600; border-bottom: 1px dashed var(--border); }
  .fl-name:hover { color: var(--gold); }
  .fl-how { text-align: right; font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .fl-how.gil { color: var(--gold); }
  .fl-empty { color: var(--text-dim); font-size: 14px; padding: 10px 0; }

  .src-line { font-size: 12.5px; color: var(--text-dim); margin-top: 22px; line-height: 1.8; }
  .src-line a { color: var(--text-dim); }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #14161c; border-radius: 8px; padding: 9px 22px; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
  #toast.show { opacity: 1; }

  @media (max-width: 760px) {
    .main { padding: 18px 13px 50px; }
    .row { grid-template-columns: 1fr auto; gap: 8px; }
    .r-gear, .r-dye { grid-column: 1 / -1; }
    .fl-grid { grid-template-columns: 1fr; }
    .state-side { text-align: left; margin-left: 0; }
  }
</style>
  <script src="../../assets/js/theme.js"></script>
</head>
<body>

<div class="tool-header">
  <h1 class="tool-title">👗 時尚品鑑推薦</h1>
  <p class="tool-subtitle">每週固定版型的完整配裝表——含染劑成本與部族聲望等隱形門檻</p>
  <div class="header-divider"></div>
</div>

<main class="main">
  <div id="app"><p style="color:var(--text-dim)">載入中…</p></div>
</main>

<div id="toast">已複製</div>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   時尚品鑑推薦頁
   設計原則（2026-07-25 改版）：
   ① **每週長得一模一樣**。答案一律表達成「涵蓋所有計分部位的配裝表」，
      每列＝一個部位，缺的部位明講「不影響分數」，不再用每週人工寫的散文交代。
   ② **先講代價再講方法**。金幣、染劑支數、以及「部族聲望／製作職業」這種
      買不到的門檻，都在方案標題下方一次講完。
   ③ **狀態機把「遊戲階段」與「資料新鮮度」分開**。遊戲端週二 16:00 收榜＝
      新主題揭曉，中間沒有空窗；所謂過渡期是本站資料落後造成的，兩者不能混講。
   ══════════════════════════════════════════════════════════════ */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gil = n => Number(n).toLocaleString('en-US');
const ICON = p => p ? `https://xivapi.com/i/${String(p).replace(/^\/i\//, '')}` : null;

/* ── 週次時鐘 ────────────────────────────────────────────────
   week 440 起點＝2026-06-30（二）16:00 台北時間。官方時刻是 PST 12:00 a.m.
   （固定 UTC-8、不套夏令時），所以台北時間全年固定 16:00，不會漂移。
   全部用 epoch 運算，與瀏覽器所在時區無關；只有「顯示日期」時才套 +8。 */
const ANCHOR = Date.UTC(2026, 5, 30, 8, 0, 0);
const WEEK = 6048e5, DAY = 864e5, PREP = 3 * DAY;
const weekAt = t => 440 + Math.floor((t - ANCHOR) / WEEK);
const boundsOf = w => { const s = ANCHOR + (w - 440) * WEEK; return { start: s, judge: s + PREP, end: s + WEEK }; };
/* 日期字串一律以台北時間呈現：用 UTC getter 搭 +8 偏移，非 UTC+8 的使用者也不會看到
   「6/30 16:00」但當地其實是別的日子這種前後不一致。 */
const fmtMD = ms => { const d = new Date(ms + 8 * 3600e3); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const weekRange = w => { const b = boundsOf(w); return `${fmtMD(b.start)} 16:00 ～ ${fmtMD(b.end)} 16:00`; };
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + ' 天 ' : '') + String(h).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

/* ── 狀態機 ──────────────────────────────────────────────────
   兩個獨立維度：遊戲階段（準備期／評分期）× 本站資料（本週已驗證／本週預測版／落後）。
   六個狀態各有固定的徽章、說明與主要行動；版面結構不變，只換內容。 */
function stateOf(d, now) {
  const week = weekAt(now), b = boundsOf(week);
  const phase = now < b.judge ? 'prep' : 'judge';
  const until = phase === 'prep' ? b.judge : b.end;
  const common = { week, phase, until, bounds: b };
  if (d.week > week) return { ...common, key: 'ahead', stale: true };
  if (d.week < week) return { ...common, key: phase === 'prep' ? 'missing-prep' : 'missing-judge', stale: true };
  return { ...common, key: `${phase}-${d.status}`, stale: false };
}

const STATE_TEXT = {
  'prep-predicted': {
    badge: ['prep', '準備期'], tip: '距評分開放',
    say: '提示已揭曉，<span class="predicted">但社群還沒實測驗證</span>。下面的配裝表是依提示與計分規則推算的，可以先照著備裝；週五 16:00 評分開放後本站會更新成驗證版。',
  },
  'prep-verified': {
    badge: ['prep', '準備期'], tip: '距評分開放',
    say: '提示已揭曉，配裝表<span class="verified">已對過社群實測結果</span>。現在還不能評分，可以先把裝備與染劑備齊。',
  },
  'judge-verified': {
    badge: ['judge', '評分期'], tip: '距本週收榜',
    say: '評分開放中，配裝表<span class="verified">已對過社群實測結果</span>。備齊後找金碟遊樂場的假面薔薇評分，每週最多 4 次。',
  },
  'judge-predicted': {
    badge: ['judge', '評分期'], tip: '距本週收榜',
    say: '評分開放中，但本站資料<span class="predicted">還是推算版、尚未對過社群實測</span>。照著做通常沒問題，但建議先評一次確認分數再用掉其餘次數。',
  },
  'missing-prep': {
    badge: ['miss', '準備期'], tip: '距評分開放',
    say: '本站尚未收錄這一週的提示。現在是準備期、還不能評分，等本站更新或先看下列來源都可以。',
  },
  'missing-judge': {
    badge: ['miss', '評分期'], tip: '距本週收榜',
    say: '<b>評分已經開放，但本站尚未收錄這一週的答案。</b>想現在就評分請先看下列來源。',
  },
  ahead: {
    badge: ['miss', '資料異常'], tip: '距本週結束',
    say: '資料檔的週次比目前時間還新，可能是時鐘或資料有誤，請回報。',
  },
};

const EXT_LINKS = [
  ['https://fashionreportxiv.com/', 'Fashion Report XIV ↗', true],
  ['https://www.reddit.com/r/ffxiv/search/?q=fashion%20report&sort=new', 'Reddit 週帖', false],
  ['https://search.bilibili.com/all?keyword=%E6%97%B6%E5%B0%9A%E5%93%81%E9%89%B4', 'B 站攻略搜尋', false],
];

/* ── 小元件 ─────────────────────────────────────────────────── */
function copyText(t) {
  const done = () => { const el = document.getElementById('toast'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1200); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch {}
  ta.remove();
}

/** 地圖彈窗走全站共用元件；maps.json 有 145KB，第一次點才載。 */
let mapReady = null;
async function showMap(mapId, x, y, title, sub) {
  if (!mapReady) mapReady = (async () => {
    const [mod, maps] = await Promise.all([
      import('../../assets/js/map-modal.js'),
      fetch('../../data/maps.json').then(r => r.json()),
    ]);
    mod.initMapModal({ mapsData: maps.data, base: '../..' });
    return mod;
  })();
  (await mapReady).openMapModal({ mapId: Number(mapId), x: Number(x), y: Number(y), title, sub });
}

/** 販賣者／取得地點按鈕。沒有座標就只顯示地名，不做成假的可點連結。 */
const whereBtn = v => !v ? ''
  : (v.mapId != null && v.x != null
    ? `<button class="where" data-map="${v.mapId}" data-x="${v.x}" data-y="${v.y}" data-t="${esc(v.name)}" data-s="${esc(v.map)}">🗺 ${esc(v.name)}＠${esc(v.map)}</button>`
    : `<span class="chip">${esc(v.name)}</span>`);

const gateChip = g => g ? `<span class="chip gate" title="${esc(g.note ?? '')}">⚠ ${esc(g.label)}</span>` : '';

/* ── 方案卡 ─────────────────────────────────────────────────── */
function gearCell(row) {
  const g = row.gear;
  if (g.kind === 'hint') {
    return `
      <img class="ico" src="${ICON(g.icon)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="nm fl-name" data-copy="${esc(g.name)}" title="點擊複製名稱">${esc(g.name)}</span>
      <span class="chip ${g.srcType === 'npc-gil' ? 'gil' : g.srcType === 'craft' ? 'craft' : g.marketable ? 'mk' : ''}">${esc(g.how)}</span>
      ${gateChip(g.gate)}
      ${whereBtn(g.vendor)}`;
  }
  if (g.kind === 'own') {
    const f = g.filler;
    return `<span class="r-none">穿你現有的可染裝備</span>` +
      (f ? `<span class="filler-hint">・沒有的話：<span class="fl-name" data-copy="${esc(f.name)}">${esc(f.name)}</span>
             <span class="chip gil">${gil(f.price)} 金幣</span>${whereBtn(f.vendor)}</span>` : '');
  }
  return `<span class="r-none">穿什麼都行，不影響分數</span>`;
}

/* 只有左側六格吃染色分，飾品在遊戲裡根本不能染——別對飾品列說「染色未公布」。 */
const DYEABLE = new Set(['weapon', 'head', 'body', 'hands', 'legs', 'feet']);
function dyeCell(dye, pending, slot) {
  // 「還沒公布」和「不用染」是兩回事，混在一起講會讓人以為本週不必準備染劑
  if (!dye) {
    if (!DYEABLE.has(slot)) return `<span class="r-none">飾品不可染</span>`;
    return `<span class="r-none">${pending ? '染色未公布' : '不用染'}</span>`;
  }
  return `
    <span class="swatch" style="background:${esc(dye.color)}"></span>
    <span class="nm">${esc(dye.name)}</span>
    <span class="chip ${dye.gil != null && !dye.gate ? 'gil' : ''}">${dye.gil != null ? gil(dye.gil) + ' 金幣' : esc(dye.how)}</span>
    ${gateChip(dye.gate)}
    ${whereBtn(dye.vendor)}`;
}

function planCard(p, dyesPending) {
  const c = p.cost;
  const rows = p.rows.map(r => `
    <div class="row${r.points ? '' : ' dim'}">
      <div class="r-slot"><b>${esc(r.slotName)}</b>${r.hint ? `<span class="r-hint">提示：${esc(r.hint)}</span>` : ''}</div>
      <div class="r-gear">${gearCell(r)}</div>
      <div class="r-dye">${dyeCell(r.dye, dyesPending, r.slot)}</div>
      <div class="r-pts${r.points ? '' : ' zero'}">${r.points ? '+' + r.points : '—'}</div>
    </div>`).join('');

  const gates = c.gates.length ? `
    <div class="gates">
      <div class="g-title">⚠ 這套作法有 ${c.gates.length} 個金錢以外的門檻</div>
      <ul>${c.gates.map(g => `<li><b>${esc(g.label)}</b>（${esc(g.where)}）${g.note ? '——' + esc(g.note) : ''}</li>`).join('')}</ul>
    </div>` : '';

  const market = c.market?.length ? `
    <div class="gates" style="border-color:rgba(127,182,232,.35);background:rgba(127,182,232,.06)">
      <div class="g-title" style="color:var(--blue)">💠 有 ${c.market.length} 件沒有 NPC 固定價</div>
      <ul>${c.market.map(m => `<li><b style="color:var(--blue)">${esc(m.name)}</b>——${esc(m.how)}${
        m.marketGil != null
          ? `，上面的金幣總額已用<b style="color:var(--blue)">參考價 ${gil(m.marketGil)} 金幣</b>估算，實際成交價會浮動`
          : `，<b style="color:var(--blue)">目前市場板查不到報價</b>（多半是沒人上架），總額<b style="color:var(--blue)">沒有</b>把它算進去`
      }</li>`).join('')}</ul>
    </div>` : '';

  const alt = p.openAlternative ? `
    <details style="margin-top:14px">
      <summary>🔓 <b>不想碰門檻？</b>看完全無門檻的作法（${gil(p.openAlternative.cost.gil)} 金幣）</summary>
      <div class="rows" style="margin-top:12px">${p.openAlternative.rows.map(r => `
        <div class="row${r.points ? '' : ' dim'}">
          <div class="r-slot"><b>${esc(r.slotName)}</b></div>
          <div class="r-gear">${gearCell(r)}</div>
          <div class="r-dye">${dyeCell(r.dye, dyesPending, r.slot)}</div>
          <div class="r-pts${r.points ? '' : ' zero'}">${r.points ? '+' + r.points : '—'}</div>
        </div>`).join('')}</div>
    </details>` : p.openAlternativeNote ? `<div class="state-say">🔒 ${esc(p.openAlternativeNote)}。</div>` : '';

  return `
    <div class="plan">
      <div class="plan-head">
        <span class="plan-title">${esc(p.title)}</span>
        <span class="plan-score">${p.score} 分</span>
      </div>
      <div class="plan-sub">${esc(p.subtitle)}</div>
      <div class="cost">
        <div class="cost-cell"><div class="cost-k">裝備＋染劑</div><div class="cost-v">${gil(c.gil)}<small>金幣</small></div></div>
        <div class="cost-cell"><div class="cost-k">要湊的件數</div><div class="cost-v">${c.itemCount}<small>件裝備</small></div></div>
        <div class="cost-cell"><div class="cost-k">要買的染劑</div><div class="cost-v">${c.dyeCount}<small>支</small></div></div>
        <div class="cost-cell ${c.gateFree ? 'good' : 'bad'}"><div class="cost-k">金錢以外的門檻</div>
          <div class="cost-v">${c.gateFree ? '無' : c.gates.map(g => esc(g.label)).join('・')}</div></div>
      </div>
      ${gates}${market}
      <div class="rows">${rows}</div>
      ${c.fillerGil ? `<div class="state-say">※ 要染色的部位若手上完全沒有可染裝備，照上表補齊填充裝另需 ${gil(c.fillerGil)} 金幣。</div>` : ''}
      ${alt}
    </div>`;
}

/* ── 染色表 ─────────────────────────────────────────────────── */
function dyeSection(d) {
  const cells = Object.values(d.dyes).map(v => `
    <div class="dye-cell">
      <div class="dye-top">
        <span class="swatch" style="width:20px;height:20px;background:${esc(v.color)}"></span>
        <div>
          <div class="dye-slot">${esc(v.slotName)}</div>
          <div class="dye-name">${esc(v.name)}</div>
        </div>
      </div>
      <div class="dye-how">
        <span class="chip ${v.gil != null && !v.gate ? 'gil' : ''}">${
          v.gil != null ? gil(v.gil) + ' 金幣'
          : v.access === 'none' ? '取得方式未收錄'   /* 不是「免費」，是本站還沒有這支染劑的來源資料 */
          : esc(v.how)}</span>
        ${v.marketable ? '<span class="chip mk">可上市場板</span>' : '<span class="chip">不可交易</span>'}
        ${gateChip(v.gate)}
        ${whereBtn(v.vendor)}
      </div>
    </div>`).join('');
  if (!cells) {
    // 準備期（週二提示揭曉～週五評分開放）來源站只有提示是本週的，染色還是上週殘值，
    // 本站刻意不收。這裡要講清楚是「還沒公布」，不能只留一個空區塊。
    return `
      <details open>
        <summary>🎨 <b>本週指定染色</b>（尚未公布）</summary>
        <div class="fl-legend">
          時尚品鑑的六個指定色要等<b>週五 16:00 評分開放</b>、社群實測後才會確定，通常開放後 1～3 小時內就有。
          上方配裝表已改用<b>不靠染色</b>的組合，先照著備裝不會白費；染色公布後本頁會更新，屆時可能有更省的作法。
        </div>
      </details>`;
  }
  return `
    <details open>
      <summary>🎨 <b>本週指定染色</b>（六個部位・染上指定色各 +2 分）</summary>
      <div class="dye-grid">${cells}</div>
      <div class="fl-legend">
        染劑<b>每染一個部位就消耗一支</b>，且大多數染劑<b>不能上市場板</b>，只能親自去 NPC 買、兌換或製作——這是最容易被忽略的成本。
        染同色系（非指定的精確色）只加 1 分，本站方案一律只算精確色，避免給出達不到門檻的建議。
      </div>
    </details>`;
}

/* ── 完整接受裝備清單 ────────────────────────────────────────── */
const ACCESS_TXT = { open: ['無門檻', 'mk'], gated: ['有門檻', 'gate'], rng: ['看運氣', 'gate'], unreleased: ['台服未開放', 'gate'], none: ['無取得途徑', ''] };
let listState = { slot: 'all', access: 'all', sort: 'access', q: '' };

function itemRow(i) {
  const [aTxt, aCls] = ACCESS_TXT[i.access] ?? ['', ''];
  return `
    <div class="fl-row">
      <img class="ico" src="${ICON(i.icon)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div>
        <span class="fl-name" data-copy="${esc(i.name)}" title="點擊複製名稱">${esc(i.name)}</span>
        ${i.restrict ? `<span class="chip gate">${esc(i.restrict)}</span>` : ''}
      </div>
      <div class="fl-how ${i.gil != null ? 'gil' : ''}">${esc(i.how)}</div>
      <div class="fl-l2">
        <span class="chip">Lv${i.equipLevel ?? '?'}・裝等 ${i.ilvl ?? '?'}</span>
        <span class="chip">${esc(i.jobLabel ?? '全職業')}</span>
        <span class="chip ${i.dyeCount ? '' : 'gate'}">${i.dyeCount ? '可染色' : '不可染色'}</span>
        ${i.marketable ? `<a class="chip mk" href="../market/#item=${i.id}" target="_blank" rel="noopener">市場板查價 ↗</a>` : ''}
        ${gateChip(i.gate)}
        ${whereBtn(i.vendor)}
        <span class="chip">${esc(i.patch ?? '')}</span>
        <span class="chip" style="cursor:pointer" data-copy="${esc(i.nameEn ?? i.name)}" title="複製英文名，查國際服攻略用">EN</span>
      </div>
    </div>`;
}

function renderList(d) {
  const box = document.getElementById('flBody');
  if (!box) return;
  const q = listState.q.trim().toLowerCase();
  let total = 0;
  const html = d.slots.map(s => {
    if (listState.slot !== 'all' && listState.slot !== s.slot) return '';
    let items = s.items.filter(i =>
      (listState.access === 'all' || i.access === listState.access) &&
      (!q || i.name.toLowerCase().includes(q) || (i.nameEn ?? '').toLowerCase().includes(q)));
    if (listState.sort === 'gil') items = items.slice().sort((a, b) => (a.gil ?? 9e9) - (b.gil ?? 9e9));
    else if (listState.sort === 'level') items = items.slice().sort((a, b) => (a.equipLevel ?? 0) - (b.equipLevel ?? 0));
    total += items.length;
    if (!items.length) return '';
    return `<div class="fl-slot-title">${esc(s.slotName)}・${esc(s.hint)}<span>${items.length} 件</span></div>
            <div class="fl-grid">${items.map(itemRow).join('')}</div>`;
  }).join('');
  box.innerHTML = html || '<div class="fl-empty">沒有符合條件的裝備。</div>';
  document.getElementById('flCount').textContent = `${total} 件`;
}

function listSection(d) {
  const n = d.slots.reduce((a, s) => a + s.items.length, 0);
  return `
    <details>
      <summary>📚 <b>完整接受裝備清單</b>（${n} 件・推薦的那件穿不上或不喜歡時，換這裡任一件同樣計分）</summary>
      <div class="fl-tools">
        <select id="flSlot">
          <option value="all">全部部位</option>
          ${d.slots.map(s => `<option value="${s.slot}">${esc(s.slotName)}・${esc(s.hint)}</option>`).join('')}
        </select>
        <select id="flAccess">
          <option value="all">全部取得難度</option>
          <option value="open">只看無門檻</option>
          <option value="gated">只看有門檻</option>
        </select>
        <select id="flSort">
          <option value="access">依好取得程度</option>
          <option value="gil">依金幣價格</option>
          <option value="level">依需求等級</option>
        </select>
        <input id="flQ" type="search" placeholder="搜尋名稱（中／英）">
        <span class="fl-count" id="flCount"></span>
      </div>
      <div class="fl-legend">
        每列第二行依序是：<b>需求等級／裝等</b>・<b>可裝備職業</b>・<b>能不能染色</b>（時尚品鑑常要染色，不可染的件等於少一條路）・
        市場板連結・門檻・販賣地點（可點開地圖）・版本・EN（複製英文名）。
      </div>
      <div id="flBody"></div>
    </details>`;
}

/* ── 主渲染 ─────────────────────────────────────────────────── */
let tickTimer = null;
function render(d, themes) {
  const now = Date.now();
  const st = stateOf(d, now);
  const T = STATE_TEXT[st.key] ?? STATE_TEXT.ahead;
  // 資料落後時，標題顯示的是「現在這一週」的主題（主題名可離線預查到一年後），
  // 不是存檔那週——使用者要知道的是現在該做什麼。
  const shownWeek = st.stale ? st.week : d.week;
  const shownTheme = st.stale ? (themes?.data?.[shownWeek] ?? null) : d.theme;
  const themeName = shownTheme?.name ?? '（主題未知）';
  const themeEn = st.stale ? '' : (d.theme.nameEn ?? '');

  const stateBar = `
    <div class="state${st.stale ? ' alert' : ''}">
      <div class="state-top">
        <div class="state-main">
          <div class="week-no">第 ${shownWeek} 週・${weekRange(shownWeek)}（台北時間）</div>
          <div class="week-theme">${esc(themeName)}${themeEn ? `<small>${esc(themeEn)}</small>` : ''}</div>
        </div>
        <div class="state-side">
          <span class="badge ${T.badge[0]}">${T.badge[1]}</span>
          <div class="countdown">${T.tip} <b id="cnt"></b></div>
        </div>
      </div>
      <div class="state-say">${T.say}</div>
      ${st.stale ? `<div class="cta-row">${EXT_LINKS.map(([u, t, p]) => `<a class="${p ? 'primary' : ''}" href="${u}" target="_blank" rel="noopener">${t}</a>`).join('')}</div>` : ''}
      ${st.stale ? `<div class="archive-note">下方保留<b>第 ${d.week} 週「${esc(d.theme.name)}」</b>（${weekRange(d.week)}）的完整存檔，僅供參考——那一週已經收榜，照著做不會得分。</div>` : ''}
    </div>`;

  const tabs = d.plans.map((p, i) => `
    <button class="tab${i === 0 ? ' on' : ''}" data-plan="${i}">
      ${esc(p.title)}（${p.target} 分）
      <span class="t-sub">${gil(p.cost.gil)} 金幣・${p.cost.gateFree ? '無門檻' : p.cost.gates.length + ' 個門檻'}</span>
    </button>`).join('');

  $app.innerHTML = `
    ${stateBar}
    ${st.stale ? '<div class="state-say" style="margin:-6px 0 14px">↓ 以下是存檔內容</div>' : ''}
    <div class="tabs">${tabs}</div>
    <div id="planBox">${d.plans.length ? planCard(d.plans[0], !!d.dyesPending) : '<div class="plan">本週沒有可行方案，請看外部來源。</div>'}</div>
    ${dyeSection(d)}
    ${listSection(d)}
    <div class="src-line">
      <b>計分規則</b>：基礎 ${d.scoring.base} 分＋每個提示部位穿對 +${d.scoring.armorHint} 分（飾品 +${d.scoring.accHint}）＋六個部位各染上指定精確色 +${d.scoring.dyeExact} 分（同色系 +${d.scoring.dyeFamily}），上限 100 分。<b>評分前每個部位都要穿著裝備。</b><br>
      <b>時程</b>：每週二 16:00 收榜並揭曉新主題與提示、週五 16:00 開放評分，兩者皆為台北時間；每週最多評 4 次，參加得 10,000 MGP，80 分以上再得 50,000 MGP（每週各一次）。<br>
      <b>資料來源</b>：<a href="https://fashionreportxiv.com/" target="_blank" rel="noopener">Fashion Report XIV</a>（提示與社群實測）・裝備與染劑的台服名、價格、販賣 NPC、地點皆由本站資料庫離線比對。
      主題與提示名取自陸服資料表轉繁（<b>非台服官方譯名</b>），裝備與染劑名則為台服官方名。
    </div>`;

  // 倒數
  const tick = () => { const el = document.getElementById('cnt'); if (el) el.textContent = fmtDur(st.until - Date.now()); };
  tick(); clearInterval(tickTimer); tickTimer = setInterval(tick, 1000);

  // 方案切換
  $app.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    $app.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === btn));
    document.getElementById('planBox').innerHTML = planCard(d.plans[Number(btn.dataset.plan)], !!d.dyesPending);
  }));

  // 清單控制項
  const bind = (id, key) => document.getElementById(id)?.addEventListener('input', e => { listState[key] = e.target.value; renderList(d); });
  bind('flSlot', 'slot'); bind('flAccess', 'access'); bind('flSort', 'sort'); bind('flQ', 'q');
  renderList(d);
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { copyText(c.dataset.copy); return; }
  const m = e.target.closest('[data-map]');
  if (m) showMap(m.dataset.map, m.dataset.x, m.dataset.y, m.dataset.t, m.dataset.s);
});

Promise.all([
  fetch('../../data/fashion-report.json').then(r => r.json()),
  // 主題預查表：資料落後時仍能誠實顯示「現在這一週叫什麼」，不必假裝沒東西
  fetch('../../data/fashion-themes.json').then(r => r.json()).catch(() => null),
]).then(([d, themes]) => render(d, themes))
  .catch(() => { $app.innerHTML = '<p style="color:var(--text-dim)">資料載入失敗。</p>'; });
</script>

</body>
</html>
