<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FF14 市場查價 + 比價 — 繁中服陸行鳥 DC 即時價格、跨服比價、製作清單原料樹狀圖與買/做成本試算">
  <title>市場查價 + 比價 | 水神的工具箱</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/tool-header.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 109.375% = 16 × 1.09375 = 17.5px。預設瀏覽器下渲染尺寸與原本的 17.5px 完全相同，
       但用 px 寫死 root font-size 會**蓋掉使用者在瀏覽器設定的字級**（放大字體對本頁無效），
       用 % 才會跟著放大。2026-08-03 七頁一起改。 */
    html { scroll-behavior: smooth; font-size: 109.375%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-base); color: var(--text); min-height: 100vh; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: var(--w-wide); margin: 0 auto; padding: 0 20px; }


    /* header */

    /* toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 16px;
    }
    .toolbar label { font-size: 0.8rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    select, input[type="text"], input[type="search"], input[type="number"] {
      background: var(--bg-surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius-sm); padding: 7px 10px; font-size: 0.9rem; font-family: inherit;
    }
    select:focus, input:focus { outline: none; border-color: var(--gold); }
    .btn {
      background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: var(--radius-sm); padding: 7px 12px; font-size: 0.82rem; cursor: pointer;
      transition: all var(--transition); font-family: inherit;
    }
    .btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .btn.primary { color: var(--gold); border-color: rgba(200,169,110,0.35); background: var(--gold-dim); }
    .btn.primary:hover { background: rgba(200,169,110,0.25); }
    .btn.danger:hover { color: var(--red); border-color: rgba(248,113,113,0.4); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .update-time { font-size: 0.74rem; color: var(--text-muted); margin-left: auto; }

    /* tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim);
      padding: 10px 14px; font-size: 0.9rem; cursor: pointer; font-family: inherit; transition: all var(--transition);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .pill { font-size: 0.68rem; background: var(--gold-dim); color: var(--gold); border-radius: 20px; padding: 1px 7px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* search */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-input-row { position: relative; display: flex; gap: 8px; }
    .search-input-row .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    #searchInput { flex: 1; min-width: 0; padding-left: 36px; }
    #searchBtn { white-space: nowrap; }
    /* 條件已變更、尚未執行搜尋的提示 */
    #searchBtn.dirty { border-color: var(--gold); background: rgba(200,169,110,0.35); color: var(--gold-light); }
    .lv-input { width: 68px; }
    /* 搜尋結果：卡片格線（每行 4 筆，點卡看詳情） */
    .search-results {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 1100px) { .search-results { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 800px)  { .search-results { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px)  { .search-results { grid-template-columns: 1fr; } }
    .search-results:empty { display: none; }
    /* 分頁列 */
    .search-pager { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 4px 2px; color: var(--text-dim); font-size: 0.82rem; }
    .page-btn {
      background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: var(--radius-sm); padding: 5px 11px; font-size: 0.8rem; cursor: pointer;
      font-family: inherit; transition: all var(--transition);
    }
    .page-btn:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .page-btn.active { color: var(--gold); background: var(--gold-dim); border-color: rgba(200,169,110,0.5); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-gap { color: var(--text-muted); padding: 0 2px; }
    .search-note { grid-column: 1 / -1; padding: 14px 4px; color: var(--text-muted); font-size: 0.85rem; }
    .result-card {
      display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      transition: all var(--transition); position: relative;
    }
    .result-card:hover, .result-card.kbd { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-1px); }
    .item-icon { width: 44px; height: 44px; border-radius: 6px; background: var(--bg-surface); flex-shrink: 0; object-fit: contain; }
    .result-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .result-name { font-size: 0.9rem; font-weight: 500; line-height: 1.3; word-break: break-word; }
    .result-cat { font-size: 0.72rem; color: var(--text-muted); }
    .result-craft { font-size: 0.7rem; color: var(--purple); }

    /* 製作職業篩選（複選 chip）*/
    .job-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
    .job-filter .jf-label { font-size: 0.76rem; color: var(--text-muted); margin-right: 2px; }
    .job-chip {
      background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 20px; padding: 3px 12px; font-size: 0.8rem; cursor: pointer;
      transition: all var(--transition); font-family: inherit;
    }
    .job-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .job-chip.active { color: var(--purple); background: var(--purple-dim); border-color: rgba(167,139,250,0.5); }
    .tag {
      font-size: 0.68rem; padding: 1px 7px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap;
    }
    .tag.untradable { color: var(--red); background: var(--red-dim); border-color: rgba(248,113,113,0.25); }
    .tag.craftable  { color: var(--purple); background: var(--purple-dim); border-color: rgba(167,139,250,0.25); }
    .tag.hq { color: var(--amber); background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.25); }
    .tag.nq { color: var(--text-dim); background: var(--bg-surface); border-color: var(--border); }
    .tag.world { color: var(--blue); background: var(--blue-dim); border-color: rgba(79,195,247,0.25); }

    /* item detail */
    .item-detail:empty { display: none; }
    .item-detail:not(:empty) { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
    .detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .detail-head .item-icon { width: 44px; height: 44px; }
    .detail-title { font-size: 1.15rem; font-weight: 600; }
    .detail-sub { font-size: 0.76rem; color: var(--text-muted); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 16px; }
    .stat {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    }
    .stat .label { font-size: 0.72rem; color: var(--text-muted); }
    .stat .value { font-size: 1.05rem; font-weight: 600; color: var(--gold-light); margin-top: 2px; }
    .stat .value small { font-size: 0.72rem; color: var(--text-dim); font-weight: 400; }

    table.listings { width: 100%; border-collapse: collapse; font-size: 0.84rem; margin-top: 6px; }
    table.listings th, table.listings td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    table.listings th { color: var(--text-muted); font-weight: 600; font-size: 0.74rem; }
    table.listings td.num, table.listings th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.listings tr:hover td { background: var(--bg-card-hover); }

    .section-title { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .toggle-row { display: flex; gap: 6px; align-items: center; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .seg button { background: var(--bg-surface); border: none; color: var(--text-dim); padding: 5px 12px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .seg button.active { background: var(--gold-dim); color: var(--gold); }

    .qty-add { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .qty-add input { width: 72px; }

    /* craft list */
    .empty-state { text-align: center; color: var(--text-muted); padding: 48px 16px; font-size: 0.9rem; }

    /* craft 子分頁（簡易 / 樹狀）*/
    .craft-subtabs { margin-bottom: 12px; }

    /* 簡易清單：橫向一層式（成品 ▶ 直接原料） */
    .simple-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 10px;
    }
    .sr-prod, .sr-mat {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      border-radius: var(--radius-sm); padding: 7px 11px; transition: all var(--transition);
    }
    .sr-prod { background: var(--gold-dim); border: 1px solid rgba(200,169,110,0.5); flex: 0 0 auto; }
    .sr-prod:hover { border-color: var(--gold); }
    .sr-mat { background: var(--bg-surface); border: 1px solid var(--border); }
    .sr-mat:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
    .sr-arrow { color: var(--text-muted); font-size: 0.9rem; flex: 0 0 auto; }
    .sr-mats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; min-width: 0; }
    .sr-ic { width: 32px; height: 32px; border-radius: 5px; background: var(--bg-card); object-fit: contain; flex-shrink: 0; }
    .sr-nm { font-size: 0.84rem; line-height: 1.3; }
    .sr-sub { font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .sr-price { color: var(--gold-light); font-weight: 600; }
    .sr-total { font-size: 0.78rem; color: var(--text-dim); padding: 4px 8px; white-space: nowrap; }

    /* craft 子工具列（水晶 / HQ 選項）*/
    .craft-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 14px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-dim); cursor: pointer; user-select: none; }
    .switch input { display: none; }
    .switch .track { width: 38px; height: 20px; border-radius: 20px; background: var(--bg-surface); border: 1px solid var(--border); position: relative; transition: all var(--transition); flex-shrink: 0; }
    .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-muted); transition: all var(--transition); }
    .switch input:checked + .track { background: var(--gold-dim); border-color: rgba(200,169,110,0.5); }
    .switch input:checked + .track::after { left: 20px; background: var(--gold); }

    /* per-item panel */
    .craft-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .stepper button { background: var(--bg-surface); border: none; color: var(--text-dim); width: 24px; height: 26px; cursor: pointer; font-size: 0.95rem; }
    .stepper button:hover { color: var(--text); background: var(--bg-card-hover); }
    .stepper input { width: 42px; text-align: center; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-radius: 0; padding: 4px 0; font-size: 0.85rem; }

    /* ── 製作價格樹（節點圖 / org-chart）── */
    .tree-scroll { overflow-x: auto; padding: 16px 10px 18px; }
    .tree { display: inline-block; min-width: 100%; }
    .tree ul { display: flex; justify-content: center; padding-top: 18px; position: relative; margin: 0; }
    .tree li { list-style: none; position: relative; padding: 18px 6px 0; display: flex; flex-direction: column; align-items: center; }
    .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--line, var(--border)); width: 50%; height: 18px; }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line, var(--border)); }
    .tree li:only-child::before, .tree li:only-child::after { display: none; }
    .tree > ul > li { padding-top: 0; }
    .tree > ul > li::before, .tree > ul > li::after { display: none; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 2px solid var(--line, var(--border)); border-radius: 0 6px 0 0; }
    .tree li:first-child::after { border-radius: 6px 0 0 0; }
    .tree ul.children::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--line, var(--border)); width: 0; height: 18px; }
    .tree ul.children.green, .tree ul.children.green > li { --line: var(--green); }

    /* node card */
    .node-card { position: relative; width: 132px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px 8px; text-align: center; cursor: pointer; transition: all var(--transition); }
    .node-card:hover { border-color: var(--gold); background: var(--bg-card-hover); transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .node-card.root { width: 156px; border-color: rgba(200,169,110,0.6); background: var(--gold-dim); }
    .node-card.grand-root { width: 200px; cursor: default; border-color: rgba(200,169,110,0.7); background: var(--gold-dim); padding: 12px 10px; }
    .node-card.grand-root .nm { font-size: 0.86rem; font-weight: 600; color: var(--gold-light); max-height: none; }
    .node-card.grand-root .pr { font-size: 1.05rem; color: var(--gold-light); }
    .node-card.grand-root .wd { color: var(--text-dim); }
    .node-card.prod { border-color: rgba(74,222,128,0.45); }
    .node-card.mat  { border-color: var(--border); }
    .node-qty { position: absolute; top: -9px; left: -9px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 20px; background: var(--purple); color: #fff; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .node-copy, .node-del { position: absolute; top: 4px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.78rem; padding: 2px; line-height: 1; }
    .node-copy { right: 4px; }
    .node-copy:hover { color: var(--gold); }
    .node-del { right: 22px; font-size: 0.8rem; }
    .node-del:hover { color: var(--red); }
    .node-card .ic { width: 40px; height: 40px; border-radius: 5px; background: var(--bg-card); object-fit: contain; margin: 4px auto 4px; display: block; }
    .node-card .nm { font-size: 0.78rem; line-height: 1.25; max-height: 2.5em; overflow: hidden; }
    .node-card .pr { font-size: 0.88rem; font-weight: 600; color: var(--gold-light); font-variant-numeric: tabular-nums; margin-top: 3px; }
    .node-card .pr.none { color: var(--text-muted); font-weight: 400; font-size: 0.76rem; }
    .node-card .hqb { display: inline-block; font-size: 0.6rem; font-weight: 700; color: var(--amber); background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); border-radius: 3px; padding: 0 3px; margin-right: 3px; vertical-align: 1px; }
    .node-card .wd { font-size: 0.66rem; color: var(--blue); margin-top: 1px; }
    .node-card .pr.done { color: var(--green); font-size: 0.8rem; }
    .node-card.have { opacity: .6; border-color: rgba(74,222,128,0.45); }
    .node-card.have .nm { text-decoration: line-through; }
    .node-root-controls { display: flex; align-items: center; justify-content: center; margin-top: 6px; }
    /* 每張節點卡都能就地標「我有了」——樹上看到哪一層有，就在哪一層勾 */
    .node-have {
      display: block; width: 100%; margin-top: 6px; padding: 3px 4px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-muted); font-size: 0.68rem; font-family: inherit; cursor: pointer;
      transition: all var(--transition);
    }
    .node-have:hover { color: var(--green); border-color: var(--green); }
    .node-have.on { color: var(--green); background: var(--green-dim); border-color: rgba(74,222,128,0.45); }
    @media (pointer: coarse) { .node-have { min-height: var(--tap-min, 44px); } }

    /* comparison badge */
    .cmp-badge { margin: 14px auto 0; font-size: 0.72rem; line-height: 1.4; border-radius: 6px; padding: 5px 9px; text-align: center; max-width: 210px; }
    .cmp-badge .l2 { font-weight: 700; margin-top: 1px; }
    .cmp-craft { background: var(--green-dim); border: 1px solid rgba(74,222,128,0.3); }
    .cmp-craft .l2 { color: var(--green); }
    .cmp-buy { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); }
    .cmp-buy .l2 { color: var(--red); }
    .cmp-na { background: var(--bg-surface); border: 1px solid var(--border); }
    .cmp-na .l2 { color: var(--amber); }
    .root-badge { margin: 0 auto; font-size: 0.76rem; background: var(--green-dim); border: 1px solid rgba(74,222,128,0.3); border-radius: 6px; padding: 6px 12px; text-align: center; max-width: 300px; }
    .root-badge.cmp-na { background: var(--bg-surface); border-color: var(--border); }
    .root-badge .big { font-weight: 700; color: var(--green); margin-top: 1px; }
    .root-badge.cmp-na .big { color: var(--amber); }

    /* legend */
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.72rem; color: var(--text-muted); padding: 12px 16px; border-top: 1px solid var(--border); align-items: center; }
    .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }
    .sw-root { border-color: rgba(200,169,110,0.6); background: var(--gold-dim); }
    .sw-prod { border-color: rgba(74,222,128,0.6); background: var(--green-dim); }
    .sw-mat  { border-color: var(--border); background: var(--bg-surface); }
    .sw-line { width: 16px; height: 0; border: 0; border-top: 2px solid var(--green); border-radius: 0; margin-right: 5px; vertical-align: 3px; }

    /* node detail modal */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.62); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
    .modal-mask.open { display: flex; }
    .modal { background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: var(--radius); max-width: 560px; width: 100%; padding: 18px; box-shadow: 0 12px 48px rgba(0,0,0,.5); }
    .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .modal-head .ic { width: 40px; height: 40px; border-radius: 5px; background: var(--bg-surface); }
    .modal-head .t { font-size: 1.05rem; font-weight: 600; flex: 1; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.3rem; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: var(--red); }
    .nav-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
    .nav-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px 4px 4px; font-size: 0.78rem; cursor: pointer; transition: all var(--transition); }
    .nav-chip:hover { border-color: var(--gold); color: var(--gold-light); }
    .nav-chip img { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-card); }

    /* summary */
    .summary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 18px 0; }
    .summary-totals { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 12px; margin-bottom: 14px; }
    .summary-totals .stat .value.save { color: var(--green); }
    .summary-totals .stat .value.bad  { color: var(--red); }

    /* 最適採買路線（依伺服器） */
    .route-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 8px; }
    .route-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
    .route-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .route-head .route-sub { font-size: 0.82rem; font-weight: 600; color: var(--gold-light); font-variant-numeric: tabular-nums; }
    .route-line { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: var(--text-dim); padding: 2px 0; }
    .route-line span:last-child { font-variant-numeric: tabular-nums; color: var(--text); }
    .route-line.got-done { opacity: .45; }
    .route-line.got-done span:first-child { text-decoration: line-through; }

    /* 總採買清單：已收集進度 */
    .got-progress { margin: 2px 0 10px; }
    .got-line { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
    .got-line b { color: var(--green); }
    .got-line span:last-child { font-variant-numeric: tabular-nums; }
    .got-bar { height: 6px; border-radius: 4px; background: var(--bg-surface); border: 1px solid var(--border); overflow: hidden; }
    .got-bar-fill { height: 100%; background: var(--gold); transition: width .25s; }
    .got-bar-fill.full { background: var(--green); }
    .got-cell { white-space: nowrap; }
    .got-input { width: 60px; padding: 3px 6px; font-size: 0.8rem; text-align: right; }
    .got-all { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; font-size: 0.72rem; padding: 4px 7px; margin-left: 4px; vertical-align: middle; }
    .got-all:hover { color: var(--green); border-color: var(--green); }
    table.listings tr.got-done td { opacity: .5; }
    table.listings tr.got-done td:first-child { text-decoration: line-through; }
    table.listings tr.got-done td.got-cell { opacity: 1; }

    /* 製作計畫：縮排可折疊的樹狀表格。
       層級靠「縮排＋導引線」表達（不是只靠顏色分區），每列都能勾「已有」。
       設計依據見 JS 內 flattenPlan 的註解。 */
    .shop-hint { margin: 0 0 8px; }
    .plan-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
    .plan-seg button { font-size: 0.78rem; padding: 5px 11px; }
    .plan-bulk { display: inline-flex; gap: 6px; }
    .plan-bulk .btn { padding: 3px 9px; font-size: 0.74rem; }
    .plan-legend { margin-left: auto; font-size: 0.74rem; color: var(--text-muted); }
    .plan-legend .lg-mid, .plan-legend .lg-base {
      display: inline-block; width: 11px; height: 11px; border-radius: 3px;
      margin: 0 5px 0 12px; vertical-align: -1px; border: 1px solid var(--border);
    }
    .plan-legend .lg-mid { background: var(--green-dim); border-color: rgba(74,222,128,0.4); }
    .plan-legend .lg-base { background: var(--bg-card); }
    /* 綠底＝中間素材（有配方、自己做得出來）；無底色＝基礎素材。
       這跟「買／做」的建議是兩個不同的軸——中間素材也可能因為市價便宜而建議用買的。 */
    table.listings tr.plan-mid td { background: var(--green-dim); }
    table.listings tr.plan-mid:hover td { background: rgba(74,222,128,0.2); }
    table.listings tr.plan-total th { color: var(--text-dim); font-weight: 600; }
    table.listings tr.plan-total td { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold-light); }
    .plan-cell { display: flex; align-items: stretch; gap: 6px; min-height: 34px; }
    .plan-guide { flex: 0 0 16px; border-left: 1px solid var(--border); }
    .plan-toggle {
      flex: 0 0 22px; align-self: stretch; background: none; border: none; padding: 0;
      color: var(--text-secondary); cursor: pointer; font-size: 0.82rem; line-height: 1;
    }
    .plan-toggle:hover { color: var(--gold); }
    .plan-spacer { flex: 0 0 22px; }
    .plan-ic { width: 24px; height: 24px; border-radius: 4px; background: var(--bg-surface); object-fit: contain; align-self: center; flex-shrink: 0; }
    .plan-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .plan-nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .plan-node { cursor: pointer; border-radius: 3px; }
    .plan-node:hover { color: var(--gold-light); text-decoration: underline; }
    .plan-node:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .plan-of { color: var(--text-muted); font-weight: 400; }
    .plan-badge { font-size: 0.66rem; font-weight: 700; border-radius: 3px; padding: 0 5px; border: 1px solid; white-space: nowrap; }
    .plan-badge.buy   { color: var(--blue);  background: var(--blue-dim);  border-color: rgba(79,195,247,0.3); }
    .plan-badge.craft { color: var(--green); background: var(--green-dim); border-color: rgba(74,222,128,0.3); }
    .plan-badge.have  { color: var(--green); background: var(--green-dim); border-color: rgba(74,222,128,0.35); }
    .plan-badge.na    { color: var(--amber); background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.3); }
    table.listings tr.plan-have td { opacity: .55; }
    table.listings tr.plan-have .plan-nm { text-decoration: line-through; }
    table.listings tr.plan-have td.got-cell { opacity: 1; }
    /* 手指操作時把展開鈕與 ✓ 鈕的命中區拉高（只長高，不撐寬——見知識庫 §3.9） */
    @media (pointer: coarse) {
      .plan-toggle, .got-all { min-height: var(--tap-min, 44px); }
    }
    /* 六欄表在窄螢幕會超出：讓它自己橫捲，而不是撐破版面或把「野營套裝」壓成一字一行。
       沒有 min-width 的話 table 會硬縮欄寬，wrapper 反而永遠捲不動。 */
    .shop-scroll { overflow-x: auto; }
    .shop-scroll table.listings { min-width: 660px; }
    .shop-scroll table.listings > * > tr > :first-child { min-width: 260px; }
    .shop-use { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    .craft-actions, .list-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    /* saved lists */
    .saved-row {
      display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    }
    .saved-row .meta { flex: 1; }
    .saved-row .nm { font-weight: 600; }
    .saved-row .sub { font-size: 0.74rem; color: var(--text-muted); }

    .note { font-size: 0.78rem; color: var(--text-muted); }
    .loading { color: var(--text-dim); font-size: 0.85rem; padding: 10px 0; }
    .error { color: var(--red); font-size: 0.85rem; padding: 10px 0; }

    footer { border-top: 1px solid var(--border); margin-top: 40px; padding: 24px 0; text-align: center; }
    footer .ft { font-size: 0.75rem; color: var(--text-muted); }
    footer .ft a:hover { color: var(--gold); }

    @media (max-width: 600px) {
      .update-time { margin-left: 0; width: 100%; }
      .tab { padding: 9px 9px; font-size: 0.82rem; }
    }
  </style>

  <script>
  (function () {
    'use strict';

    var ICON_CDN = 'https://xivapi.com';
    var LS_LISTS = 'sgt-market-lists';
    var LS_SCOPE = 'sgt-market-scope';
    var LS_DRAFT = 'sgt-market-draft';
    var LS_OPTS = 'sgt-market-opts';
    var LS_CVIEW = 'sgt-market-craftview';
    var LS_GOT = 'sgt-market-got';
    var LS_PVIEW = 'sgt-market-planview';
    var PAGE_SIZE = 60;                // 每頁筆數（結果總數不設上限）
    var MAX_DEPTH = 12;
    var MAX_CRAFT_ITEMS = 10;          // 製作清單至多 10 件，避免合併樹狀圖過大

    // ---- 狀態 ----
    var items = [];
    var itemById = new Map();
    var recipesByItem = null;          // itemId -> 配方（延後載入）
    var usedInByItem = null;           // ingredientId -> Set<成品 itemId>（反查「向上」用途）
    var recipeJobsByItem = null;       // itemId -> Map<職業名, {job, level, stars}>（同職業取最低等級配方）
    var gamePatch = '7.15';
    var scope = 'dc';
    var craft = [];                    // [{itemId, qty}]
    var lists = [];                    // 具名清單
    var priceMap = new Map();          // itemId -> { nq, nqWorld, hq, hqWorld } 依目前 scope
    var lastUpload = 0;
    var excludeCrystals = true;        // 省略水晶（不列入樹與成本），預設開
    var hqProduct = true;              // 可製作成品以 HQ 市價比較，預設開
    var craftView = 'simple';          // 製作清單子分頁：simple（簡易清單）/ tree（樹狀分析）
    var gotMap = {};                   // 「手上已有」的數量：itemId -> 已有數。**會參與計畫計算**：
                                       // 標記已有的節點整個子樹會從計畫消失（清空清單時一併重設）
    var planIndex = new Map();         // 目前計畫每個物品的合計 {qty, need}，供「✓ 我有了」一次補滿
    var planOpen = new Map();          // 計畫清單展開狀態的個別覆寫：path -> 是否展開（不持久化）
    var planAll = null;                // 全部展開／收合：true／false／null＝各自照預設
    var planView = 'tree';             // 製作計畫檢視：tree 階層／direct 直接材料／all 全部素材／base 基礎素材／mid 中間物
    var craftToken = 0;                // 製作清單渲染競態守門（切換檢視時放棄舊的非同步渲染）

    // ---- 工具 ----
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var fmt = function (n) { return Universalis.fmtGil(n); };
    function iconUrl(it) { return it && it.icon ? ICON_CDN + it.icon : ''; }

    /* 把 items-market.json 的陣列列展開回本頁其餘程式吃的物件形狀。
       列格式：[id, name, categoryIndex, iconNo, marketable(0/1), patch]
       icon 路徑由編號組回——格式固定是 /i/<編號/1000*1000>/<編號>.png，
       build 腳本已對 43748 筆驗證過資料夾都推得回來（不符就會中止不產檔）。 */
    function expandMarketItems(db) {
      var cats = db.categories || [];
      return db.data.map(function (r) {
        var no = r[3];                       // -1 ＝沒有 icon；0 是合法編號，不能當假值判斷
        var icon = no < 0 ? null
          : '/i/' + String(Math.floor(no / 1000) * 1000).padStart(6, '0') + '/' + String(no).padStart(6, '0') + '.png';
        return {
          id: r[0], name: r[1],
          category: cats[r[2]] || null,      // 空字串還原成 null，與 items.json 一致
          icon: icon, marketable: !!r[4], patch: r[5] || null
        };
      });
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    function relTime(ms) {
      if (!ms) return '';
      var d = Date.now() - ms, m = Math.round(d / 60000);
      if (m < 1) return '剛剛';
      if (m < 60) return m + ' 分鐘前';
      var h = Math.round(m / 60); if (h < 24) return h + ' 小時前';
      return Math.round(h / 24) + ' 天前';
    }
    function scopeLabel() { return scope === 'dc' ? '全DC（陸行鳥）' : Universalis.worldName(Number(scope)); }
    function isDcMode() { return scope === 'dc'; }

    // ---- localStorage ----
    function loadState() {
      try { scope = localStorage.getItem(LS_SCOPE) || 'dc'; } catch (e) {}
      try { lists = JSON.parse(localStorage.getItem(LS_LISTS) || '[]'); } catch (e) { lists = []; }
      try { craft = JSON.parse(localStorage.getItem(LS_DRAFT) || '[]'); } catch (e) { craft = []; }
      try { var o = JSON.parse(localStorage.getItem(LS_OPTS) || '{}'); if (o && typeof o === 'object') { if (o.excludeCrystals != null) excludeCrystals = !!o.excludeCrystals; if (o.hqProduct != null) hqProduct = !!o.hqProduct; } } catch (e) {}
      try { var cv = localStorage.getItem(LS_CVIEW); if (cv === 'simple' || cv === 'tree') craftView = cv; } catch (e) {}
      try { gotMap = JSON.parse(localStorage.getItem(LS_GOT) || '{}'); } catch (e) { gotMap = {}; }
      try { var pv = localStorage.getItem(LS_PVIEW); if (pv && ['tree', 'direct', 'all', 'base', 'mid'].indexOf(pv) >= 0) planView = pv; } catch (e) {}
      if (!gotMap || typeof gotMap !== 'object' || Array.isArray(gotMap)) gotMap = {};
      if (!Array.isArray(lists)) lists = [];
      if (!Array.isArray(craft)) craft = [];
    }
    function saveLists() { try { localStorage.setItem(LS_LISTS, JSON.stringify(lists)); } catch (e) {} }
    function saveDraft() { try { localStorage.setItem(LS_DRAFT, JSON.stringify(craft)); } catch (e) {} }
    function saveScope() { try { localStorage.setItem(LS_SCOPE, scope); } catch (e) {} }
    function saveOpts() { try { localStorage.setItem(LS_OPTS, JSON.stringify({ excludeCrystals: excludeCrystals, hqProduct: hqProduct })); } catch (e) {} }
    function saveCview() { try { localStorage.setItem(LS_CVIEW, craftView); } catch (e) {} }
    function saveGot() { try { localStorage.setItem(LS_GOT, JSON.stringify(gotMap)); } catch (e) {} }
    function savePview() { try { localStorage.setItem(LS_PVIEW, planView); } catch (e) {} }
    function gotOf(id) { var v = Number(gotMap[id]); return isFinite(v) && v > 0 ? Math.floor(v) : 0; }

    function isCrystal(id) { var it = itemById.get(id); return !!(it && it.category === '水晶'); }
    function getQty(id) { var c = craft.find(function (x) { return x.itemId === id; }); return c ? c.qty : 1; }
    function copyName(name) {
      // clipboard API 失敗時退回 execCommand（非安全環境／遊戲內瀏覽器）
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = name;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(name).catch(fallback);
      } else {
        fallback();
      }
    }

    // ---- 延遲載入工具：promise 記憶化（背景預載與使用時同呼叫不重複抓取；失敗清空可重試）----
    function lazyJson(url) {
      var p = null;
      return function () {
        if (!p) p = fetch(url).then(function (r) {
          if (!r.ok) throw new Error(url + ' HTTP ' + r.status);
          return r.json();
        }).catch(function (e) { p = null; throw e; });
        return p;
      };
    }

    // ---- 裝備限制資料（equip.json：{ jobs, names, items: {id:[裝等,[職業索引]]} }）----
    var equipData = null;
    var loadEquipRaw = lazyJson('../../data/equip.json');
    function ensureEquip() {
      return loadEquipRaw().then(function (d) { equipData = d; return d; });
    }

    // 職能分類（名稱依繁中版官方網站：防護職業/治療職業；進攻依官方敘述拆近戰/遠程物理/遠程魔法）。
    // 集合含基礎職——低等裝備的職業清單常只標基礎職；「全職業可裝」＝含 ADV 標記的無職業限制裝備。
    var EQUIP_ROLES = [
      { key: 'all',      name: '全職業可裝',   abbrs: ['ADV'] },
      { key: 'tank',     name: '防護職業',     abbrs: ['GLA', 'PLD', 'MRD', 'WAR', 'DRK', 'GNB'] },
      { key: 'healer',   name: '治療職業',     abbrs: ['CNJ', 'WHM', 'SCH', 'AST', 'SGE'] },
      { key: 'melee',    name: '近戰職業',     abbrs: ['PGL', 'MNK', 'LNC', 'DRG', 'ROG', 'NIN', 'SAM', 'RPR', 'VPR'] },
      { key: 'pranged',  name: '遠程物理職業', abbrs: ['ARC', 'BRD', 'MCH', 'DNC'] },
      { key: 'caster',   name: '遠程魔法職業', abbrs: ['THM', 'BLM', 'ACN', 'SMN', 'RDM', 'BLU', 'PCT'] },
      { key: 'crafter',  name: '製作職業',     abbrs: ['CRP', 'BSM', 'ARM', 'GSM', 'LTW', 'WVR', 'ALC', 'CUL'] },
      { key: 'gatherer', name: '採集職業',     abbrs: ['MIN', 'BTN', 'FSH'] }
    ];
    // 個別職業選單不列出基礎職與冒險者（僅在職能集合內參與比對）
    var HIDDEN_JOBS = { ADV: 1, GLA: 1, PGL: 1, MRD: 1, LNC: 1, ARC: 1, CNJ: 1, THM: 1, ACN: 1, ROG: 1 };

    // 選單值 → 職業索引集合：'g:tank'＝職能、'j:PLD'＝單一職業；需 equipData 已載入
    function equipJobIdxSet(ej) {
      var abbrs;
      if (ej.indexOf('g:') === 0) {
        var role = null;
        for (var i = 0; i < EQUIP_ROLES.length; i++) if (EQUIP_ROLES[i].key === ej.slice(2)) role = EQUIP_ROLES[i];
        abbrs = role ? role.abbrs : [];
      } else {
        abbrs = [ej.slice(2)];
      }
      var s = new Set();
      abbrs.forEach(function (a) { var idx = equipData.jobs.indexOf(a); if (idx >= 0) s.add(idx); });
      return s;
    }
    function equipJobLabel(ej) {
      if (ej.indexOf('g:') === 0) {
        for (var i = 0; i < EQUIP_ROLES.length; i++) if (EQUIP_ROLES[i].key === ej.slice(2)) return EQUIP_ROLES[i].name;
        return ej;
      }
      return equipData ? equipData.names[ej.slice(2)] : ej.slice(2);
    }

    // ---- 配方索引（延後載入）----
    var loadRecipesRaw = lazyJson('../../data/recipes.json');
    var recipesPromise = null;
    function ensureRecipes() {
      if (!recipesPromise) recipesPromise = loadRecipes().catch(function (e) { recipesPromise = null; throw e; });
      return recipesPromise;
    }
    async function loadRecipes() {
      var db = await loadRecipesRaw();
      recipesByItem = new Map();
      usedInByItem = new Map();
      recipeJobsByItem = new Map();
      var score = function (r) { return (r.expert ? 1e6 : 0) + (r.rlvl || 0); };
      for (var i = 0; i < db.data.length; i++) {
        var r = db.data[i];
        var cur = recipesByItem.get(r.itemId);
        if (!cur || score(r) < score(cur)) recipesByItem.set(r.itemId, r);
        if (r.job) {
          var jm = recipeJobsByItem.get(r.itemId);
          if (!jm) { jm = new Map(); recipeJobsByItem.set(r.itemId, jm); }
          var ej = jm.get(r.job);
          if (!ej || r.level < ej.level) jm.set(r.job, { job: r.job, level: r.level, stars: r.stars || 0 });
        }
        for (var j = 0; j < r.ingredients.length; j++) {
          var gid = r.ingredients[j].itemId;
          var s = usedInByItem.get(gid);
          if (!s) { s = new Set(); usedInByItem.set(gid, s); }
          s.add(r.itemId);
        }
      }
      return recipesByItem;
    }

    // 可製作物品的職業＋等級需求文字（需先 ensureRecipes），如「鍛鐵匠 Lv.62★★／鑄甲匠 Lv.61」
    function craftJobsText(id) {
      var jm = recipeJobsByItem && recipeJobsByItem.get(id);
      if (!jm || !jm.size) return '';
      return Array.from(jm.values()).map(function (j) {
        return j.job + ' Lv.' + j.level + (j.stars ? Array(j.stars + 1).join('★') : '');
      }).join('／');
    }
    // 詳情視窗副標用
    function craftJobsHtml(id) {
      var txt = craftJobsText(id);
      return txt ? ' · 🔨 製作：' + esc(txt) : '';
    }
    // 搜尋卡用（配方載入完成前回空字串，載入後由 init 補渲染）
    function craftJobsLine(id) {
      var txt = craftJobsText(id);
      return txt ? '<span class="result-craft">🔨 ' + esc(txt) + '</span>' : '';
    }

    // ===================== 搜尋（全延遲觸發：條件皆 staged，按搜尋鈕／Enter 才執行）=====================
    var jobFilter = new Set();         // 製作職業篩選（複選；空＝不篩）
    var searchOut = [];                // 目前搜尋結果（換頁重繪用）
    var searchPage = 1;                // 目前頁碼
    var searchToken = 0;               // 連續搜尋競態守門

    function matchesJobFilter(it) {
      if (!jobFilter.size) return true;
      var jm = recipeJobsByItem && recipeJobsByItem.get(it.id);
      if (!jm) return false;
      var ks = Array.from(jm.keys());
      for (var i = 0; i < ks.length; i++) if (jobFilter.has(ks[i])) return true;
      return false;
    }

    // 範圍輸入解析：留空＝不限；min>max 靜默交換（同時回寫輸入框讓交換可見）
    function parseRange(minEl, maxEl) {
      var min = minEl.value === '' ? null : Math.max(1, parseInt(minEl.value, 10) || 1);
      var max = maxEl.value === '' ? null : Math.max(1, parseInt(maxEl.value, 10) || 1);
      if (min != null && max != null && min > max) {
        var t = min; min = max; max = t;
        minEl.value = min; maxEl.value = max;
      }
      return { min: min, max: max, active: min != null || max != null };
    }

    // 製作等級：任一配方職業等級落在範圍內（若有選職業 chips，只看被選職業的配方）
    function matchesCraftLv(it, cr) {
      if (!cr.active) return true;
      var jm = recipeJobsByItem && recipeJobsByItem.get(it.id);
      if (!jm) return false;
      var ok = false;
      jm.forEach(function (j) {
        if (ok) return;
        if (jobFilter.size && !jobFilter.has(j.job)) return;
        if ((cr.min == null || j.level >= cr.min) && (cr.max == null || j.level <= cr.max)) ok = true;
      });
      return ok;
    }

    // 裝備限制：非裝備物品在任一裝備條件下一律排除；ejSet＝允許職業索引集合（null＝不篩）
    function matchesEquip(it, er, ejSet) {
      if (!er.active && !ejSet) return true;
      var e = equipData && equipData.items[it.id];
      if (!e) return false;
      if (er.min != null && e[0] < er.min) return false;
      if (er.max != null && e[0] > er.max) return false;
      if (ejSet) {
        var hit = false;
        for (var i = 0; i < e[1].length; i++) if (ejSet.has(e[1][i])) { hit = true; break; }
        if (!hit) return false;
      }
      return true;
    }

    // 排序鍵：製作＝各職業配方最高等級需求（★ 當小數細分）；裝備＝裝備等級。無資料回 -1（固定排最後）
    function craftLevelKey(id) {
      var jm = recipeJobsByItem && recipeJobsByItem.get(id);
      if (!jm || !jm.size) return -1;
      var mx = 0;
      jm.forEach(function (j) { var k = j.level + (j.stars || 0) / 10; if (k > mx) mx = k; });
      return mx;
    }
    function equipLevelKey(id) {
      var e = equipData && equipData.items[id];
      return e ? e[0] : -1;
    }

    function resultCardHtml(it) {
      var tags = '';
      if (!it.marketable) tags += '<span class="tag untradable">不可交易</span>';
      return '<div class="result-card" data-id="' + it.id + '" title="點擊查看即時價格與在架明細">' +
        '<img class="item-icon" src="' + iconUrl(it) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="result-meta"><span class="result-name">' + esc(it.name) + '</span>' +
        '<span class="result-cat">' + esc(it.category || '') + '</span>' + craftJobsLine(it.id) + '</div>' + tags +
        '</div>';
    }

    // 條件變更（尚未執行）→ 搜尋鈕高亮提示
    function markDirty() { $('#searchBtn').classList.add('dirty'); }

    // 目前生效條件的人話描述（查無訊息點名兇手用）
    function condsText(cr, er, ej) {
      var parts = [];
      if (jobFilter.size) parts.push('製作職業：' + Array.from(jobFilter).join('、'));
      if (cr.active) parts.push('製作等級 ' + (cr.min == null ? '1' : cr.min) + '–' + (cr.max == null ? '不限' : cr.max));
      if (er.active) parts.push('裝備等級 ' + (er.min == null ? '1' : er.min) + '–' + (er.max == null ? '不限' : er.max));
      if (ej !== '') parts.push('裝備職業：' + equipJobLabel(ej));
      return parts.length ? '（' + parts.join('；') + '）' : '';
    }

    // 執行搜尋：讀取目前所有條件 → 平行載入所需資料 → 過濾＋排序＋分頁
    async function executeSearch() {
      var box = $('#searchResults');
      var q = $('#searchInput').value.trim();
      var cr = parseRange($('#craftMin'), $('#craftMax'));
      var er = parseRange($('#equipMin'), $('#equipMax'));
      var ej = $('#equipJob').value;
      var sort = $('#sortSel').value;
      searchOut = []; searchPage = 1;

      var hasCond = jobFilter.size || cr.active || er.active || ej !== '';
      if (!q && !hasCond) {
        box.innerHTML = '<div class="search-note">請輸入關鍵字或設定篩選條件。</div>';
        $('#searchBtn').classList.remove('dirty');
        return;
      }
      $('#searchBtn').classList.remove('dirty');

      // 需要的資料平行載入；失敗明確報錯，絕不靜默顯示查無（ENG-1）
      var needs = [ensureRecipes()];   // 卡片職業列與製作排序皆用（init 已背景預載，多半即時）
      if (er.active || ej !== '' || sort.indexOf('equip') === 0) needs.push(ensureEquip());
      var t = ++searchToken;
      box.innerHTML = '<div class="search-note">查詢中…</div>';
      try { await Promise.all(needs); }
      catch (e) {
        if (t !== searchToken) return;
        box.innerHTML = '<div class="search-note" style="color:var(--red)">資料載入失敗，請按上方「↻ 重新整理」或稍後再按搜尋重試。</div>';
        return;
      }
      if (t !== searchToken) return;   // 期間又按了一次搜尋

      var ejSet = ej !== '' ? equipJobIdxSet(ej) : null;
      var starts = [], contains = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.name || !PatchGate.released(it.patch, gamePatch)) continue;
        if (!matchesJobFilter(it)) continue;
        if (!matchesCraftLv(it, cr)) continue;
        if (!matchesEquip(it, er, ejSet)) continue;
        if (!q) starts.push(it);       // 純條件查詢（按鈕制下意圖明確，允許）
        else {
          var idx = it.name.indexOf(q);
          if (idx === 0) starts.push(it);
          else if (idx > 0) contains.push(it);
        }
      }
      // 可交易物品優先（查價工具主要對象），組內維持原順序
      var byMarketable = function (a, b) { return (b.marketable ? 1 : 0) - (a.marketable ? 1 : 0); };
      starts.sort(byMarketable);
      contains.sort(byMarketable);
      searchOut = starts.concat(contains);
      // 等級排序（穩定排序，等級相同時保留原相關性順序；無對應資料一律排最後）
      var keyFn = sort.indexOf('equip') === 0 ? equipLevelKey : craftLevelKey;
      var dir = /Asc$/.test(sort) ? 1 : -1;
      searchOut.sort(function (a, b) {
        var la = keyFn(a.id), lb = keyFn(b.id);
        if (la < 0 && lb < 0) return 0;
        if (la < 0) return 1;
        if (lb < 0) return -1;
        return (la - lb) * dir;
      });
      if (!searchOut.length) {
        box.innerHTML = '<div class="search-note">查無符合' + (q ? '「' + esc(q) + '」' : '') +
          esc(condsText(cr, er, ej)) + '的物品</div>';
        return;
      }
      renderResultsPage(false);
    }

    // 分頁渲染：每頁 PAGE_SIZE 筆，換頁時捲回結果頂端
    function renderResultsPage(scrollTop) {
      var box = $('#searchResults');
      var total = searchOut.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (searchPage < 1) searchPage = 1;
      if (searchPage > pages) searchPage = pages;
      var slice = searchOut.slice((searchPage - 1) * PAGE_SIZE, searchPage * PAGE_SIZE);
      var pager = '<div class="search-pager"><span>共 ' + fmt(total) + ' 筆' +
        (pages > 1 ? ' · 第 ' + searchPage + '/' + pages + ' 頁' : '') + '</span>';
      if (pages > 1) {
        pager += '<span style="margin-left:auto"></span>' +
          '<button class="page-btn" data-page="' + (searchPage - 1) + '"' + (searchPage <= 1 ? ' disabled' : '') + '>‹ 上一頁</button>';
        // 頁碼視窗：1、2 … 當前±2 … 末兩頁（頁數多時不整排展開）
        var win = [];
        var push = function (p) { if (p >= 1 && p <= pages && win.indexOf(p) < 0) win.push(p); };
        push(1); push(2);
        for (var p = searchPage - 2; p <= searchPage + 2; p++) push(p);
        push(pages - 1); push(pages);
        win.sort(function (a, b) { return a - b; });
        var last = 0;
        win.forEach(function (p2) {
          if (p2 - last > 1) pager += '<span class="page-gap">…</span>';
          pager += '<button class="page-btn' + (p2 === searchPage ? ' active' : '') + '" data-page="' + p2 + '">' + p2 + '</button>';
          last = p2;
        });
        pager += '<button class="page-btn" data-page="' + (searchPage + 1) + '"' + (searchPage >= pages ? ' disabled' : '') + '>下一頁 ›</button>';
      }
      pager += '</div>';
      box.innerHTML = slice.map(resultCardHtml).join('') + pager;
      if (scrollTop) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ===================== 單品明細 =====================
    var detailHq = false; // 明細表 HQ/NQ 篩選
    var currentDetailId = null;

    async function showDetail(id) {
      currentDetailId = id;
      var it = itemById.get(id);
      if (!it) return;
      var box = $('#itemDetail');
      box.innerHTML =
        '<div class="detail-head">' +
        '<img class="item-icon" src="' + iconUrl(it) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<div><div class="detail-title">' + esc(it.name) + '</div>' +
        '<div class="detail-sub">' + esc(it.category || '') + ' · 物品 #' + it.id + ' · 查價範圍：' + esc(scopeLabel()) + '</div></div></div>';

      if (!it.marketable) {
        box.innerHTML += '<div class="error">此物品無法在市場交易（不可上架）。</div>' + qtyAddHtml(id);
        bindQtyAdd(box, id);
        return;
      }
      box.innerHTML += '<div class="loading" id="detailLoading">查詢市場資料中…</div>';

      var agg = await Universalis.fetchAggregated(scope, [id]);
      var lst = await Universalis.fetchListings(scope, [id], { listings: 20 });
      if (currentDetailId !== id) return; // 期間切換了物品
      if (!agg && !lst) {
        box.innerHTML = box.innerHTML.replace(/<div class="loading"[^>]*>[^<]*<\/div>/, '') +
          '<div class="error">暫時無法連線 Universalis，請稍後再試或按重新整理。</div>' + qtyAddHtml(id);
        bindQtyAdd(box, id);
        return;
      }

      var aggItem = agg && agg.items ? agg.items[id] : null;
      var lstItem = lst && lst.items ? lst.items[id] : null;
      lastUpload = (lst && lst.lastUploadTime) || lastUpload;
      renderUpdateTime();

      var html = '';
      // 摘要
      html += '<div class="stat-grid">';
      html += statCheapest(aggItem, false);
      html += statCheapest(aggItem, true);
      html += statAvg(aggItem);
      html += statVelocity(aggItem);
      html += '</div>';

      // 明細表
      html += '<div class="section-title toggle-row">在架明細' +
        '<span class="seg" id="hqSeg" style="margin-left:auto">' +
        '<button data-hq="0" class="' + (detailHq ? '' : 'active') + '">NQ</button>' +
        '<button data-hq="1" class="' + (detailHq ? 'active' : '') + '">HQ</button></span></div>';
      html += listingsTable(lstItem);

      box.innerHTML = box.innerHTML.replace(/<div class="loading"[^>]*>[^<]*<\/div>/, '') + html + qtyAddHtml(id);

      var seg = $('#hqSeg', box);
      if (seg) seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { detailHq = b.getAttribute('data-hq') === '1'; showDetail(id); });
      });
      bindQtyAdd(box, id);
    }

    function statCheapest(aggItem, hq) {
      var q = aggItem && aggItem[hq ? 'hq' : 'nq'];
      var ml = q && q.minListing && (q.minListing.dc || q.minListing.world);
      var label = (hq ? 'HQ' : 'NQ') + ' 最低價';
      if (!ml) return stat(label, '—', '無在架');
      var where = ml.worldId ? Universalis.worldName(ml.worldId) : scopeLabel();
      return stat(label, fmt(ml.price) + ' <small>G</small>', isDcMode() ? '@ ' + esc(where) : esc(scopeLabel()));
    }
    function statAvg(aggItem) {
      var q = aggItem && aggItem.nq && aggItem.nq.averageSalePrice;
      var p = q && (q.dc || q.world);
      return stat('近期成交均價', p ? fmt(p.price) + ' <small>G</small>' : '—', 'NQ');
    }
    function statVelocity(aggItem) {
      var q = aggItem && aggItem.nq && aggItem.nq.dailySaleVelocity;
      var p = q && (q.dc || q.world);
      return stat('每日銷量', p ? (Math.round(p.quantity * 10) / 10) + ' <small>件/日</small>' : '—', 'NQ');
    }
    function stat(label, value, sub) {
      return '<div class="stat"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
        (sub ? '<div class="label" style="margin-top:2px">' + sub + '</div>' : '') + '</div>';
    }

    function listingsTable(lstItem) {
      var rows = (lstItem && lstItem.listings) ? lstItem.listings.filter(function (l) { return detailHq ? l.hq : !l.hq; }) : [];
      if (!rows.length) return '<div class="note">目前沒有 ' + (detailHq ? 'HQ' : 'NQ') + ' 在架商品。</div>';
      rows.sort(function (a, b) { return a.pricePerUnit - b.pricePerUnit; });
      var head = '<table class="listings"><thead><tr>' +
        (isDcMode() ? '<th>伺服器</th>' : '') +
        '<th class="num">單價</th><th class="num">數量</th><th class="num">總價</th><th>雇員</th></tr></thead><tbody>';
      var body = rows.slice(0, 15).map(function (l) {
        return '<tr>' +
          (isDcMode() ? '<td><span class="tag world">' + esc(l.worldName || '') + '</span></td>' : '') +
          '<td class="num">' + fmt(l.pricePerUnit) + '</td>' +
          '<td class="num">' + l.quantity + '</td>' +
          '<td class="num">' + fmt(l.total) + '</td>' +
          '<td>' + esc(l.retainerName || '') + '</td></tr>';
      }).join('');
      return head + body + '</tbody></table>';
    }

    function qtyAddHtml(id) {
      return '<div class="qty-add"><span class="note">加入製作清單：</span>' +
        '<input type="number" id="addQty" min="1" value="1">' +
        '<button class="btn primary" id="addBtn">＋ 加入</button></div>';
    }
    function bindQtyAdd(box, id) {
      var btn = $('#addBtn', box);
      if (!btn) return;
      btn.addEventListener('click', function () {
        var q = Math.max(1, parseInt($('#addQty', box).value, 10) || 1);
        addToCraft(id, q);
        btn.textContent = '✓ 已加入';
        setTimeout(function () { btn.textContent = '＋ 加入'; }, 1200);
      });
    }

    // ===================== 製作清單 =====================
    function addToCraft(id, qty) {
      var ex = craft.find(function (c) { return c.itemId === id; });
      if (ex) { ex.qty += qty; }
      else {
        if (craft.length >= MAX_CRAFT_ITEMS) {
          alert('製作清單最多 ' + MAX_CRAFT_ITEMS + ' 件物品（避免樹狀圖過大）。\n請先移除部分項目，或另存後清空再加入。');
          return;
        }
        craft.push({ itemId: id, qty: qty });
      }
      saveDraft(); updateCraftCount(); renderCraft();
    }
    function removeFromCraft(id) {
      craft = craft.filter(function (c) { return c.itemId !== id; });
      saveDraft(); updateCraftCount(); renderCraft();
    }
    function setQty(id, qty) {
      var ex = craft.find(function (c) { return c.itemId === id; });
      if (ex) { ex.qty = Math.max(1, qty); saveDraft(); renderCraft(); }
    }
    function updateCraftCount() { $('#craftCount').textContent = craft.length; }

    // 收集樹中所有會用到的物品 id（含全展開的可製作中間物；省略水晶時跳過）
    function collectIds(id, set, depth) {
      if (excludeCrystals && isCrystal(id)) return;
      set.add(id);
      if (depth >= MAX_DEPTH) return;
      var r = recipesByItem.get(id);
      if (!r) return;
      for (var i = 0; i < r.ingredients.length; i++) collectIds(r.ingredients[i].itemId, set, depth + 1);
    }

    // 該節點「購買」單價：可製作成品優先用 HQ（hqProduct 開時），原料用 NQ。無資料回 null。
    function unitBuy(id) {
      var p = priceMap.get(id);
      if (!p) return null;
      if (recipesByItem.has(id) && hqProduct && p.hq != null) return p.hq;
      return p.nq;
    }
    function usedHq(id) {
      var p = priceMap.get(id);
      return !!(p && recipesByItem.has(id) && hqProduct && p.hq != null);
    }
    function buyWorld(id) {
      var p = priceMap.get(id); if (!p) return null;
      return usedHq(id) ? p.hqWorld : p.nqWorld;
    }

    // 手上已有的存量池（Map<id, 還可分配的數量>），由 gotMap 建。
    function buildStockPool() {
      var m = new Map();
      Object.keys(gotMap).forEach(function (k) {
        var v = Math.floor(Number(gotMap[k]));
        if (isFinite(v) && v > 0) m.set(Number(k), v);
      });
      return m;
    }

    // 買 vs 做最佳化（省略水晶時材料不計入樹與成本）
    //
    // pool＝「手上已有」的存量，深度優先邊走邊扣。需求被存量蓋滿的節點收斂成
    // mode='have' 且**不再往下展開**——這就是「我已經有第一層材料，就不該再叫我去湊
    // 第二層」的實作。存量是全域的（同一物品出現在多處會依走訪順序先到先扣）。
    //
    // ⚠ 子節點要在 pool 的**複本**上試算：決定「直購」時整個子樹會被丟棄，
    //    若直接在本體上扣，那批存量就會被憑空吃掉。只有真的採自製才寫回。
    function optimal(id, qty, seen, depth, pool) {
      var it = itemById.get(id);
      var stock = pool.get(id) || 0;
      var have = Math.min(stock, qty);
      if (have > 0) pool.set(id, stock - have);
      var need = qty - have;
      var base = { id: id, qty: qty, have: have, need: need, marketable: !!(it && it.marketable) };
      if (need === 0) {
        return Object.assign(base, { leaf: true, mode: 'have', buy: 0, craft: Infinity, cost: 0, children: [] });
      }
      var unit = unitBuy(id);
      var buy = (it && it.marketable && unit != null) ? unit * need : Infinity;
      var r = recipesByItem.get(id);
      if (!r || (seen && seen.has(id)) || depth >= MAX_DEPTH) {
        return Object.assign(base, { leaf: true, mode: buy === Infinity ? 'na' : 'buy', buy: buy, craft: Infinity, cost: buy, children: [] });
      }
      var s2 = new Set(seen); s2.add(id);
      var batches = Math.ceil(need / (r.yield || 1));
      var ings = r.ingredients.filter(function (g) { return !(excludeCrystals && isCrystal(g.itemId)); });
      var sub = new Map(pool);
      var children = ings.map(function (ing) { return optimal(ing.itemId, batches * ing.qty, s2, depth + 1, sub); });
      var canCraft = children.every(function (c) { return c.cost !== Infinity; });
      var craftCost = canCraft ? children.reduce(function (a, c) { return a + c.cost; }, 0) : Infinity;
      var mode, cost;
      if (buy === Infinity && craftCost === Infinity) { mode = 'na'; cost = Infinity; }
      else if (buy <= craftCost) { mode = 'buy'; cost = buy; }
      else { mode = 'craft'; cost = craftCost; }
      if (mode !== 'buy') { pool.clear(); sub.forEach(function (v, k) { pool.set(k, v); }); }   // 子樹真的會做，才認列它扣掉的存量
      return Object.assign(base, { leaf: false, mode: mode, buy: buy, craft: craftCost, cost: cost, yield: r.yield, children: children });
    }

    // 目前計畫裡每個物品的**全計畫**合計需求：供「✓ 我有了」一次補滿所有分支，
    // 也用來提示「這一列只是其中一層，全部要幾個」。只走真的會做的分支
    // （決定直接買的節點，它的材料不在計畫裡，算進來會多補存量）。
    function indexPlan(n, idx) {
      var e = idx.get(n.id);
      if (!e) { e = { qty: 0, need: 0 }; idx.set(n.id, e); }
      e.qty += n.qty; e.need += n.need;
      activeChildren(n).forEach(function (c) { indexPlan(c, idx); });
      return idx;
    }

    // ── 節點圖渲染 ──
    function nodeCardHtml(n, isRoot) {
      var it = itemById.get(n.id);
      var nm = it ? it.name : ('#' + n.id);
      var craftable = recipesByItem.has(n.id);
      var cls = (isRoot ? 'root' : (craftable ? 'prod' : 'mat')) + (n.mode === 'have' ? ' have' : '');
      var unit = unitBuy(n.id), hq = usedHq(n.id), world = buyWorld(n.id);
      var pr = n.mode === 'have'
        ? '<div class="pr done">✅ 已有</div>'
        : unit == null
          ? '<div class="pr none">無販售</div>'
          : ('<div class="pr">' + (hq ? '<span class="hqb">HQ</span>' : '') + fmt(unit) + '</div>' + (isDcMode() && world ? '<div class="wd">' + esc(world) + '</div>' : ''));
      // 每張卡都能直接標「我有了」——在樹上就地宣告，不必再回清單找
      var nTot = planIndex.get(n.id);
      var haveBtn = '<button class="node-have' + (n.need === 0 ? ' on' : '') + '" data-have="' + n.id + '" data-need="' + (nTot && nTot.need > 0 ? nTot.need : n.need) + '" title="標記為已有／取消">' +
        (n.need === 0 ? '✓ 已有' : (n.have > 0 ? '已有 ' + n.have + '/' + n.qty : '＋ 我有了')) + '</button>';
      var qtyBadge = isRoot ? '' : '<span class="node-qty">' + n.qty + '</span>';
      var del = isRoot ? '<button class="node-del" data-act="del" data-id="' + n.id + '" title="從清單移除">✕</button>' : '';
      var ctrl = isRoot
        ? ('<div class="node-root-controls"><span class="stepper"><button data-act="dec" data-id="' + n.id + '">−</button>' +
           '<input type="number" min="1" value="' + n.qty + '" data-act="qty" data-id="' + n.id + '"><button data-act="inc" data-id="' + n.id + '">＋</button></span></div>')
        : '';
      return '<div class="node-card ' + cls + '" data-node="' + n.id + '" title="點擊查看詳情與上下游配方">' +
        qtyBadge + del +
        '<button class="node-copy" data-copy="' + esc(nm) + '" title="複製名稱">⧉</button>' +
        '<img class="ic" src="' + iconUrl(it) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="nm" title="' + esc(nm) + '">' + esc(nm) + '</div>' + pr + ctrl + haveBtn +
        '</div>';
    }

    function cmpBadgeHtml(n) {
      var prodLabel = (n.qty > 1 ? n.qty + '個成品' : '成品');
      if (n.buy === Infinity && n.craft === Infinity) return '<div class="cmp-badge cmp-na"><div class="l2">無法取得</div></div>';
      if (n.buy === Infinity) return '<div class="cmp-badge cmp-na"><div class="l1">成品無販售</div><div class="l2">採自製 ' + fmt(n.craft) + '</div></div>';
      if (n.craft === Infinity) return '<div class="cmp-badge cmp-buy"><div class="l1">材料缺市價</div><div class="l2">🛒 直購 ' + fmt(n.buy) + '</div></div>';
      if (n.mode === 'craft') return '<div class="cmp-badge cmp-craft"><div class="l1">材料 ' + fmt(n.craft) + '　vs　' + prodLabel + ' ' + fmt(n.buy) + '</div><div class="l2">✓ 自製省 ' + fmt(n.buy - n.craft) + '</div></div>';
      return '<div class="cmp-badge cmp-buy"><div class="l1">材料 ' + fmt(n.craft) + '　vs　' + prodLabel + ' ' + fmt(n.buy) + '</div><div class="l2">🛒 直購省 ' + fmt(n.craft - n.buy) + '</div></div>';
    }

    function rootBadgeHtml(n) {
      if (n.cost === Infinity) return '<div class="root-badge cmp-na"><div class="l1">以最優路線計算</div><div class="big">部分材料無市價</div></div>';
      var label = n.mode === 'craft' ? '自製最佳' : '直接購買最便宜';
      return '<div class="root-badge"><div class="l1">以最優路線計算（每項材料取買／製的較低價）</div><div class="big">✓ ' + label + '：' + fmt(n.cost) + ' G</div></div>';
    }

    function treeLi(n, isRoot) {
      var html = nodeCardHtml(n, isRoot);
      if (n.children && n.children.length) {
        var badge = isRoot ? rootBadgeHtml(n) : cmpBadgeHtml(n);
        var green = (n.mode === 'craft') ? ' green' : '';
        html += badge + '<ul class="children' + green + '">' + n.children.map(function (c) { return treeLi(c, false); }).join('') + '</ul>';
      }
      return '<li>' + html + '</li>';
    }

    // 製作清單子分頁切換（簡易清單 / 樹狀分析）
    function craftSubtabsHtml() {
      return '<div class="craft-subtabs"><span class="seg">' +
        '<button data-cview="simple" class="' + (craftView === 'simple' ? 'active' : '') + '">📋 簡易清單</button>' +
        '<button data-cview="tree" class="' + (craftView === 'tree' ? 'active' : '') + '">🌲 樹狀分析</button>' +
        '</span></div>';
    }
    // mode='tree' 才顯示「省略水晶」（簡易模式只看成品、不展開材料）
    function craftToolsHtml() {
      return '<div class="craft-tools">' +
        '<label class="switch"><input type="checkbox" id="optCrystal"' + (excludeCrystals ? ' checked' : '') + '><span class="track"></span>省略水晶</label>' +
        '<label class="switch"><input type="checkbox" id="optHq"' + (hqProduct ? ' checked' : '') + '><span class="track"></span>成品用 HQ 價</label>' +
        '<span class="note">查價範圍：' + esc(scopeLabel()) + '（於頁首切換）· 清單上限 ' + MAX_CRAFT_ITEMS + ' 件</span>' +
        '</div>';
    }

    // 共用：批次查價建 priceMap
    async function fetchPriceMap(ids) {
      var lst = await Universalis.fetchListings(scope, ids, { listings: 8 });
      priceMap = new Map();
      if (lst && lst.items) {
        lastUpload = lst.lastUploadTime || lastUpload;
        ids.forEach(function (id) {
          var d = lst.items[id];
          var nq = Universalis.minPrice(d, false), hq = Universalis.minPrice(d, true);
          priceMap.set(id, { nq: nq ? nq.pricePerUnit : null, nqWorld: nq ? nq.worldName : null, hq: hq ? hq.pricePerUnit : null, hqWorld: hq ? hq.worldName : null });
        });
      }
      renderUpdateTime();
    }

    // 樹狀分析用：載入配方 + 查整棵樹所有材料價，回傳各需求物品的最省樹
    // 價格的 id 集合刻意**不看存量**（用全展開），這樣勾「已有」重算時
    // 不會因為集合變小而觸發新的查詢，也不會在取消勾選時缺價。
    async function prepareCraftData() {
      await ensureRecipes();
      var idset = new Set();
      craft.forEach(function (c) { collectIds(c.itemId, idset, 0); });
      await fetchPriceMap(Array.from(idset));
      var pool = buildStockPool();
      var trees = craft.map(function (c) { return optimal(c.itemId, c.qty, new Set(), 0, pool); });
      planIndex = new Map();
      trees.forEach(function (t) { indexPlan(t, planIndex); });
      return trees;
    }

    // 簡易清單用：只查成品＋第一層直接原料的價格（不遞迴）
    async function prepareSimpleData() {
      await ensureRecipes();
      var idset = new Set();
      craft.forEach(function (c) {
        idset.add(c.itemId);
        var r = recipesByItem.get(c.itemId);
        if (r) r.ingredients.forEach(function (g) {
          if (!(excludeCrystals && isCrystal(g.itemId))) idset.add(g.itemId);
        });
      });
      await fetchPriceMap(Array.from(idset));
    }

    // 合併樹的虛擬總根卡（顯示整份清單的智慧最省總成本）
    function grandRootCardHtml(grandOptimal, buyAll, anyNa, allNa, buyAllOk) {
      var saving = (buyAllOk && !allNa) ? buyAll - grandOptimal : null;
      var savingTxt = saving == null ? '' : (saving > 0 ? '　自製省 ' + fmt(saving) + ' G' : (saving < 0 ? '　直購省 ' + fmt(-saving) + ' G' : '　買做持平'));
      return '<div class="node-card grand-root">' +
        '<div class="nm">📋 製作清單（' + craft.length + ' 項）</div>' +
        '<div class="pr">' + (allNa ? '—' : fmt(grandOptimal)) + '</div>' +
        '<div class="wd">智慧最省總成本' + (anyNa ? '（部分無市價）' : '') + esc(savingTxt) + '</div>' +
        '</div>';
    }

    function legendHtml() {
      return '<div class="legend">' +
        '<span><span class="sw sw-root"></span>最終成品</span>' +
        '<span><span class="sw sw-prod"></span>可製作中間物</span>' +
        '<span><span class="sw sw-mat"></span>基礎素材</span>' +
        '<span><span class="sw-line"></span>綠線＝該層自製較省</span>' +
        '<span>價格＝NQ最低　HQ＝HQ最低　⧉＝複製名稱　·　點節點看詳情/配方</span>' +
        '</div>';
    }

    // ── 製作計畫清單（縮排可折疊的樹狀表格）──────────────────────────────
    //
    // 為什麼不是「攤平成一張表、再依層級分組」：每個節點各自比買／做，樹本來就不會
    // 齊頭停在同一層，攤平後「第 1 層原料」與「第 3 層原料」變成平行的兩堆，看不出
    // 誰是誰的材料；更糟的是**計畫中要自己做的中間物根本不會出現**（它不是 buy 節點），
    // 於是「我已經有第一層材料了」在畫面上無處可表達，只能被迫去勾第二層。
    //
    // 改成保留樹的形狀：一列一個節點、縮排＋導引線表示上下層、每列都能勾「已有」。
    // 勾了就 mode='have'、整個子樹從計畫消失（見 optimal 的 pool）。
    // 設計依據（ui-ux-pro-max）：階層 >3 層不適用 treemap／sunburst（無障礙 C），
    // 應以可折疊縮排表格為主檢視、圖形樹為輔；層級要靠縮排與間距表達而非只靠顏色。
    // 計畫「實際會做」的分支：買到就停（含做不出來的 na——底下買得到的仍要列）。
    // 項數、金額、採買彙總、存量分配都只認這個，否則會叫人去買用不到的東西。
    function activeChildren(n) {
      return (n.mode === 'craft' || n.mode === 'na') ? (n.children || []) : [];
    }
    // 畫面上「可以展開來看」的下層：決定買的節點也照樣列出它的材料（預設收起）。
    // 這不只是資訊——手上若已經有那些料，標記已有後自製成本會降，
    // 那一列就會自己從「買」翻成「做」。已標記為手上有的節點例外（都有了，底下不重要）。
    function displayChildren(n) {
      return n.mode === 'have' ? [] : (n.children || []);
    }
    function nameOf(id) { var it = itemById.get(id); return it ? it.name : ('#' + id); }

    // 同一層的相同物品合併成一列。不合併的話，一種料被兩個成品（或兩個中間物）用到
    // 就會拆成兩列各報各的數，根本看不出「總共要幾個」。
    // entries: [{ n: 計畫節點, parentName: 上游名稱 }]，回傳合併後的節點陣列。
    // active＝這一列真的要備（上游沒有任何一層是「直接買」）。false 的列照樣顯示，
    // 只是不計入項數／金額／採買彙總。
    // ⚠ active 必須逐個 occurrence 判斷再取聯集，不能整層共用一個旗標：同一種料
    //    可能在 A 成品底下是真的要備、在 B 成品底下卻因為上層改用買的而只是參考。
    function mergeLevel(entries) {
      var byId = new Map();
      entries.forEach(function (x) {
        var n = x.n;
        var e = byId.get(n.id);
        if (!e) { e = { id: n.id, qty: 0, have: 0, need: 0, active: false, kids: [], modes: new Set(), parents: new Set() }; byId.set(n.id, e); }
        e.qty += n.qty; e.have += n.have; e.need += n.need;
        e.modes.add(n.mode);
        if (x.active) e.active = true;
        if (x.parentName) e.parents.add(x.parentName);
        var childActive = x.active && (n.mode === 'craft' || n.mode === 'na');
        displayChildren(n).forEach(function (c) { e.kids.push({ n: c, parentName: nameOf(n.id), active: childActive }); });
      });
      return Array.from(byId.values()).map(function (e) {
        // 合併後的狀態由合併後的數量決定：湊滿了就是「已有」，否則沿用各處的決定
        var mode = e.need === 0 ? 'have'
          : e.modes.has('craft') ? 'craft'
          : e.modes.has('buy') ? 'buy' : 'na';
        var children = mode === 'have' ? [] : mergeLevel(e.kids);
        var it = itemById.get(e.id), unit = unitBuy(e.id);
        var buy = (it && it.marketable && unit != null) ? unit * e.need : Infinity;
        var craft = children.length
          ? children.reduce(function (a, c) { return a + c.cost; }, 0)
          : Infinity;
        var cost = mode === 'have' ? 0 : mode === 'buy' ? buy : mode === 'craft' ? craft : Infinity;
        return {
          id: e.id, qty: e.qty, have: e.have, need: e.need, mode: mode, active: e.active,
          buy: buy, craft: craft, cost: cost, children: children,
          marketable: !!(it && it.marketable), parents: Array.from(e.parents)
        };
      }).sort(function (a, b) {
        var an = a.cost === Infinity, bn = b.cost === Infinity;   // 取不到的排最後
        if (an !== bn) return an ? 1 : -1;
        return b.cost - a.cost;
      });
    }
    // 成品本身不進計畫（它是目標，不是要備的料），所以從各成品的下一層開始合併攤平。
    // ⚠ 這裡要用 displayChildren 而非 activeChildren：成品若被判定「直購較省」，
    //    activeChildren 會回空陣列，整份配方都不進計畫——加了那種成品進清單，
    //    畫面上會完全看不出有變化（實測「五加木木材」加進去列數 20 → 20）。
    function buildMergedTop(trees) {
      return mergeLevel(trees.reduce(function (a, t) {
        var act = (t.mode === 'craft' || t.mode === 'na');
        return a.concat(displayChildren(t).map(function (c) { return { n: c, parentName: nameOf(t.id), active: act }; }));
      }, []));
    }
    // 展開狀態：買與做一視同仁，預設都展開（使用者指定兩者顯示方式要相同）。
    // 優先序：個別點過的覆寫 > 全部展開／收合 > 預設。
    // ⚠ 全部展開不能只套用在「當下畫面上有的列」——收合狀態下深層的列還沒渲染出來，
    //    那樣按一次只會展開一層。所以用一個全域旗標，讓沒被個別覆寫的節點通通跟著走。
    function planIsOpen(path) {
      if (planOpen.has(path)) return planOpen.get(path);
      if (planAll !== null) return planAll;
      return true;
    }
    function flattenPlan(n, depth, parentPath, out) {
      var path = parentPath + '/' + n.id;
      var kids = n.children || [];
      var open = planIsOpen(path);
      out.push({ n: n, depth: depth, path: path, hasKids: kids.length > 0, open: open });
      if (!open) return out;
      kids.forEach(function (c) { flattenPlan(c, depth + 1, path, out); });
      return out;
    }
    function buildPlanRows(mergedTop) {
      var out = [];
      mergedTop.forEach(function (n) { flattenPlan(n, 0, '', out); });
      return out;
    }

    // ── 多面向查閱：同一份計畫的四種攤平檢視 ──────────────────────────────
    // 階層看得出「誰是誰的材料」，但要「總共要幾個某某」得跨層加總；反過來攤平看得到
    // 總數卻看不出關係。兩種都要，所以做成可切換：
    //   direct 直接材料＝只列成品的第一層（不往下拆）
    //   all    全部素材＝整份計畫跨層合併（同一物品出現在第 1 層與第 3 層也併成一列）
    //   base   基礎素材＝all 之中沒有配方的（採集／掉落／商店）
    //   mid    中間物  ＝all 之中有配方的（自己做得出來的）
    // ⚠ 這裡**不能**用 active 過濾。過濾掉「買」節點底下的材料，會讓叫「全部素材」的
    //    檢視比「階層」還少（實測 16 項變 7 項），使用者只會覺得清單漏東西。
    //    攤平檢視回答的是「這份配方到底由什麼組成」，跟買／做的建議是兩回事。
    function flatAggregate(list, acc) {
      list.forEach(function (n) {
        var e = acc.get(n.id);
        if (!e) { e = { id: n.id, qty: 0, have: 0, need: 0, craftCost: 0, craftInf: false, modes: new Set(), parents: new Set() }; acc.set(n.id, e); }
        e.qty += n.qty; e.have += n.have; e.need += n.need;
        e.modes.add(n.mode);
        if (n.mode === 'craft') { if (n.craft === Infinity) e.craftInf = true; else e.craftCost += n.craft; }
        (n.parents || []).forEach(function (p) { e.parents.add(p); });
        flatAggregate(n.children || [], acc);
      });
      return acc;
    }
    function aggToNode(e) {
      var mode = e.need === 0 ? 'have'
        : e.modes.has('craft') ? 'craft'
        : e.modes.has('buy') ? 'buy' : 'na';
      var it = itemById.get(e.id), unit = unitBuy(e.id);
      var buy = (it && it.marketable && unit != null) ? unit * e.need : Infinity;
      var craft = (e.craftInf || !e.craftCost) ? Infinity : e.craftCost;
      return {
        id: e.id, qty: e.qty, have: e.have, need: e.need, mode: mode, active: true,
        buy: buy, craft: craft, children: [], parents: Array.from(e.parents),
        cost: mode === 'have' ? 0 : mode === 'buy' ? buy : mode === 'craft' ? craft : Infinity,
        marketable: !!(it && it.marketable)
      };
    }
    function byCostDesc(a, b) {
      var an = a.cost === Infinity, bn = b.cost === Infinity;
      if (an !== bn) return an ? 1 : -1;
      return b.cost - a.cost;
    }
    // 回傳 planRowHtml 吃的列（扁平檢視沒有縮排與展開鈕）
    function buildFlatRows(mergedTop, view) {
      if (view === 'direct') {
        return mergedTop.slice().sort(byCostDesc).map(function (n) {
          return { n: n, depth: 0, path: '', hasKids: false, open: true };
        });
      }
      var nodes = Array.from(flatAggregate(mergedTop, new Map()).values()).map(aggToNode);
      if (view === 'base') nodes = nodes.filter(function (n) { return !recipesByItem.has(n.id); });
      else if (view === 'mid') nodes = nodes.filter(function (n) { return recipesByItem.has(n.id); });
      return nodes.sort(byCostDesc).map(function (n) {
        return { n: n, depth: 0, path: '', hasKids: false, open: true };
      });
    }

    var PLAN_VIEWS = [
      { k: 'tree',   t: '階層' },
      { k: 'direct', t: '直接材料' },
      { k: 'all',    t: '全部素材' },
      { k: 'base',   t: '基礎素材' },
      { k: 'mid',    t: '中間物' }
    ];

    // 一列的狀態徽章（同時是「這層要買還是要做」的答案）
    function planBadge(n) {
      if (n.mode === 'have') return '<span class="plan-badge have">✅ 已有</span>';
      if (n.mode === 'buy') return '<span class="plan-badge buy">🛒 買</span>';
      if (n.mode === 'craft') return '<span class="plan-badge craft">🔨 做</span>';
      return '<span class="plan-badge na">⚠ 取不到</span>';
    }

    // ---- 計畫統計（進度列）----
    // 項數走整份計畫而不是「畫面上看得到的列」，否則收合一段進度數字就跟著跳動。
    // 金額用各成品的最省成本合計（含直接買成品的那筆，那也是要花的錢）。
    function planStats(trees, mergedTop) {
      var s = { total: 0, done: 0, remainCost: 0, anyNa: false };
      // 金額直接加總所有「要買」的節點（含直接買的成品本身）。
      // 不用各成品的 cost 合計——只要樹裡有一件取不到，那個 cost 就是 Infinity，
      // 整份預算會塌成 0，畫面上就會變成「一項無市價 → 全部都無市價」。
      trees.forEach(function (t) {                       // 成品層：只有「直接買」的才是花費
        if (t.mode === 'buy') s.remainCost += t.buy;
        else if (t.mode === 'na' && !(t.children || []).length) s.anyNa = true;
      });
      (function walk(list) {                             // 材料層走合併後的計畫，項數才跟畫面一致
        list.forEach(function (n) {
          if (!n.active) return;                         // 「買」的節點底下只是參考，不計入
          s.total++;
          if (n.mode === 'have') { s.done++; return; }
          if (n.mode === 'buy') { s.remainCost += n.buy; return; }
          if (n.mode === 'na' && !n.children.length) { s.anyNa = true; return; }
          walk(n.children);
        });
      })(mergedTop);
      return s;
    }
    function planProgressInnerHtml(s) {
      var pct = s.total ? Math.round(100 * s.done / s.total) : 0;
      var allDone = s.total > 0 && s.done === s.total;
      // 全部都查不到市價時 remainCost 會是 0，直接印「還要花 0 G」會被讀成「不用花錢」
      var right = allDone ? '✅ 全部備齊'
        : s.remainCost > 0 ? ('還要採買 ' + fmt(s.remainCost) + ' G' + (s.anyNa ? '（另有項目無市價）' : ''))
        : s.anyNa ? '剩餘項目皆無市價' : '還要採買 0 G';
      return '<div class="got-line"><span>📦 已備齊 <b>' + s.done + '</b> / ' + s.total + ' 項</span>' +
        '<span>' + right + '</span></div>' +
        '<div class="got-bar"><div class="got-bar-fill' + (allDone ? ' full' : '') + '" style="width:' + pct + '%"></div></div>';
    }

    function renderCraft() {
      var body = $('#craftBody');
      var sub = craftSubtabsHtml();
      if (!craft.length) {
        body.innerHTML = sub + '<div class="empty-state">製作清單是空的。<br>到「物品查詢」搜尋物品，開視窗按「＋ 加入」即可開始試算。</div>';
        return Promise.resolve();
      }
      return craftView === 'simple' ? renderCraftSimple(body, sub) : renderCraftTree(body, sub);
    }
    // 勾「已有」會改變計畫（子樹整段消失），必須整區重算重繪；
    // 依 UX 準則 back-behavior：互動後要保留捲動位置，否則畫面會跳掉。
    function rerenderKeepScroll() {
      var y = window.scrollY;
      Promise.resolve(renderCraft()).then(function () { window.scrollTo(0, y); });
    }

    // 兩個檢視共用：成本統計（智慧最省／全買成品／可省）。數字都已扣掉「手上已有」。
    function craftTotals(trees) {
      var grandOptimal = trees.reduce(function (a, t) { return a + (t.cost === Infinity ? 0 : t.cost); }, 0);
      var anyNa = trees.some(function (t) { return t.cost === Infinity; });
      var allNa = trees.every(function (t) { return t.cost === Infinity; });
      // 全買成品的成本（供比較）——同樣扣掉已有的成品，兩邊才是同一個基準
      var buyAll = 0, buyAllOk = true;
      trees.forEach(function (t) {
        if (t.need === 0) return;
        var it = itemById.get(t.id), u = unitBuy(t.id);
        if (it && it.marketable && u != null) buyAll += u * t.need; else buyAllOk = false;
      });
      var hasStock = trees.some(function (t) { return t.have > 0; }) ||
        Array.from(planIndex.values()).some(function (e) { return e.qty > e.need; });
      return { grandOptimal: grandOptimal, anyNa: anyNa, allNa: allNa, buyAll: buyAll, buyAllOk: buyAllOk, hasStock: hasStock };
    }

    function craftActionsHtml() {
      return '<div class="craft-actions">' +
        '<button class="btn primary" data-act="saveAs">💾 另存為清單</button>' +
        '<button class="btn danger" data-act="clear">清空清單</button>' +
        '</div>';
    }

    // 兩個檢視共用：成本統計卡＋製作計畫（縮排樹狀、可勾已有）＋採買彙總（依伺服器）
    function craftSummaryHtml(trees, T) {
      var mergedTop = buildMergedTop(trees);
      var isTree = planView === 'tree';
      var rows = isTree ? buildPlanRows(mergedTop) : buildFlatRows(mergedTop, planView);
      var dc = isDcMode();
      var cols = dc ? 6 : 5;

      function planRowHtml(r) {
        var n = r.n, it = itemById.get(n.id);
        var nm = it ? it.name : '#' + n.id;
        var stock = gotOf(n.id);
        var total = n.active ? planIndex.get(n.id) : null;
        var open = r.open;
        var toggle = r.hasKids
          ? '<button class="plan-toggle" data-plan-toggle="' + esc(r.path) + '" aria-expanded="' + open + '" aria-label="' + (open ? '收合' : '展開') + esc(nm) + '的材料">' + (open ? '▾' : '▸') + '</button>'
          : '<span class="plan-spacer" aria-hidden="true"></span>';
        var guides = '';
        for (var i = 0; i < r.depth; i++) guides += '<span class="plan-guide" aria-hidden="true"></span>';

        // 副標：這一列是誰的材料（縮排看得出深淺，文字補上到底掛在哪些項目下；
        // 合併後可能同時供應多個上游，列出來才知道這個總數是怎麼來的）
        var ps = n.parents || [];
        var sub = esc(ps.slice(0, 3).join('、') + (ps.length > 3 ? ' 等 ' + ps.length + ' 項' : '')) + ' 的材料';
        // 買與做用同一種句型（只是方向相反），欄位也一樣填——兩者顯示方式一致
        if (n.mode === 'craft') sub += n.buy === Infinity ? ' · 自製（市場買不到成品）' : ' · 自製較省（直接買要 ' + fmt(n.buy) + ' G）';
        else if (n.mode === 'buy' && r.hasKids) sub += n.craft === Infinity ? ' · 直購（材料湊不齊）' : ' · 直購較省（自己做要 ' + fmt(n.craft) + ' G）';
        else if (n.mode === 'have') sub += ' · 已標記為手上有，底下的材料不用再湊';
        else if (n.mode === 'na' && r.hasKids) sub += ' · 這條路線缺料，做不出來';
        // 同一種料若還出現在別的層（同層才合併得起來），把全計畫總數講明，
        // 否則使用者看到 270 卻要買 297，會以為清單漏了
        if (total && total.need > n.need) sub += ' · <b>全計畫共需 ' + total.need + '</b>（另 ' + (total.need - n.need) + ' 個在其他層）';

        var qtyCell = n.mode === 'have' ? '0' : ('<b>' + n.need + '</b>' + (n.have > 0 ? ' <span class="plan-of">/ ' + n.qty + '</span>' : ''));
        // 「做」的列也填單價／小計（自製的單位成本與總成本），欄位不再一邊有數字一邊空著
        var unitVal = n.mode === 'buy' ? unitBuy(n.id)
          : (n.mode === 'craft' && n.need > 0 && n.craft !== Infinity) ? n.craft / n.need
          : null;
        var totalVal = n.mode === 'buy' ? n.buy : n.mode === 'craft' ? n.craft : null;
        var priceCell = unitVal != null ? fmt(unitVal) : '—';
        var subCell = (totalVal != null && totalVal !== Infinity) ? fmt(totalVal) : '—';
        var world = n.mode === 'buy' ? buyWorld(n.id) : null;
        // ✓ 要補的量：計畫內的列補到全計畫都夠，其餘只補它自己這一格
        var fillNeed = total && total.need > 0 ? total.need : n.need;

        // 綠底＝中間素材（自己做得出來），無底色＝基礎素材。與買／做的建議是兩件事：
        // 一個中間素材也可能因為市價便宜而被建議「買」。
        return '<tr class="plan-row' + (n.mode === 'have' ? ' plan-have' : '') +
          (recipesByItem.has(n.id) ? ' plan-mid' : '') + '" data-depth="' + r.depth + '">' +
          '<td><div class="plan-cell">' + guides + toggle +
            '<img class="plan-ic" src="' + iconUrl(it) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
            '<div class="plan-main"><div class="plan-nm"><span class="plan-node" data-node="' + n.id + '" role="button" tabindex="0" title="查看即時價格與上下游配方">' + esc(nm) + '</span>' + planBadge(n) + '</div>' +
            '<div class="shop-use">' + sub + '</div></div></div></td>' +
          '<td class="num">' + qtyCell + '</td>' +
          '<td class="num got-cell"><input type="number" class="got-input" data-got="' + n.id + '" min="0" max="' + (total ? total.qty : n.qty) + '" value="' + stock + '" aria-label="' + esc(nm) + ' 手上已有的數量">' +
