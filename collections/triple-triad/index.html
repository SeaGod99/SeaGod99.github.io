<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FF14 幻卡追蹤 — 查詢取得來源、星級篩選、記錄收藏進度">
  <title>幻卡追蹤 | 水神的工具箱</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/tool-header.css">
  <style>
    /* 幻卡頁專屬樣式；共用色票與版面外框見 assets/css/common.css。
       這頁只有一種呈現＝仿遊戲內幻卡手帳（見下方），引擎（collection-tracker.js）
       只負責進度條／工具列／篩選／排序／分頁狀態，它的卡片格線不顯示。 */
    :root {
      --accent:    var(--red);                 /* 紅 */
      --accent-2:  var(--gold);                 /* 進度條尾色：金 */
      --glow-1:    rgba(248,113,113,0.06);
      --glow-2:    rgba(200,169,110,0.04);
    }
    /* 幻卡四向數值十字 */
    .tt-numbers {
      display: grid;
      grid-template-columns: 24px 24px 24px;
      grid-template-rows: 24px 24px 24px;
      justify-content: center;
      gap: 2px;
      margin: 2px 0;
    }
    .tt-num {
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      color: var(--text-secondary);
      background: var(--raise);
      border-radius: 3px;
    }
    .tt-num.n-top    { grid-area: 1 / 2; }
    .tt-num.n-left   { grid-area: 2 / 1; }
    .tt-num.n-center { grid-area: 2 / 2; font-size: 10px; color: var(--text-muted); background: transparent; }
    .tt-num.n-right  { grid-area: 2 / 3; }
    .tt-num.n-bottom { grid-area: 3 / 2; }
    .tt-num.n-A      { color: var(--gold-light); }

    /* 星級與類型標籤 */
    .tag.star-1 { background: rgba(74,222,128,0.1);  color: var(--green); border-color: rgba(74,222,128,0.2); }
    .tag.star-2 { background: rgba(79,195,247,0.1);  color: var(--blue);  border-color: rgba(79,195,247,0.2); }
    .tag.star-3 { background: rgba(167,139,250,0.1); color: var(--purple); border-color: rgba(167,139,250,0.2); }
    .tag.star-4 { background: rgba(255,200,80,0.1);  color: #ffc850; border-color: rgba(255,200,80,0.2); }
    .tag.star-5 { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.2); }
    .tag.type-tag { background: rgba(200,169,110,0.12); color: var(--gold); border-color: rgba(200,169,110,0.25); }

    /* ═══════════════ 幻卡手帳（仿遊戲內版型）═══════════════
       版面刻意對齊遊戲：一頁 5×6＝30 張、頁籤一次列 5 頁（«/» 換頁組）、
       右側是選中卡片的詳情、底部「總計 n/m」。
       ※ 未取得**不用遊戲的「？」牌背**，改灰階卡面（2026-07-26 使用者指定）——
         這是追蹤工具，使用者要看得到還沒收到的卡長什麼樣。
       篩選／排序／分頁／進度仍全由引擎掌管（pageSize:30）：
       引擎每次 renderGrid() 後由 onRender 交出 (list, pageSlice)，pageSlice ＝這一頁。 */
    /* 引擎的卡片格線／分頁列／空狀態一律收起：這頁只有手帳一種呈現，格線由手帳取代、
       分頁由手帳的頁籤取代、空結果由手帳自己顯示（引擎仍負責篩選／排序／分頁狀態／進度）。
       ※ 必須用 !important，不能用 inline style——renderGrid() 每次重畫都會把 #ct-grid 的
         inline display 設回 ''（同 common.css 的 body.mx-mapmode 註解），inline 會被洗掉。 */
    #ct-grid, #ct-pagination, #ct-empty { display: none !important; }

    /* 這頁的篩選有 4 組（星級／類型／取得方式 15 顆／版本），直排會把手帳推到很下面，
       改成橫向流排（同釣魚頁），短的幾組自然併到同一列 */
    #ct-filters { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 48px; }


    /* ── 缺卡跑圖檢視 ──────────────────────────────────────────────
       只列「打贏這個 NPC 會給我還缺的卡」。用的是 NPC對戰（ItemPossibleReward），
       **不是 NPC牌組**——牌組只代表對手手上有這張卡，打贏不見得拿得到。 */
    .tt-view-switch { display: flex; gap: 6px; margin: 0 0 14px; }
    .tt-view-btn {
      background: var(--bg-card); color: var(--text-dim);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; min-height: 40px;
    }
    .tt-view-btn:hover { background: var(--bg-card-hover); color: var(--text); }
    .tt-view-btn.active {
      background: color-mix(in srgb, var(--gold) 16%, var(--bg-card));
      border-color: color-mix(in srgb, var(--gold) 45%, var(--border));
      color: var(--gold-light); font-weight: 600;
    }
    .tt-view-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .tt-route { display: none; }
    body.tt-route-mode .tt-route { display: block; }
    body.tt-route-mode .tt-album { display: none; }
    /* 跑圖檢視不吃篩選／排序／分頁（它問的是「我還缺什麼」，不是「這一頁有什麼」），
       所以把引擎那幾區一起收起來，免得調了沒反應。進度條留著。 */
    body.tt-route-mode #ct-filters,
    body.tt-route-mode .toolbar,
    body.tt-route-mode #ct-meta { display: none !important; }

    .tt-route-sum {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px;
      font-size: 13.5px; color: var(--text-dim); line-height: 1.75;
    }
    .tt-route-sum b { color: var(--gold-light); font-weight: 700; }
    .tt-route-sum .warn { color: var(--text-muted); font-size: 12.5px; }

    .tt-route-pick { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .tt-route-pick label { font-size: 12.5px; color: var(--text-muted); }
    .tt-route-pick select {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-dim); padding: 7px 9px; font: inherit; font-size: 13px;
      min-height: 40px; max-width: 18rem; cursor: pointer;
    }
    .tt-route-pick select:focus { border-color: var(--gold); color: var(--text); }

    .tt-map-head {
      display: flex; align-items: baseline; gap: 8px;
      margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border);
    }
    .tt-map-name { font-size: 15px; font-weight: 700; color: var(--gold); }
    .tt-map-n { font-size: 12px; color: var(--text-muted); }

    .tt-npc {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px;
    }
    .tt-npc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tt-npc-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .tt-npc-at { font-size: 12px; color: var(--text-muted); }
    .tt-npc-n {
      margin-left: auto; font-size: 12px; font-weight: 700;
      color: var(--gold-light); white-space: nowrap;
    }
    .tt-npc-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .tt-npc-cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tt-mini {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg-base); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 7px 3px 4px; font-size: 12px; color: var(--text-dim);
    }
    .tt-mini img { width: 22px; height: 27px; object-fit: cover; border-radius: 3px; display: block; }
    .tt-mini .st { color: var(--gold); font-size: 11px; }

    .tt-route-rest {
      margin-top: 22px; padding-top: 12px; border-top: 1px dashed var(--border);
      font-size: 13px; color: var(--text-muted); line-height: 1.8;
    }
    .tt-route-rest b { color: var(--text-dim); }

    @media (max-width: 700px) {
      .tt-npc-n { margin-left: 0; width: 100%; }
    }
    .tt-album { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }

    /* ── 左：手帳本體（頁籤 ＋ 30 格 ＋ 總計）──
       限寬讓一格約 190px：右邊詳情的卡面（250px）才看得出是「放大的那一張」 */
    .tt-book {
      max-width: 1030px;
      background: var(--bg-surface);
      border: 1px solid color-mix(in srgb, var(--gold) 22%, var(--border));
      border-radius: var(--radius-lg);
      padding: 12px 14px 10px;
    }
    /* 頁碼列：15 頁全列出來（一鍵直達），並且 sticky 黏在頂列下方——一頁 6 排卡片很高，
       捲到下面還要滑回去換頁很難用。負 margin 讓底色鋪滿手帳邊緣，卡片不會從縫隙透出來。 */
    .tt-tabs {
      position: sticky; top: 46px; z-index: 3;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      margin: -12px -14px 12px; padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .tt-tab, .tt-nav {
      height: 30px; padding: 0 9px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      color: var(--text-secondary); background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: var(--transition);
    }
    .tt-tab { min-width: 34px; }
    .tt-nav { padding: 0 12px; font-weight: 500; }
    .tt-tab:hover:not(:disabled):not(.active),
    .tt-nav:hover:not(:disabled) { color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
    .tt-tab.active {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      color: var(--accent);
    }
    .tt-tab:disabled, .tt-nav:disabled { opacity: 0.3; cursor: default; }
    .tt-tab:focus-visible, .tt-nav:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px;
    }
    .tt-tab-gap { color: var(--text-muted); padding: 0 2px; }
    .tt-tabs-info { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    /* 卡格：一頁固定 5×6，最後一頁不足也留空格，版面才不會忽長忽短（同遊戲） */
    .tt-slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .tt-slots:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 4px; }
    .tt-slot {
      position: relative; aspect-ratio: 13 / 16;      /* 卡面原圖 208×256 */
      border-radius: 6px; overflow: hidden;
      background: var(--raise); border: 1px solid var(--border);
      cursor: pointer; transition: transform 0.12s ease, border-color var(--transition), box-shadow var(--transition);
    }
    .tt-slot:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tt-slot.sel {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 6px 16px rgba(0,0,0,0.35);
    }
    .tt-slot.own { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .tt-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* 未取得＝灰階卡面（看得出是哪張卡，但一眼分得出還沒收到）；已取得才上色 */
    .tt-slot.miss { background: var(--raise); }
    .tt-slot.miss img { filter: grayscale(1) brightness(0.92) contrast(0.95); }
    /* hover 才微微透出原色（選中時刻意不透，否則「選中的未取得卡」看起來像已取得）*/
    .tt-slot.miss:hover img { filter: grayscale(0.45); }
    .tt-slot.empty { background: transparent; border-style: dashed; opacity: 0.3; cursor: default; }
    .tt-slot.empty:hover { transform: none; border-color: var(--border); }

    /* 編號印在卡格左下角（卡面自己的四向數值在中下方，不會互相疊到） */
    .tt-slot-no {
      position: absolute; left: 3px; bottom: 3px; z-index: 2;
      padding: 0 4px; border-radius: 3px;
      font-size: 10px; font-weight: 600; line-height: 15px;
      /* 10px 白字壓在卡面上，原本 0.9 白 + 0.5 黑遮罩只有 3.99；遮罩加深到 0.66 後 4.9 */
      color: #fff; background: rgba(0,0,0,0.66);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    .tt-slot-no.off { color: var(--gold-light); }   /* 編號外（FF 歷代主角卡） */

    /* 卡面圖抓不到時的替身 */
    .tt-ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      background: var(--raise); color: var(--text-muted); font-size: clamp(14px, 2vw, 26px);
    }
    /* ✓ 章＝切換取得狀態的按鈕，用全站統一的 .ct-check（common.css）：卡格掛 .ct-card
       就吃到同一份樣式（右上角、hover 浮現、已取得填強調色）。**不要在這裡另刻**，
       否則「全站相同格式」就會又走鐘。本頁只補一條：選中的那格也讓 ✓ 浮出。 */
    .tt-slot.sel .ct-check { opacity: 1; }

    .tt-foot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .tt-foot-btn {
      font-family: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer;
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-muted); transition: var(--transition);
    }
    .tt-foot-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
    .tt-total { margin-left: auto; font-size: 14px; color: var(--text-secondary); }
    .tt-total b { font-size: 17px; font-weight: 700; color: var(--gold-light); }
    .tt-total i { font-style: normal; font-size: 12px; color: var(--text-muted); margin-left: 6px; }
    .tt-album-empty { grid-column: 1 / -1; text-align: center; padding: 48px 10px; color: var(--text-muted); font-size: 14px; }

    /* ── 右：選中卡片的詳情 ── */
    .tt-detail {
      /* top 58px＝nav.js 頂列 46px＋留白，與 aether-currents／treasure-maps 一致（見知識庫 §2.6）*/
      position: sticky; top: 58px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px;
    }
    .tt-detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .tt-no { font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em; }
    .tt-no.off { color: var(--gold); }
    /* 「手帳第 N 頁」＝進遊戲要翻到第幾頁。編號 ≠ 位置（15 張主角卡被排到最後一頁，
       其後每張的位置都比編號小 13），所以這個對照很常用得到。 */
    .tt-page-of {
      margin-left: 7px; padding: 1px 7px; border-radius: 99px;
      font-size: 11px; color: var(--gold); background: var(--gold-dim);
      border: 1px solid color-mix(in srgb, var(--gold) 25%, transparent);
    }
    .tt-own-btn {
      margin-left: auto; font-family: inherit; font-size: 12px; padding: 5px 12px;
      border-radius: 99px; cursor: pointer; transition: var(--transition);
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    }
    .tt-own-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }
    .tt-own-btn.own {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent);
    }
    .tt-art {
      position: relative; width: 100%; max-width: 250px; margin: 0 auto 10px;
      aspect-ratio: 13 / 16; border-radius: 8px; overflow: hidden; background: var(--raise);
    }
    .tt-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .tt-art.miss img { filter: grayscale(1) brightness(0.92) contrast(0.95); }
    .tt-art-ribbon {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 0; text-align: center;
      font-size: 11px; background: rgba(10,12,16,0.75); color: rgba(255,255,255,0.75);
    }
    .tt-dname { font-size: 17px; font-weight: 700; color: var(--text-primary); text-align: center; line-height: 1.3; }
    .tt-den { margin-top: 1px; font-size: 11px; color: var(--text-muted); text-align: center; }
    .tt-detail .col-tags { justify-content: center; margin: 8px 0 4px; }
    .tt-numbers.big { grid-template-columns: 28px 28px 28px; grid-template-rows: 28px 28px 28px; margin: 4px auto 10px; }
    .tt-numbers.big .tt-num { font-size: 14px; }
    .tt-numbers.big .tt-num.n-center { font-size: 11px; }
    .tt-srcs { border-top: 1px solid var(--border); padding-top: 10px; }
    .tt-srcs-title { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--gold); margin-bottom: 7px; }
    .tt-src-group { margin-bottom: 9px; }
    .tt-src-group:last-child { margin-bottom: 0; }
    .tt-src-group .detail-line { font-size: 12.5px; line-height: 1.5; margin-top: 3px; }
    .tt-src-n { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
    .tt-detail-hint { padding: 40px 6px; text-align: center; font-size: 13px; color: var(--text-muted); line-height: 1.7; }

    /* 來源標籤配色：common.css 只定義了通用類別，這頁的幻卡專屬來源在此補齊 */
    .tt-srcs .src-tag.type-NPC對戰 { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.25); }
    /* 「NPC牌組」不是取得管道（只是對手手上有這張卡），刻意做得比取得方式弱 */
    .tt-srcs .src-tag.type-NPC牌組 { background: var(--raise); color: var(--text-muted); border-color: var(--border); }
    .tt-src-group.is-deck .detail-line { color: var(--text-muted); }
    .tt-npc-title { color: var(--text-muted); }
    .tt-deck-slot { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 5px; margin-left: 4px; }
    .tt-src-meta { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .tt-deck-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .tt-srcs .src-tag.type-副本,
    .tt-srcs .src-tag.type-多人副本,
    .tt-srcs .src-tag.type-討伐戰 { background: rgba(79,195,247,0.1); color: var(--blue); border-color: rgba(79,195,247,0.25); }
    .tt-srcs .src-tag.type-藏寶圖,
    .tt-srcs .src-tag[class*="商店"] { background: rgba(200,169,110,0.12); color: var(--gold); border-color: rgba(200,169,110,0.28); }

    /* NPC 位置地圖按鈕（點卡片其他區域＝勾已取得，點 📍＝開地圖） */
    .tt-loc {
      background: none; border: none; cursor: pointer; font-size: 12px;
      padding: 0 2px; line-height: 1; vertical-align: baseline;
    }
    .tt-loc:hover { transform: scale(1.25); }

    /* 窄螢幕：詳情移到手帳下方（點卡片時由 JS 捲進畫面），卡格仍保持 5 欄不改版面 */
    @media (max-width: 900px) {
      .tt-album { grid-template-columns: minmax(0, 1fr); }
      .tt-detail { position: static; }
      .tt-art { max-width: 176px; }
    }
    @media (max-width: 600px) {
      .tt-book { padding: 10px 10px 8px; }
      .tt-tabs { margin: -10px -10px 10px; padding: 8px 10px; gap: 3px; }
      .tt-tab, .tt-nav { height: 28px; font-size: 12px; padding: 0 7px; }
      .tt-tab { min-width: 28px; }
      .tt-tabs-info { width: 100%; margin-left: 0; }
      .tt-slots { gap: 5px; }
      .tt-slot-no { font-size: 9px; line-height: 13px; }
    }
  </style>
  <script src="../../assets/js/patch-gate.js"></script>
  <script src="../../assets/js/collection-tracker.js"></script>
  <script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/unlock-banner.js"></script>

<div class="container">

  <div class="tool-header">

    <p class="tool-subtitle">一頁 30 張的幻卡手帳（灰階＝還沒取得），點卡片看詳情、點右上 ✓ 標記已取得，進度自動儲存於瀏覽器</p>
    <div class="header-divider"></div>
  </div>

  <!-- 控制面（進度／工具列／篩選／分頁狀態）由 collection-tracker.js 渲染。
       這頁只有手帳一種呈現，所以引擎的卡片格線與分頁列都用 CSS 收起（見 style 內註解）。 -->
  <div id="ct-root"></div>

  <!-- 檢視切換：手帳（預設）／缺卡跑圖 -->
  <div class="tt-view-switch" role="group" aria-label="檢視切換">

    <button type="button" class="tt-view-btn" id="ttViewRoute" aria-pressed="false">&#x1F5FA;&#xFE0F; 缺卡跑圖</button>
  </div>

  <!-- 缺卡跑圖：只列打贏會給「我還缺的卡」的 NPC，依地圖分組（由 TTRoute 渲染） -->
  <div class="tt-route" id="ttRoute"></div>
  <!-- 手帳檢視：左頁籤＋30 格卡面，右詳情（內容由本頁下方的 TTAlbum 渲染） -->
  <div class="tt-album" id="ttAlbum">
    <div class="tt-book">
      <div class="tt-tabs" id="ttTabs"></div>
      <div class="tt-slots" id="ttSlots" tabindex="0" role="listbox" aria-label="幻卡手帳卡片格"></div>

        <button type="button" class="tt-foot-btn" id="ttFilterJump" title="跳到上方篩選區">⛛ 篩選</button>

<script>
/* ── 兩種檢視共用的小格式化 ───────────────────────────────────────── */
var TTFmt = (function () {
  var esc = CollectionTracker.esc;
  return {
    // 數值 10 在遊戲裡顯示成 A
    num: function (n) { return n === 10 ? 'A' : (n == null ? '?' : n); },
    // 四向數值十字
    numbers: function (num, extraClass) {
      num = num || {};
      var self = this;
      function cell(dir, v) {
        return '<div class="tt-num n-' + dir + (v === 10 ? ' n-A' : '') + '">' + esc(self.num(v)) + '</div>';
      }
      return '<div class="tt-numbers' + (extraClass ? ' ' + extraClass : '') + '">' +
        cell('top', num.top) + cell('left', num.left) +
        '<div class="tt-num n-center">🃏</div>' +
        cell('right', num.right) + cell('bottom', num.bottom) +
      '</div>';
    },
    // NPC 對戰的 📍 開地圖鈕（點它不切換取得狀態）
    locBtn: function (s) {
      var loc = s && s.location;
      if (!loc || loc.mapId == null) return '';
      return '<button class="tt-loc" title="開地圖看 NPC 位置"' +
        ' data-mapid="' + esc(loc.mapId) + '" data-x="' + esc(loc.x) + '" data-y="' + esc(loc.y) + '"' +
        ' data-npc="' + esc(s.npcName) + '" data-mapname="' + esc(loc.mapName) + '"' +
        ' data-kind="' + esc(s.type === 'NPC牌組' ? '牌組中有此卡' : 'NPC 對戰') + '">📍</button>';
    },
    // 一行來源說明。回空字串＝上游只給 id 沒給名稱（副本／藏寶圖），由呼叫端改標筆數
    srcLine: function (s) {
      // NPC對戰＝打贏可得（ItemPossibleReward）；NPC牌組＝這個 NPC 手上有這張卡（Fixed/Variable）。
      // 兩者是不同語意，2026-09-23 才拆開——先前 938 筆「NPC對戰」有 99.6% 其實是牌組。
      if ((s.type === 'NPC對戰' || s.type === 'NPC牌組') && s.npcName) {
        var line = esc(s.npcName);
        if (s.npcTitle) line += ' <span class="tt-npc-title">（' + esc(s.npcTitle) + '）</span>';
        if (s.location && s.location.mapName) {
          line += ' @ ' + esc(s.location.mapName) +
            ' (' + esc(s.location.x) + ', ' + esc(s.location.y) + ')' + this.locBtn(s);
        }
        if (s.type === 'NPC牌組' && s.slot) line += ' <span class="tt-deck-slot">' + esc(s.slot) + '</span>';
        var meta = [];
        if (s.fee) meta.push('入場費 ' + esc(s.fee) + ' MGP');
        if (s.rules && s.rules.length) meta.push('規則：' + esc(s.rules.join('、')));
        if (s.regionalRules) meta.push('含地區規則');
        if (meta.length) line += '<span class="tt-src-meta">' + meta.join('　') + '</span>';
        return line;
      }
      if (s.detail) {
        var d = esc(s.detail);
        // 成就的達成條件（台服官方說明文，2026-09-23 由 tw-locales 補）
        if (s.condition) d += '<span class="tt-src-meta">' + esc(s.condition) + '</span>';
        return d;
      }
      if (s.questId) return '任務 ID ' + esc(s.questId);
      return '';
    },
    openLoc: function (btn, cardName) {
      if (!window.ttOpenMap) return;
      var x = Number(btn.dataset.x), y = Number(btn.dataset.y);
      window.ttOpenMap({
        mapId: Number(btn.dataset.mapid), x: x, y: y,
        title: '🃏 ' + cardName,
        sub: (btn.dataset.kind || 'NPC 對戰') + '：' + btn.dataset.npc + ' · ' + btn.dataset.mapname,
        flagText: '/coord ' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + btn.dataset.mapname
      });
    }
  };
})();

/* ── 幻卡手帳 ─────────────────────────────────────────────────────
   版面刻意對齊遊戲內的幻卡手帳：一頁 5×6＝30 張、頁籤一次列 5 頁（«/» 換頁組）、
   右側是選中卡片的詳情、底部「總計 n/m」；未取得顯示灰階卡面（不是遊戲的「？」牌背）。
   ※ 篩選／排序／分頁／進度全部仍由引擎掌管：本區塊只負責呈現——
     引擎 pageSize 設成這裡的 PER_PAGE，每次 renderGrid() 後由 onRender 交出
     (list, pageSlice)，pageSlice 就是這一頁的 30 張。所以頁碼也跟著上網址 ?p=。 */
var TTAlbum = (function () {
  var PER_PAGE = 30, COLS = 5;
  var IMG_BASE = '../../assets/triple-triad/';
  var esc = CollectionTracker.esc;

  var tracker = null;         // 引擎實例（由 onRender 帶進來）
  var slice = [];             // 這一頁的卡片
  var listLen = 0, ownedInList = 0, pages = 1;
  var selId = null;
  var gamePageMap = null;     // id → 遊戲手帳頁碼（LIST 長度變了才重算）

  function $(id) { return document.getElementById(id); }
  function byId(id) {
    for (var i = 0; i < slice.length; i++) if (slice[i].id === id) return slice[i];
    return null;
  }
  function idxOf(id) {
    for (var i = 0; i < slice.length; i++) if (slice[i].id === id) return i;
    return -1;
  }

  /* 卡片顯示的編號。**遊戲的編號＝Order，不是資料的 row id**：
     420 張一般卡是 1–420；15 張 FF 歷代主角卡（uiPriority=5）在遊戲裡不在編號序列內，
     這裡照使用者指定標成「編號外 1–15」。row id 仍是進度存檔的鍵，不對使用者顯示。 */
  function cardNo(c) {
    var off = (c.uiPriority || 0) !== 0;
    var n = c.order || c.id;
    return { off: off, n: n, label: (off ? '編號外 ' : '編號 ') + n, short: (off ? '外' : '') + n };
  }

  /* ── 渲染 ── */
  // 頁碼列：15 頁全列出來，一鍵直達（原本 «/» 一次跳 5 頁很難用）。
  // 頁數多到排不下才退回「首末＋當前±3＋…」的視窗式。
  function pageList(page) {
    if (pages <= 20) {
      var all = [];
      for (var i = 0; i < pages; i++) all.push(i);
      return all;
    }
    var shown = [], prev = -1;
    for (var j = 0; j < pages; j++) {
      if (j === 0 || j === pages - 1 || Math.abs(j - page) <= 3) {
        if (prev >= 0 && j - prev > 1) shown.push(null);
        shown.push(j); prev = j;
      }
    }
    return shown;
  }

  function renderTabs() {
    var page = tracker ? tracker.page : 0;
    var h = '<button type="button" class="tt-nav" data-page="' + (page - 1) + '"' +
      (page === 0 ? ' disabled' : '') + ' title="上一頁（也可按 PageUp）">‹ 上一頁</button>';
    pageList(page).forEach(function (n) {
      if (n === null) { h += '<span class="tt-tab-gap">…</span>'; return; }
      h += '<button type="button" class="tt-tab' + (n === page ? ' active' : '') + '" data-page="' + n + '"' +
        (n === page ? ' aria-current="page"' : '') + ' title="第 ' + (n + 1) + ' 頁">' + (n + 1) + '</button>';
    });
    h += '<button type="button" class="tt-nav" data-page="' + (page + 1) + '"' +
      (page >= pages - 1 ? ' disabled' : '') + ' title="下一頁（也可按 PageDown）">下一頁 ›</button>' +
      '<span class="tt-tabs-info">第 ' + (page + 1) + ' / ' + pages + ' 頁</span>';
    $('ttTabs').innerHTML = h;
  }

  function renderSlots() {
    var host = $('ttSlots');
    if (!slice.length) {
      host.innerHTML = '<div class="tt-album-empty">找不到符合條件的幻卡</div>';
      return;
    }
    var h = '';
    slice.forEach(function (c) {
      var own = tracker.isOwned(c);
      var no = cardNo(c);
      // 未取得也照樣顯示卡面，只是灰階（使用者要看得到還沒收到的卡長什麼樣）
      var face = '<img src="' + IMG_BASE + esc(c.id) + '.webp" alt="" loading="lazy" decoding="async"' +
        ' onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;tt-ph&quot;>🃏</div>\'">';
      h += '<div class="tt-slot ct-card' + (own ? ' own owned' : ' miss') + (c.id === selId ? ' sel' : '') + '"' +
        ' role="option" aria-selected="' + (c.id === selId ? 'true' : 'false') +
        '" data-id="' + esc(c.id) + '" title="' + esc(no.label) + '　' + esc(c.name) + '">' +
        face +
        // 編號印在左下角（卡面自己的四向數值在中下，不會疊到），找特定編號不必逐張點開
        '<span class="tt-slot-no' + (no.off ? ' off' : '') + '">' + esc(no.short) + '</span>' +
        '<button type="button" class="ct-check" tabindex="-1" data-toggle="' + esc(c.id) + '"' +
          ' title="' + (own ? '取消已取得' : '標記為已取得') + '"' +
          ' aria-label="' + esc(no.label) + ' ' + esc(c.name) + (own ? '：已取得' : '：未取得') + '">✓</button>' +
      '</div>';
    });
    // 最後一頁不足 30 張也補空格，版面才不會忽長忽短（同遊戲）
    for (var i = slice.length; i < PER_PAGE; i++) h += '<div class="tt-slot empty" aria-hidden="true"></div>';
    host.innerHTML = h;
  }

  function renderFoot() {
    var all = tracker ? tracker.LIST.length : 0;
    $('ttTotal').innerHTML = '總計 <b>' + ownedInList + '</b> / <b>' + listLen + '</b>' +
      (listLen !== all ? '<i>（篩選中；全部 ' + all + ' 張）</i>' : '');
  }

  // 來源依類別分組。2026-07-28 起副本／卡包／任務都有繁中 detail 了（見
  // scripts/patch-triple-triad-source-names.mjs）；仍拿不到名稱的 11 筆會退回
  // 「型別 ×n」——那是 dungeons.json 沒收的內容（已下架的 Cape Westwind、異聞迷宮），
  // 要補請先補 dungeons.json，**不要在前端猜副本名**。
  function srcGroups(c) {
    var srcs = c.sources || [];
    if (!srcs.length) return '<div class="detail-line">待補充</div>';
    var order = [], byType = {};
    srcs.forEach(function (s) {
      var t = s.type || '其他';
      if (!byType[t]) { byType[t] = []; order.push(t); }
      byType[t].push(s);
    });
    return order.map(function (t) {
      var items = byType[t];
      var isDeck = t === 'NPC牌組';
      var lines = items.map(function (s) { return TTFmt.srcLine(s); }).filter(Boolean);
      return '<div class="tt-src-group' + (isDeck ? ' is-deck' : '') + '">' +
        '<span class="src-tag type-' + esc(t) + '">' + esc(t) + '</span>' +
        (lines.length < items.length ? '<span class="tt-src-n">×' + items.length + '</span>' : '') +
        // 這組不是取得管道，講清楚免得又被當成「打他就能拿」
        (isDeck ? '<div class="tt-deck-note">對局時對手手上會有這張卡，不代表打贏能拿到</div>' : '') +
        lines.map(function (l) { return '<div class="detail-line">' + l + '</div>'; }).join('') +
      '</div>';
    }).join('');
  }

  // 這張卡在「遊戲手帳」的第幾頁。算的是未篩選的完整清單（＝遊戲順序），所以站上
  // 篩選過後這個數字仍然是「進遊戲要翻到第幾頁」。編號 ≠ 位置：15 張主角卡被排到最後，
  // 其後每張卡的位置都比編號小 13，所以這行資訊實際上很常用得到。
  function gamePage(c) {
    if (!tracker) return null;
    if (!gamePageMap || gamePageMap.size !== tracker.LIST.length) {
      gamePageMap = new Map();
      tracker.LIST.forEach(function (e, i) { gamePageMap.set(e.id, Math.floor(i / PER_PAGE) + 1); });
    }
    return gamePageMap.get(c.id) || null;
  }

  function renderDetail() {
    var host = $('ttDetail');
    var c = byId(selId);
    if (!c) {
      host.innerHTML = '<div class="tt-detail-hint">點左邊的卡片看詳情<br>方向鍵移動、空白鍵標記已取得</div>';
      return;
    }
    var own = tracker.isOwned(c);
    var page = gamePage(c);
    host.innerHTML =
      '<div class="tt-detail-head">' +
        '<span class="tt-no' + (cardNo(c).off ? ' off' : '') + '">' + esc(cardNo(c).label) +
          (page ? '<span class="tt-page-of">手帳第 ' + page + ' 頁</span>' : '') + '</span>' +
        '<button type="button" class="tt-own-btn' + (own ? ' own' : '') + '" id="ttOwnBtn">' +
          (own ? '✓ 已取得' : '標記已取得') +
        '</button>' +
      '</div>' +
      '<div class="tt-art' + (own ? '' : ' miss') + '">' +
        '<img src="' + IMG_BASE + esc(c.id) + '.webp" alt="' + esc(c.name) + ' 卡面" decoding="async"' +
        ' onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;tt-ph&quot;>🃏</div>\'">' +
        (own ? '' : '<div class="tt-art-ribbon">未取得</div>') +
      '</div>' +
      '<div class="tt-dname">' + esc(c.name) + '</div>' +
      (c.nameEn ? '<div class="tt-den">' + esc(c.nameEn) + '</div>' : '') +
      '<div class="col-tags">' +
        '<span class="tag star-' + esc(c.stars) + '">★' + esc(c.stars) + '</span>' +
        (c.type ? '<span class="tag type-tag">' + esc(c.type) + '</span>' : '') +
        (c.patch ? '<span class="tag patch-tag">ver ' + esc(c.patch) + '</span>' : '') +
      '</div>' +
      TTFmt.numbers(c.numbers, 'big') +
      '<div class="tt-srcs"><div class="tt-srcs-title">取得方式</div>' + srcGroups(c) + '</div>';
  }

  function render() { renderTabs(); renderSlots(); renderFoot(); renderDetail(); }

  /* ── 互動 ── */
  function select(id, byUser) {
    if (id === selId) return;
    selId = id;
    renderSlots(); renderDetail();
    // 窄螢幕的詳情在手帳下方，點卡片時把它帶進畫面
    if (byUser && window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
      var d = $('ttDetail');
      if (d && d.scrollIntoView) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // 換頁一律經引擎（頁碼是引擎狀態，也才會同步到網址 ?p=）
  function goPage(p, pick) {
    if (!tracker) return;
    p = Math.max(0, Math.min(pages - 1, p));
    if (p === tracker.page) return;
    tracker.page = p;
    selId = null;                    // 交給 sync 自動選新頁第一張
    tracker.pushURL();
    tracker.renderGrid();            // → onRender → sync → render
    if (pick === 'last' && slice.length) select(slice[slice.length - 1].id, false);
  }

  // 走到這一頁的邊界就翻頁（同遊戲手感）
  function move(next, ev) {
    ev.preventDefault();
    if (next < 0) { goPage(tracker.page - 1, 'last'); return; }
    if (next >= slice.length) { goPage(tracker.page + 1, 'first'); return; }
    select(slice[next].id, true);
  }

  function onKey(ev) {
    if (!tracker || !slice.length) return;
    var i = idxOf(selId); if (i < 0) i = 0;
    switch (ev.key) {
      case 'ArrowRight': move(i + 1, ev); break;
      case 'ArrowLeft':  move(i - 1, ev); break;
      case 'ArrowDown':  move(i + COLS, ev); break;
      case 'ArrowUp':    move(i - COLS, ev); break;
      case 'Home':       ev.preventDefault(); select(slice[0].id, true); break;
      case 'End':        ev.preventDefault(); select(slice[slice.length - 1].id, true); break;
      case 'PageDown':   ev.preventDefault(); goPage(tracker.page + 1, 'first'); break;
      case 'PageUp':     ev.preventDefault(); goPage(tracker.page - 1, 'first'); break;
      case ' ':
      case 'Enter': {
        ev.preventDefault();
        var c = byId(selId);
        if (c) tracker.toggle(c);   // → renderGrid → sync → render
        break;
      }
    }
  }

  function wire() {
    $('ttSlots').addEventListener('click', function (ev) {
      var chk = ev.target.closest('.ct-check');
      if (chk) {
        var c = byId(Number(chk.dataset.toggle));
        if (c) { select(c.id, false); tracker.toggle(c); }
        // ✓ 鈕被重畫掉會讓焦點掉回 body，鍵盤操作接不下去 → 焦點還給卡格
        $('ttSlots').focus({ preventScroll: true });
        return;
      }
      var slot = ev.target.closest('.tt-slot');
      if (!slot || slot.classList.contains('empty')) return;
      select(Number(slot.dataset.id), true);
    });
    $('ttSlots').addEventListener('keydown', onKey);
    $('ttTabs').addEventListener('click', function (ev) {
      var b = ev.target.closest('.tt-tab, .tt-nav');
      if (b && !b.disabled) goPage(Number(b.dataset.page), 'first');
    });
    $('ttDetail').addEventListener('click', function (ev) {
      var loc = ev.target.closest('.tt-loc');
      var c = byId(selId);
      if (!c) return;
      if (loc) { TTFmt.openLoc(loc, c.name); return; }
      if (ev.target.closest('#ttOwnBtn')) tracker.toggle(c);
    });
    $('ttFilterJump').addEventListener('click', function () {
      var f = document.getElementById('ct-filters');
      if (f && f.scrollIntoView) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  return {
    PER_PAGE: PER_PAGE,
    // 引擎每次重畫格線後呼叫
    sync: function (list, pageSlice, tk) {
      tracker = tk;
      slice = pageSlice || [];
      listLen = list.length;
      ownedInList = list.filter(function (c) { return tk.isOwned(c); }).length;
      pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      // 選中的卡片不在這一頁（換頁／換篩選）→ 自動選這頁第一張，詳情永遠有內容（同遊戲）
      if (idxOf(selId) < 0) selId = slice.length ? slice[0].id : null;
      render();
    },
    boot: wire
  };
})();
TTAlbum.boot();
</script>
<script>
/* ── 缺卡跑圖 ─────────────────────────────────────────────────────
   回答的是「我還缺的卡，要去打誰」——外部工具站多半只列「這張卡誰有」，
   反過來以「我的缺卡」反查跑圖路線那一半沒人做。

   ⚠ **只認 `NPC對戰`，不認 `NPC牌組`。**
   兩者是不同語意（2026-09-23 才拆開，先前 938 筆「NPC對戰」有 99.6% 其實是牌組）：
     · NPC對戰（ItemPossibleReward）＝打贏可能拿到 → 這才是取得管道
     · NPC牌組（Fixed/Variable）＝對手手上有這張卡 → 打贏不見得拿得到
   把牌組也算進來的話，這頁會叫使用者跑一堆白跑的路。

   這個檢視刻意**不吃篩選／排序／分頁**：它問的是「我還缺什麼」而不是「這一頁有什麼」，
   所以取的是 tracker.LIST 全量（已過 patch-gate）＋ 擁有狀態。
   對應地，切到這個檢視時把引擎的工具列與篩選區收起來，免得調了沒反應。 */
var TTRoute = (function () {
  var esc = CollectionTracker.esc;
  var IMG_BASE = '../../assets/triple-triad/';
  var tracker = null;
  var mounted = false;
  var curMap = '';            // 地圖篩選（只在這次瀏覽有效，不進網址也不存）

  function $(id) { return document.getElementById(id); }

  function build() {
    if (!tracker) return '';
    var list = tracker.LIST || [];
    var missing = list.filter(function (c) { return !tracker.isOwned(c); });

    // NPC id → { 名稱, 地圖, 座標, 入場費, 規則, 缺卡[] }
    var byNpc = new Map();
    var coveredIds = new Set();
    missing.forEach(function (c) {
      (c.sources || []).forEach(function (s) {
        if (s.type !== 'NPC對戰') return;
        if (!s.npcName || !s.location || s.location.mapId == null) return;
        var key = s.npcId + '@' + s.location.mapId;
        if (!byNpc.has(key)) {
          byNpc.set(key, {
            npcId: s.npcId, name: s.npcName, title: s.npcTitle || null,
            mapId: s.location.mapId, mapName: s.location.mapName,
            x: s.location.x, y: s.location.y,
            fee: s.fee != null ? s.fee : null,
            rules: Array.isArray(s.rules) ? s.rules : [],
            src: s, cards: []
          });
        }
        byNpc.get(key).cards.push(c);
        coveredIds.add(c.id);
      });
    });

    var npcs = [...byNpc.values()];
    var restN = missing.length - coveredIds.size;

    if (!missing.length) {
      return '<div class="tt-route-sum"><b>全部收齊了</b>——' + list.length + ' 張都已標記取得。</div>';
    }

    // 依地圖分組；組內「能補的缺卡張數」多的排前面，同數依入場費低的優先
    var byMap = new Map();
    npcs.forEach(function (n) {
      if (!byMap.has(n.mapId)) byMap.set(n.mapId, { mapId: n.mapId, name: n.mapName, npcs: [] });
      byMap.get(n.mapId).npcs.push(n);
    });
    var maps = [...byMap.values()];
    maps.forEach(function (m) {
      /* ⚠ **排序鍵不可以是缺卡數**（知識庫 §3.19）。這頁的使用情境就是「站在 NPC 前面
         一邊打一邊標記」——依缺卡數排的話，每標記一張那個對手的數字就掉一格、
         整份清單當場重排，剛在看的那列跑掉了。改用固定值：地圖 id → NPC id，
         順序永遠一樣。「哪張圖最划算」的決策交給上面的地圖選單（那是出發前看一次的東西，
         不是一邊操作一邊讀的清單）。 */
      m.npcs.sort(function (a, b) { return a.npcId - b.npcId; });
      m.total = m.npcs.reduce(function (n, x) { return n + x.cards.length; }, 0);
    });
    maps.sort(function (a, b) { return a.mapId - b.mapId; });

    var sum = '<div class="tt-route-sum">' +
      '還缺 <b>' + missing.length + '</b> 張，其中 <b>' + coveredIds.size + '</b> 張打得到 NPC 取得，' +
      '分佈在 <b>' + maps.length + '</b> 張地圖的 <b>' + npcs.length + '</b> 個對手身上。' +
      (restN ? '<br><span class="warn">另外 ' + restN + ' 張要從卡包、副本、任務等管道拿，不在這張清單裡。</span>' : '') +
      '<br><span class="warn">列的是「打贏<b>可能</b>拿到」——幻卡是機率掉落，同一個對手常常要打好幾次。' +
      '對手牌組裡有某張卡不代表打贏就給，所以這裡只算真正的對戰獎勵。</span>' +
      '</div>';

    /* 63 張地圖排下來一頁一萬八千像素，找特定一張圖只能用捲的。
       加一個地圖選單當跳板——**不另外做排序選單**：順序已經是「一趟能補最多的在前」，
       那是這個檢視唯一有意義的排法（同市場頁製作計畫的理由，知識庫 §3.19）。 */
    // 選單依「可補張數」由多到少——那是出發前看一次的決策，不是一邊操作一邊讀的清單，
    // 所以這裡用會變的值排是安全的（下面的清單則一律固定順序）。
    var menu = maps.slice().sort(function (a, b) { return b.total - a.total || a.mapId - b.mapId; });
    var pick = '<div class="tt-route-pick">' +
      '<label for="ttRouteMap">地圖</label>' +
      '<select id="ttRouteMap" title="選單依可補張數排序；下方清單固定依地圖與 NPC 編號排，標記取得不會讓它重排">' +
      '<option value="">全部（' + maps.length + ' 張）</option>' +
      menu.map(function (m) {
        return '<option value="' + esc(m.name) + '"' + (curMap === m.name ? ' selected' : '') + '>' +
          esc(m.name) + '（' + m.total + ' 張）</option>';
      }).join('') + '</select></div>';

    if (curMap) maps = maps.filter(function (m) { return m.name === curMap; });

    var body = maps.map(function (m) {
      return '<div class="tt-map-head">' +
          '<span class="tt-map-name">' + esc(m.name) + '</span>' +
          '<span class="tt-map-n">' + m.npcs.length + ' 個對手 · 可補 ' + m.total + ' 張</span>' +
        '</div>' +
        m.npcs.map(function (n) {
          var meta = [];
          if (n.fee != null) meta.push('入場 ' + n.fee.toLocaleString() + ' MGP');
          if (n.rules.length) meta.push('規則：' + n.rules.join('、'));
          return '<div class="tt-npc">' +
            '<div class="tt-npc-head">' +
              '<span class="tt-npc-name">' + esc(n.name) + '</span>' +
              (n.title ? '<span class="tt-npc-at">' + esc(n.title) + '</span>' : '') +
              '<span class="tt-npc-at">' + esc(n.x) + ', ' + esc(n.y) + '</span>' +
              TTFmt.locBtn(n.src) +
              '<span class="tt-npc-n">缺 ' + n.cards.length + ' 張</span>' +
            '</div>' +
            (meta.length ? '<div class="tt-npc-meta">' + esc(meta.join('　·　')) + '</div>' : '') +
            '<div class="tt-npc-cards">' + n.cards.map(function (c) {
              return '<span class="tt-mini">' +
                '<img src="' + IMG_BASE + esc(c.id) + '.webp" alt="" loading="lazy" decoding="async"' +
                ' onerror="this.remove()">' +
                esc(c.name) +
                (c.stars ? '<span class="st">' + '★'.repeat(c.stars) + '</span>' : '') +
              '</span>';
            }).join('') + '</div>' +
          '</div>';
        }).join('');
    }).join('');

    return sum + pick + body;
  }

  function render() {
    var host = $('ttRoute');
    if (!host) return;
    host.innerHTML = build();
    var sel = $('ttRouteMap');
    if (sel) sel.addEventListener('change', function () { curMap = sel.value; render(); });
  }

  function setMode(route) {
    document.body.classList.toggle('tt-route-mode', !!route);
    var a = $('ttViewAlbum'), r = $('ttViewRoute');
    if (a) { a.classList.toggle('active', !route); a.setAttribute('aria-pressed', String(!route)); }
    if (r) { r.classList.toggle('active', !!route); r.setAttribute('aria-pressed', String(!!route)); }
    if (route) render();
    try { localStorage.setItem('ffxiv_triad_view', route ? 'route' : 'album'); } catch (e) {}
  }

  return {
    mount: function (tk) {
      tracker = tk;
      if (mounted) return;
      mounted = true;
      var a = $('ttViewAlbum'), r = $('ttViewRoute');
      if (a) a.addEventListener('click', function () { setMode(false); });
      if (r) r.addEventListener('click', function () { setMode(true); });
      // 記住上次看的是哪個檢視（純偏好，存 localStorage 沒問題）
      var saved = null;
      try { saved = localStorage.getItem('ffxiv_triad_view'); } catch (e) {}
      if (saved === 'route') setMode(true);

      // 標記取得／清除進度後要重算——缺卡清單是這個檢視的全部內容
      if (window.SGT_SHORTCUTS) {
        window.SGT_SHORTCUTS.register([{ keys: 'r', label: '切換手帳／缺卡跑圖', run: function () {
          setMode(!document.body.classList.contains('tt-route-mode'));
        } }]);
      } else {
        (window.SGT_SHORTCUTS_PENDING = window.SGT_SHORTCUTS_PENDING || []).push([
          { keys: 'r', label: '切換手帳／缺卡跑圖', run: function () {
            setMode(!document.body.classList.contains('tt-route-mode'));
          } }
        ]);
      }
    },
    // 引擎每次 renderGrid() 後呼叫；只有正在看跑圖時才重畫
    refresh: function (tk) {
      tracker = tk;
      if (document.body.classList.contains('tt-route-mode')) render();
    },
    // 引擎實例的存取口（回歸腳本用它標記取得後驗清單有沒有跟著變）
    tracker: function () { return tracker; }
  };
})();

CollectionTracker.init({
  dataUrl: '../../data/triple-triad.json',
  metaUrl: '../../data/_meta.json',
  storageKey: 'ffxiv_triadcards_owned',
  snapKey: 'triad',
  fileBase: 'triple-triad',
  schema: 'triple-triad-progress',
  verb: '取得',
  unit: '張',
  noun: '幻卡',
  searchPlaceholder: '搜尋幻卡名稱、NPC、地點…',
  // 一頁 30 張＝手帳的一頁（頁碼同步到網址 ?p=，可分享）
  pageSize: TTAlbum.PER_PAGE,
  onRender: function (list, pageSlice, tracker) {
    TTAlbum.sync(list, pageSlice, tracker);
    // 跑圖檢視吃的是「全部缺卡」而不是這一頁，但標記取得後一樣要重算
    TTRoute.mount(tracker);
    TTRoute.refresh(tracker);
  },
  // 台服有沒有這張卡＝data 的 name 有沒有值（name 只來自台服 items.json 的卡片道具名，
  // 見 scripts/patch-triple-triad-new-cards.mjs）。**不要再加「名稱要有中文字」那條**：
  // 台服官方就有一批拉丁字母卡名（9S／2P／2B／N-7000／Ark Angel MR–EV／Prishe／Shadow Lord），
  // 加了會把這 11 張正常開放的卡誤判成未開放而整批消失。
  include: function (c, gp) { return !!c.name && PatchGate.released(c.patch, gp); },
  // 預設排序＝遊戲手帳的排列順序，**不是編號**：先 uiPriority 再 order。
  // 15 張 FF 歷代主角卡（編號 68–80／252／405）在遊戲裡 uiPriority=5，整批被排到
  // 最後一頁而不是自己的編號位置；照 id 排的話每一頁都會跟遊戲對不起來。
  // 兩欄由 scripts/patch-triple-triad-new-cards.mjs 從 TripleTriadCardResident 帶入。
  prepare: function (list) {
    return list.slice().sort(function (a, b) {
      return ((a.uiPriority || 0) - (b.uiPriority || 0))
        || ((a.order || a.id || 0) - (b.order || b.id || 0))
        || ((a.id || 0) - (b.id || 0));
    });
  },
  searchText: function (c) {
    var parts = [c.name, c.nameEn];
    (c.sources || []).forEach(function (s) {
      if (s.detail) parts.push(s.detail);
      if (s.npcName) parts.push(s.npcName);
      if (s.location && s.location.mapName) parts.push(s.location.mapName);
    });
    return parts.filter(Boolean).join(' ').toLowerCase();
  },
  sorts: ['patch-desc', 'patch-asc', 'name'],
  filters: [
    {
      id: 'star', label: '星級',
      options: function (list) {
        var set = new Set(list.map(function (c) { return c.stars; }).filter(function (s) { return s != null; }));
        return Array.from(set).sort(function (a, b) { return a - b; }).map(function (s) { return { value: String(s), label: '★' + s }; });
      },
      match: function (c, v) { return c.stars === Number(v); }
    },
    {
      id: 'type', label: '類型',
      options: function (list) {
        var set = new Set(); list.forEach(function (c) { if (c.type) set.add(c.type); });
        return Array.from(set).sort().map(function (t) { return { value: t, label: t }; })
          .concat([{ value: '__none__', label: '無特殊類型' }]);
      },
      match: function (c, v) { return v === '__none__' ? !c.type : c.type === v; }
    },
    {
      id: 'source', label: '取得方式',
      options: function (list) {
        var set = new Set();
        list.forEach(function (c) { (c.sources || []).forEach(function (s) { if (s.type) set.add(s.type); }); });
        // 「NPC牌組」不是取得方式（只是對手手上有這張卡），不列進這組篩選
        set.delete('NPC牌組');
        return Array.from(set).sort().map(function (t) { return { value: t, label: t }; });
      },
      match: function (c, v) { return (c.sources || []).some(function (s) { return s.type === v; }); }
    },
    { kind: 'patch' }
  ],
  // 卡片由手帳畫（見上方 TTAlbum），引擎的格線不顯示，所以這裡不產生內容。
  // 引擎仍會為每張卡建一個空的 .col-card——那是它綁「點擊切換已取得」的地方，
  // 手帳自己有 ✓ 章與詳情鈕，不靠它。
  card: function () { return ''; }
});
</script>
<script type="module">
/* NPC 位置地圖：共用迷你地圖彈窗，maps.json 首次點擊才載入 */
import { initMapModal, openMapModal } from '../../assets/js/map-modal.js';
let ready = null;
window.ttOpenMap = async function (opts) {
  if (!ready) {
    ready = fetch('../../data/maps.json')
      .then(r => r.json())
      .then(j => initMapModal({ mapsData: j.data, base: '../..' }));
  }
  try { await ready; } catch (e) {
    ready = null;
    // 失敗要講出來：原本只 return，點了地圖鈕完全沒反應（2026-10-03 補）
    if (window.Toast) Toast.show('地圖資料載入失敗，請稍後再試', 'error');
    return;
  }
  openMapModal(opts);
};
</script>
</body>
</html>
